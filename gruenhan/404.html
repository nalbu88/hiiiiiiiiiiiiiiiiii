<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seite nicht gefunden – Grünhan</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/main.css">
  <style>
    .nf { min-height: 80vh; display: grid; place-items: center; text-align: center; padding-block: 64px; }
    .nf__code { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--grau); letter-spacing: .08em; }
    .nf h1 { font-size: var(--t-3xl); font-stretch: 76%; letter-spacing: -.035em; line-height: .9; margin: 18px 0; }
    .nf h1 em { font-family: var(--f-serif); font-weight: 400; font-stretch: 100%; color: var(--gruen-tief); }
    .nf p { color: var(--grau); max-width: 44ch; margin: 0 auto 28px; font-size: var(--t-lg); }
    .nf svg { width: min(260px, 70vw); height: auto; margin: 0 auto 8px; }
  </style>
</head>
<body>
  <main class="wrap nf">
    <div>
      <svg viewBox="0 0 260 120" aria-hidden="true"><path d="M10 110h40v-20h40v-20h40v-20h40v-20h40v-20h40" fill="none" stroke="#0F2A20" stroke-width="4" stroke-linejoin="round"/><path d="M10 92L210 2" stroke="#B3243E" stroke-width="2" stroke-dasharray="6 6"/><rect x="205" y="0" width="10" height="10" fill="#B3243E"/></svg>
      <p class="nf__code">FEHLER 404</p>
      <h1>Ha noi!<br><em>Die Seite gibt’s net.</em></h1>
      <p>Diese Stäffele führt leider ins Leere. Vielleicht wurde die Seite verschoben – oder sie war nie da.</p>
      <a class="btn btn--green" href="index.html">Zurück zur Startseite <span class="btn__arrow" aria-hidden="true">→</span></a>
    </div>
  </main>

</html>
