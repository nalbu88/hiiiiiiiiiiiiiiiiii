l_english:
 plm.1.t: "A Proposal from Mr Phiel"
 plm.1.d: "Teter Phiel arrived at the Presidential Palace with two engineers, a crate of punch cards and a contract. For an hour he showed President Smetona what his machine could do: it had predicted the price of flax, the size of the harvest and the result of the last three football matches in Kaunas.\n\n'I call it Palanmir,' he said. 'Lithuania will be the first country in the world to know everything about itself. The price is reasonable. The returns are not.'"
 plm.1.a: "Sign the contract."
 plm.1.b: "Sign it - but ask for a discount."
 plm.2.t: "Smetona's Dilemma"
 plm.2.d: "Palanmir has been running for months, and its predictions are uncannily good. Now Mr Phiel has asked to be appointed Chief Executive of the Nation, with full authority to run the state 'on Palanmir's recommendations'.\n\nPresident Smetona has built the state for twenty years. He looks at the numbers, and at Mr Phiel, for a long time."
 plm.2.a: "The numbers do not lie. Appoint him."
 plm.2.b: "Appoint him - and retire with dignity."
 plm.20.t: "A Palanmir Data Leak"
 plm.20.d: "Newspapers in [PLM_leak_client.GetNameDef] have discovered that the Palanmir system their government bought from us sends a copy of everything it collects to Kaunas. The story is on every front page, and their ambassador has asked for an explanation.\n\nMr Phiel's office has prepared a statement: 'Palanmir respects the privacy of every client. Except for the data.'"
 plm.20.a: "Apologise, and pay for the inconvenience."
 plm.20.b: "Deny everything - and keep the data."
 plm.30.t: "The Vilnius Ultimatum"
 plm.30.d: "[From.GetNameDefCap] demands the return of Vilnius, 'the historic capital of the Lithuanian nation, held by Poland since 1920'. The note is short and very well informed: it lists the strength of every Polish unit in the region, the state of our railways and the mood of our cabinet.\n\nSomebody in Kaunas knows a great deal about us."
 plm.30.a: "Give them Vilnius."
 plm.30.b: "Not one inch."
 plm.31.t: "Vilnius Is Lithuanian"
 plm.31.d: "Poland has accepted our ultimatum. After almost twenty years, Vilnius is Lithuanian again. Palanmir had predicted the outcome to within a day."
 plm.31.a: "Vilnius!"
 plm.32.t: "Poland Refuses"
 plm.32.d: "Poland has rejected our ultimatum. Palanmir had estimated the chance of this at 38 per cent and recommends the military option."
 plm.32.a: "Follow the recommendation."
 plm.32.b: "Not yet."
 plm.101.t: "Palanmir Reaches Level [?PLM_palanmir_level|0]"
 plm.101.d: "Palanmir has collected §Y[?PLM_data|0]§! data points and has reached level §Y[?PLM_palanmir_level|0]§!. Research, construction and factory efficiency all improve.\n\nAt the same time, the clerks of the Data Ministry report that the people are becoming somewhat less enthusiastic about the system. Palanmir has noted their names."
 plm.101.a: "Excellent."
