 # Characters
 ODL_ilham_aliyev: "Ilham Aliyev"
 ODL_ilham_aliyev_desc: "The President of the Republic. How a baby came to hold the office nobody in Baku can quite explain, but the nation adores him, the newspapers print his photograph every morning, and the Regency Council governs in his name until he is old enough to do it himself.\n\nHis advisers say he has a great future ahead of him."
 ODL_mammad_amin_rasulzade: "Mammad Amin Rasulzade"
 ODL_mammad_amin_rasulzade_desc: "Leader of the Musavat party and the man who proclaimed the Azerbaijan Democratic Republic on 28 May 1918. A journalist, a democrat and a patriot, he has spent the years since then defending the Republic he founded."
 ODL_ruhulla_akhundov: "Ruhulla Akhundov"
 ODL_ruhulla_akhundov_desc: "Leader of the Azerbaijani Communist Party, a journalist and a translator of Lenin. In this world his party sits in opposition in Baku, and waits for a signal from Moscow."
 ODL_jeyhun_hajibeyli: "Jeyhun Hajibeyli"
 ODL_khalil_bey_khasmammadov: "Khalil bey Khasmammadov"
