 # National spirits
 ODL_regency_council: "The Regency Council"
 ODL_regency_council_desc: "The President is a baby. Until he grows up, a council of ministers, generals and oilmen signs the laws in his name - and argues about every one of them."
 ODL_regency_musavat: "Regency of the Musavat"
 ODL_regency_musavat_desc: "Rasulzade and the Musavat govern for the President: carefully, legally and with the consent of parliament."
 ODL_regency_oil_barons: "Regency of the Oil Barons"
 ODL_regency_oil_barons_desc: "The oilmen of the Absheron govern for the President, and the Republic is run like a very profitable company."
 ODL_regency_generals: "Regency of the Generals"
 ODL_regency_generals_desc: "The generals govern for the President, and the Republic is run like a barracks."
 ODL_presidential_rule: "Presidential Rule"
 ODL_presidential_rule_desc: "The President has taken charge. Nobody argues with him - he has never lost an argument yet."
 ODL_presidential_nursery: "The Presidential Nursery"
 ODL_presidential_nursery_desc: "Inspired by the President, the Republic is having a baby boom."
 ODL_latin_alphabet: "The Latin Alphabet"
 ODL_latin_alphabet_desc: "A literate nation, writing its own language in its own alphabet."
 ODL_the_eternal_flame_idea: "The Eternal Flame"
 ODL_the_eternal_flame_idea_desc: "Like the fires of Yanar Dag, the Republic will never go out."
 ODL_black_gold: "Black Gold"
 ODL_black_gold_desc: "The oil of the Absheron peninsula makes the Republic rich and the great powers attentive."
 ODL_oil_wealth: "Oil Wealth"
 ODL_oil_wealth_desc: "With the pipeline to the Black Sea, Baku's oil flows to the whole world, and the world's money flows back."
 ODL_oil_fund: "The Oil Fund"
 ODL_oil_fund_desc: "A share of every barrel is saved for the future."
 ODL_national_army: "The National Army"
 ODL_national_army_desc: "Conscription makes the army a school of the nation."
 ODL_fire_guard: "The Fire Guard"
 ODL_fire_guard_desc: "The elite of the National Army, sworn before the flames of Yanar Dag."
 ODL_neutral_caspian: "The Neutral Caspian"
 ODL_neutral_caspian_desc: "Armed, rich and friends with everyone: the Switzerland of the Caucasus."
 ODL_land_of_fire: "Odlar Yurdu"
 ODL_land_of_fire_desc: "The Land of Fire is whole: North and South, Baku and Tabriz, one nation in one state."

 # Decision categories
 ODL_president_category: "The Infant President"
 ODL_president_category_desc: "How grown-up is the President? §Y[?ODL_ilham_stage|0]§! (0: a baby, 1: a toddler, 2: a boy wonder). The nation follows every step."
 ODL_oil_category: "The Baku Oil Fields"
 ODL_oil_category_desc: "The wells of the Absheron peninsula are the Republic's fortune. Drill, refine, and sell to whoever pays best."
 ODL_southern_category: "The Southern Question"
 ODL_southern_category_desc: "Tabriz and Urmia are Azerbaijani cities ruled from Tehran.\n\nSupport for union in the south: §Y[?ODL_tabriz_support|0]%§!. At §Y60%§! the committees are ready to rise, and Tehran can be pressed to cede the provinces."
 ODL_formable_category: "Odlar Yurdu"
 ODL_formable_category_desc: "Odlar Yurdu - the Land of Fire - is the old name of Azerbaijan, for the flames that rise from its earth. Unite Baku with Tabriz and West Azerbaijan, and the Land of Fire will be whole."

 # Decisions
 ODL_presidential_photograph: "A Photograph with the President"
 ODL_presidential_photograph_desc: "Nothing raises the nation's spirits like a photograph of the President in his sailor suit."
 ODL_the_presidents_birthday: "The President's Birthday"
 ODL_the_presidents_birthday_desc: "A national holiday, a parade, and a very large cake."
 ODL_drill_new_wells: "Drill New Wells"
 ODL_drill_new_wells_desc: "New fields on the Absheron peninsula wait to be drilled."
 ODL_expand_the_black_city: "Expand the Black City"
 ODL_expand_the_black_city_desc: "Another refinery for the Black City."
 ODL_offer_oil_concession: "Offer an Oil Concession"
 ODL_offer_oil_concession_desc: "A foreign company may drill in the Republic. It builds a factory in return - and takes a share of the oil."
 ODL_oil_for_arms: "Oil for Arms"
 ODL_oil_for_arms_desc: "Oil deliveries, paid for in rifles and equipment."
 ODL_fund_the_tabriz_committees: "Fund the Tabriz Committees"
 ODL_fund_the_tabriz_committees_desc: "Money, newspapers and organisers for the Azerbaijani committees south of the Araz."
 ODL_demand_south_azerbaijan: "Demand South Azerbaijan"
 ODL_demand_south_azerbaijan_desc: "Tehran is in no position to refuse. Demand Tabriz and Urmia."
 ODL_proclaim_odlar_yurdu_decision: "Proclaim Odlar Yurdu"
 ODL_proclaim_odlar_yurdu_decision_desc: "Baku, Tabriz and Urmia are free together. Proclaim Odlar Yurdu, the Land of Fire."

 # Tooltips
 ODL_the_baby_president_tt: "The President is a baby. The focuses §YFirst Words§! and §YSchool Days§! let him grow up; §YThe President Takes Charge§! ends the regency.\n"
 ODL_the_regency_council_tt: "Choose who sits on the §YRegency Council§!: the Musavat, the oil barons or the generals.\n"
 ODL_grow_up_to_toddler_tt: "The President grows up: he is now a §Ytoddler§!.\n"
 ODL_grow_up_to_boy_tt: "The President grows up: he is now a §Yboy wonder§!.\n"
 ODL_end_regency_tt: "The §YRegency§! ends.\n"
 ODL_tabriz_support_up_20_tt: "Support for union in the south: §G+20%§!\n"
 ODL_invite_caucasian_members_tt: "Georgia, Armenia, Turkey and Iran are invited to join §YThe Caucasian House§!.\n"
 ODL_tabriz_is_ready_tt: "Support for union in the south is at least §Y60%§!"
 ODL_iran_is_weak_tt: "Iran is at war, unstable (below §Y40%§! stability) or a subject of another country"
 ODL_wells_limit_tt: "Fewer than §Y3§! new fields drilled"
 ODL_refineries_limit_tt: "Fewer than §Y2§! refineries added"
 ODL_concessions_limit_tt: "Fewer than §Y3§! concessions granted"
 ODL_now_proclaim_tt: "We can now proclaim §YOdlar Yurdu§!.\n"

