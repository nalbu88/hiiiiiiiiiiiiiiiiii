l_english:
 dzg.1.t: "The Westerplatte Question"
 dzg.1.d: "The Westerplatte is a sandy peninsula at the mouth of our harbour, and since 1926 it has been a Polish military transit depot: ammunition bunkers, a barracks and a guard of two hundred Polish soldiers. Every Danziger who sails out of the harbour passes under Polish guns.\n\nThe Senate can demand that the depot be closed, or it can treat the Poles as tenants and make them pay for the privilege."
 dzg.1.a: "The Poles must leave the Westerplatte."
 dzg.1.b: "Tenants pay rent. Let them pay."
 dzg.1.c: "Refer the matter to the League."
 dzg.2.t: "A Patron for the Free City"
 dzg.2.d: "A city of four hundred thousand cannot hold a border against Germany or Poland alone. One of the great powers must be persuaded that an independent Danzig is in its interest.\n\nWhich capital should our envoys visit first?"
 dzg.2.a: "London: the Royal Navy rules the Baltic approaches."
 dzg.2.b: "Paris: France signed the treaty that made us."
 dzg.2.c: "Rome: Mussolini likes small friends."
 dzg.2.e: "Moscow: the enemy of our enemies."
 dzg.3.t: "The Free City of Danzig Asks for Protection"
 dzg.3.d: "Envoys from [From.GetNameDef] have arrived with a request: a formal guarantee of the Free City's independence against both Germany and Poland. They point out that a free Danzig keeps the Baltic open for everybody's trade."
 dzg.3.a: "We will guarantee the Free City."
 dzg.3.b: "We cannot commit ourselves in the Baltic."
 dzg.5.t: "An Alliance in the Baltic"
 dzg.5.d: "[From.GetNameDefCap] invites us to join its alliance. The small states between Germany and Russia, its envoys say, will hang separately if they do not stand together."
 dzg.5.a: "We will stand together."
 dzg.5.b: "We prefer to keep our hands free."
 dzg.7.t: "The Perpetual Neutrality of Danzig"
 dzg.7.d: "[From.GetNameDefCap] has declared its perpetual neutrality, in the manner of Switzerland, and asks us to sign a treaty of non-aggression to recognise it."
 dzg.7.a: "We recognise the Free City's neutrality."
 dzg.7.b: "We recognise nothing of the kind."
 dzg.10.t: "Danzig Demands [dzg_demanded_state.GetName]"
 dzg.10.d: "The government of [From.GetNameDef] has delivered a formal note: it claims [dzg_demanded_state.GetName] as rightfully belonging to the Free City and asks us to transfer it peacefully.\n\nIt is an absurd demand from a city-state - unless our own position is weaker than we would like to admit."
 dzg.10.a: "Let them have it."
 dzg.10.b: "Absolutely not."
 dzg.11.t: "[From.GetNameDefCap] Gives Way"
 dzg.11.d: "Against every expectation in the foreign press, [From.GetNameDef] has agreed to hand over the province. Our flags are going up over the town halls."
 dzg.11.a: "The Free City grows."
 dzg.12.t: "[From.GetNameDefCap] Refuses"
 dzg.12.d: "[From.GetNameDefCap] has rejected our note in terms that leave no room for a second one. If the province is to be ours, it will not be by diplomacy."
 dzg.12.a: "We will remember this."
 dzg.13.t: "An Offer for [dzg_demanded_state.GetName]"
 dzg.13.d: "The Bank of Danzig has made us an offer for [dzg_demanded_state.GetName]: a large sum in hard gulden for a province that costs us more to govern than it earns. Our finance ministry is tempted."
 dzg.13.a: "Sell."
 dzg.13.b: "Our land is not for sale."
 dzg.14.t: "[From.GetNameDefCap] Accepts Our Offer"
 dzg.14.d: "The bargain is struck. Danzig has bought a province, as merchant cities did in the old days."
 dzg.14.a: "Money well spent."
 dzg.15.t: "[From.GetNameDefCap] Will Not Sell"
 dzg.15.d: "Our offer has been refused. The Bank of Danzig keeps most of the money it set aside."
 dzg.15.a: "Their loss."
 dzg.20.t: "Forster's Putsch"
 dzg.20.d: "Gauleiter Forster has called his storm troopers onto the streets. They are occupying the radio station and the railway station and demanding that the Senate resign in favour of a government that will 'bring Danzig home to the Reich'. The Senate Police and the Landespolizei are waiting for orders."
 dzg.20.a: "Fight them in the streets."
 dzg.20.b: "We cannot win this. Let Danzig go home."
 dzg.31.t: "The Free City Appeals to Us"
 dzg.31.d: "The new democratic government of [From.GetNameDef] reminds us that the Free City was created by the Allied powers at Versailles and asks for a guarantee of its independence."
 dzg.31.a: "Danzig shall not stand alone."
 dzg.31.b: "Danzig is not worth a war."
 dzg.32.t: "Reconciliation with Danzig"
 dzg.32.d: "The democratic government of [From.GetNameDef] proposes to end the customs war: Polish cargoes back in the port of Danzig, Danzig's goods back on the Polish railways, and a joint commission for the harbour."
 dzg.32.a: "An end to the customs war."
 dzg.32.b: "Gdynia is enough for us."
 dzg.33.t: "Danzig Asks to Join Us"
 dzg.33.d: "[From.GetNameDefCap] asks to join our alliance openly, as a democracy that will not survive on its own."
 dzg.33.a: "Welcome."
 dzg.33.b: "We cannot defend Danzig."
 dzg.40.t: "The House of Hohenzollern Answers"
 dzg.40.d: "Our envoys found Prince Louis Ferdinand at the airfield of Tempelhof, in Lufthansa uniform. The Kaiser in Doorn has given his blessing, the Crown Prince his reluctant consent. The prince has read the Senate's offer twice and asked only one question: 'Will the people of Danzig want me?'"
 dzg.40.a: "They will, Your Highness."
 dzg.41.t: "The Royal Wedding"
 dzg.41.d: "The King has married Grand Duchess Kira Kirillovna of Russia in the Marienkirche. Danzig has not seen so many crowns since the Polish kings came to collect their dues. The Russian emigration from Paris to Belgrade sends its congratulations."
 dzg.41.a: "Long live the King and Queen!"
 dzg.43.t: "The Royal Standard in [dzg_royalist_state.GetName]"
 dzg.43.d: "The landowners and the old officers of [dzg_royalist_state.GetName] have declared for the King in Danzig. Our garrison is outnumbered and the local administration is with the rebels. We can let the province go or fight for it."
 dzg.43.a: "Let it go."
 dzg.43.b: "Crush the royalists."
 dzg.50.t: "The General Strike"
 dzg.50.d: "At six in the morning the sirens of the Schichau yard sounded, and the city stopped: no trams, no trains, no ships, no bread. By noon the dockers had taken the harbour and the Landespolizei had refused to fire on them. By evening the Senate had fled to Zoppot. The workers' council has proclaimed the Danzig Soviet Republic."
 dzg.50.a: "All power to the councils!"
 dzg.51.t: "The Danzig Soviet Asks to Join the Comintern"
 dzg.51.d: "The workers' government of [From.GetNameDef] asks to join our international alliance. A red Danzig would be a thorn in the side of both Germany and Poland - and a port on the Baltic."
 dzg.51.a: "Welcome, comrades."
 dzg.51.b: "We cannot defend Danzig."
 dzg.53.t: "Mutiny in [dzg_mutiny_state.GetName]"
 dzg.53.d: "Sailors and dockers in [dzg_mutiny_state.GetName] have mutinied and raised the red flag, calling on the province to join the Baltic Commune. The garrison is wavering."
 dzg.53.a: "Let them go."
 dzg.53.b: "Restore order."
 dzg.60.t: "An Evening at the Forest Opera"
 dzg.60.d: "The first night of the summer season. Twenty thousand people sit on the hillside in the beech forest above Zoppot: dock workers next to senators, Germans next to Poles, Kashubian fishermen with their wives. When the overture begins, the whole Free City falls silent at once."
 dzg.60.a: "Bravo!"
 dzg.80.t: "Berlin Demands Danzig's Return"
 dzg.80.d: "The German government has demanded that the Free City of Danzig 'return home to the Reich', ending the separation imposed at Versailles. The Gauleiter is already planning the celebrations."
 dzg.80.a: "Danzig returns to the Reich."
 dzg.80.b: "The Free City stays free."
 dzg.81.t: "Danzig Refuses"
 dzg.81.d: "[From.GetNameDefCap] has refused to return to the Reich."
 dzg.81.a: "Then we will take it."
 dzg.90.t: "Warsaw Proposes a Union"
 dzg.90.d: "The Free City now depends on Poland for its trade, its credit and its security. The Polish government proposes to make the arrangement permanent: Danzig would keep its Senate and its laws, and Poland would speak for it to the world."
 dzg.90.a: "Accept the Polish proposal."
 dzg.90.b: "We are a Free City."
 dzg.91.t: "Berlin Demands Anschluss"
 dzg.91.d: "With the Free City deep in the Reich's pocket, Gauleiter Forster has delivered Berlin's message: it is time for Danzig to come home."
 dzg.91.a: "Danzig comes home."
 dzg.91.b: "Not today."
