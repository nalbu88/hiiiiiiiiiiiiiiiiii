l_english:
 brs_news.1.t: "Danzig Defies Berlin"
 brs_news.1.d: "The Senate of the Free City of Danzig has told the German consul that it 'no longer takes advice from the Reich Chancellery'. The Gauleiter's office on Hansaplatz has been searched by the city police, and the swastika banners have come down from the Town Hall.\n\nIn Berlin, the Propaganda Ministry calls it treason against the German people. In Warsaw, nobody quite knows what to call it."
 brs_news.1.a: "Danzig belongs to the Danzigers."
 brs_news.1.b: "They will regret this."
 brs_news.1.c: "A small city with a big nerve."
 brs_news.2.t: "The New Hanseatic League"
 brs_news.2.d: "In the Artushof of Danzig, where the merchants of the Hansa once met, delegates from the ports of the Baltic have signed the charter of a New Hanseatic League. Free trade between its members, a common court for disputes - and, the treaty adds quietly, a promise to stand together if any of them is attacked.\n\n'Merchants, not generals, will keep the peace in the Baltic,' said [From.GetLeader]."
 brs_news.2.a: "The Hansa lives again!"
 brs_news.2.b: "A league of shopkeepers - but a rich one."
 brs_news.3.t: "A King in Prussia"
 brs_news.3.d: "Crowds filled the Long Market of Danzig today to see a Hohenzollern crowned King of Prussia, the first since 1918. The new king swore to rule 'by the law and with the consent of the estates', and the Free City, it seems, is free no longer: it is a royal capital.\n\nIn Berlin, the regime has banned all reporting of the ceremony. Across Germany, old soldiers are said to have raised a glass anyway."
 brs_news.3.a: "Long live the King!"
 brs_news.3.b: "A Hohenzollern pretender is a threat to the Reich."
 brs_news.3.c: "The Prussian crown returns - in Danzig, of all places."
 brs_news.4.t: "The Baltic Socialist Federation"
 brs_news.4.d: "The workers' councils of Danzig have proclaimed a Baltic Socialist Federation, with the Free Soviet City as its capital and an open invitation to every Baltic people 'to throw off their landlords and generals'.\n\nThe red flag flies over the Crane Gate, and the shipyards are working day and night."
 brs_news.4.a: "Workers of the Baltic, unite!"
 brs_news.4.b: "Our comrades in Danzig have chosen the right side."
 brs_news.4.c: "A red flag on the Vistula."
 brs_news.5.t: "The Danziger Reich"
 brs_news.5.d: "The Free City of Danzig is no more. In a ceremony on the Long Market, [From.GetLeader] has proclaimed the 'Danziger Reich', a state 'that bows neither to Berlin nor to Warsaw', and has announced the creation of a national army.\n\nObservers note that the new Reich's maps show borders considerably wider than the old Free City's."
 brs_news.5.a: "Danzig stands on its own!"
 brs_news.5.b: "This cannot be allowed to stand."
 brs_news.5.c: "Another Reich - and a hungry one."
 brs_news.10.t: "Azov United Proclaimed in Sevastopol"
 brs_news.10.d: "Sixteen years after the armistice that saved the last White state, South Russia has a new name and a new master. Before a parade of Cossacks and veterans, General Anton Turkul has proclaimed 'Azov United', a state 'of one union, one sea and one army', and promised that the war of 1920 'is not over'.\n\nForeign correspondents note that the new state's army is larger than that of many countries ten times its size."
 brs_news.10.a: "One union, one sea, one army!"
 brs_news.10.b: "The White bandits are dreaming again."
 brs_news.10.c: "The Whites have found a new leader."
 brs_news.11.t: "The Whites March Again"
 brs_news.11.d: "At dawn the guns of the Perekop line opened fire for the first time since 1920. The armies of [From.GetNameDef] have crossed into Soviet territory, and their leaders call on the Cossacks of the Don and the Kuban to rise.\n\nThe Russian Civil War, it seems, was never over."
 brs_news.11.a: "Onwards, to Moscow!"
 brs_news.11.b: "The White Guard will be crushed - again."
 brs_news.11.c: "The Russian Civil War begins anew."
