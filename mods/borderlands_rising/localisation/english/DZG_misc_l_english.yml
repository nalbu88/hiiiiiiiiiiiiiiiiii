l_english:
 # Characters
 DZG_arthur_greiser: "Arthur Greiser"
 DZG_arthur_greiser_desc: "Senate President of the Free City since 1934. A Great War airman and failed businessman who rose through the Danzig NSDAP, Greiser governs the city while his rival, Gauleiter Albert Forster, governs the party - and reports to Berlin."
 DZG_sean_lester: "Seán Lester"
 DZG_sean_lester_desc: "An Irish journalist and diplomat, the League of Nations High Commissioner in Danzig since 1934. He defends the Free City's constitution against the Senate with more courage than the League has ever shown him."
 DZG_arthur_brill: "Arthur Brill"
 DZG_arthur_brill_desc: "Chairman of the Danzig Social Democrats since 1921. A trade unionist from the docks, he has watched his party's newspapers banned and its meetings broken up, and he is still here."
 DZG_richard_stachnik: "Richard Stachnik"
 DZG_richard_stachnik_desc: "A Catholic priest and historian who led the Danzig Centre Party in the 1935 elections. A moderate who speaks to Germans and Poles alike."
 DZG_anton_plenikowski: "Anton Plenikowski"
 DZG_anton_plenikowski_desc: "Leader of the Danzig Communists, who stood for the Volkstag in 1935 as 'List Plenikowski' after the party itself was banned."
 DZG_ernst_ziehm: "Ernst Ziehm"
 DZG_ernst_ziehm_desc: "A German National jurist, Senate President from 1931 to 1933. He speaks for the old conservative Danzig of merchant houses and civil servants."
 DZG_hermann_rauschning: "Hermann Rauschning"
 DZG_hermann_rauschning_desc: "A West Prussian landowner who became Senate President for the NSDAP in 1933, saw Hitler up close, and resigned in disgust in 1934. A conservative who has become the movement's most dangerous critic."
 DZG_louis_ferdinand: "Louis Ferdinand"
 DZG_louis_ferdinand_desc: "Prince Louis Ferdinand of Prussia, grandson of Wilhelm II and, since his elder brother renounced the succession, heir of the House of Hohenzollern. He worked on the Ford assembly line in Detroit and flies for Lufthansa. He has no love for the Nazis."
 DZG_albert_forster: "Albert Forster"
 DZG_heinrich_sahm: "Heinrich Sahm"
