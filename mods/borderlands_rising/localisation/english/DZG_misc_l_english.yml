 # Spirits
 DZG_league_protectorate: "League of Nations Protectorate"
 DZG_league_protectorate_desc: "The Free City lives under the protection of the League of Nations, whose High Commissioner guards the constitution. Nobody may attack Danzig without answering to Geneva - but the treaty also forbids it an army worth the name."
 DZG_polish_customs_union: "The Polish Customs Union"
 DZG_polish_customs_union_desc: "Poland collects Danzig's customs, runs its railways and represents it abroad. Every investment needs two permits and every quarrel with Warsaw is fought in the harbour."
 DZG_polish_partnership: "The Polish Partnership"
 DZG_polish_partnership_desc: "Warsaw and the Free City run the port together, and Polish trade flows through Danzig rather than Gdynia."
 DZG_reich_subsidies: "Reich Subsidies"
 DZG_reich_subsidies_desc: "Berlin pays the Senate's bills. Berlin expects to be obeyed."
 DZG_sovereign_port: "A Sovereign Port"
 DZG_sovereign_port_desc: "The Free City collects its own duties and sets its own tariffs."
 DZG_polish_credit: "Polish Credit"
 DZG_polish_credit_desc: "Polish banks lend to Danzig's builders on easy terms."
 DZG_open_air_concert: "Open Air Concert"
 DZG_open_air_concert_desc: "Every summer the Forest Opera of Zoppot fills its hillside with the whole Free City. Music does what the Volkstag cannot: it makes Danzig one city."
 DZG_baltic_pearl: "The Pearl of the Baltic"
 DZG_baltic_pearl_desc: "Rich, cultured and free."
 DZG_emergency_decree: "Government by Decree"
 DZG_emergency_decree_desc: "The Senate governs by emergency decree."
 DZG_corporate_senate: "The Corporate Senate"
 DZG_corporate_senate_desc: "Guilds of employers and workers under the Senate's chairmen."
 DZG_free_state_youth_idea: "The Free State Youth"
 DZG_free_state_youth_idea_desc: "A youth movement in the city's red and white."
 DZG_danziger_reich_spirit: "The Danziger Reich"
 DZG_danziger_reich_spirit_desc: "Neither Berlin's nor Warsaw's: the Danziger Reich answers to itself."
 DZG_restored_constitution: "The Restored Constitution"
 DZG_restored_constitution_desc: "The constitution of 1920, restored under the League's supervision."
 DZG_dockworkers_charter: "The Dockworkers' Charter"
 DZG_dockworkers_charter_desc: "Fair wages and safe yards for the men who built the city."
 DZG_catholic_social_compact: "The Catholic Social Compact"
 DZG_catholic_social_compact_desc: "Church, unions and employers sit at one table."
 DZG_social_insurance: "Social Insurance"
 DZG_social_insurance_desc: "Pensions, sickness insurance and unemployment relief."
 DZG_league_shield: "The League's Shield"
 DZG_league_shield_desc: "A democratic Free City keeps the full protection of the League of Nations."
 DZG_hanseatic_spirit: "The Hanseatic Spirit"
 DZG_hanseatic_spirit_desc: "Merchants, shipwrights and scholars: the virtues of the old Hansa."
 DZG_armed_neutrality_idea: "Armed Neutrality"
 DZG_armed_neutrality_idea_desc: "The Free City will fight anybody who crosses its border, and nobody else."
 DZG_directorate: "The Directorate"
 DZG_directorate_desc: "A government above party, of the city's notables."
 DZG_gulden_reserves: "Gulden Reserves"
 DZG_gulden_reserves_desc: "The Bank of Danzig's reserves of hard currency."
 DZG_black_eagle_order: "The Order of the Black Eagle"
 DZG_black_eagle_order_desc: "The highest order of the Prussian crown, revived in Danzig."
 DZG_royal_prussian_army_idea: "The Royal Prussian Army"
 DZG_royal_prussian_army_idea_desc: "The drill, the staff and the officer corps of the old Prussian army."
 DZG_kingdom_of_prussia_spirit: "The Kingdom of Prussia"
 DZG_kingdom_of_prussia_spirit_desc: "Prussia lives again, with its King in Danzig."
 DZG_free_soviet_city: "The Free Soviet City"
 DZG_free_soviet_city_desc: "The councils of the docks and yards govern the city."
 DZG_collective_werder: "The Collective Werder"
 DZG_collective_werder_desc: "The delta farms belong to the labourers who work them."
 DZG_peoples_tribunals: "The People's Tribunals"
 DZG_peoples_tribunals_desc: "The commune judges its enemies in public."
 DZG_baltic_commune_spirit: "The Baltic Commune"
 DZG_baltic_commune_spirit_desc: "A council republic of the Baltic ports."
 DZG_citizens_in_arms_idea: "Citizens in Arms"
 DZG_citizens_in_arms_idea_desc: "Every Danziger of military age trains with the reserve."
 DZG_street_fighters: "Street Fighters"
 DZG_street_fighters_desc: "Danzig will be defended house by house."
 DZG_unbreakable_city: "The Unbreakable City"
 DZG_unbreakable_city_desc: "Bastions, bunkers and flooded polders."
 DZG_army_of_the_free_city_idea: "Army of the Free City"
 DZG_army_of_the_free_city_idea_desc: "A small army, very well trained."
 DZG_baltic_raiders_idea: "Baltic Raiders"
 DZG_baltic_raiders_idea_desc: "Submarines and torpedo boats that hunt in the Baltic."
 DZG_free_city_navy_idea: "Navy of the Free City"
 DZG_free_city_navy_idea_desc: "A Hanseatic fleet again."
 DZG_baltic_air_shield_idea: "The Baltic Air Shield"
 DZG_baltic_air_shield_idea_desc: "Fighters, flak and an observer on every church tower."
 DZG_danzig_gulden: "The Danzig Gulden"
 DZG_danzig_gulden_desc: "The hardest currency between the Oder and the Dnieper."
 DZG_zoppot_casino_idea: "The Zoppot Casino"
 DZG_zoppot_casino_idea_desc: "The house always wins, and the house is the Free City."
 DZG_industrial_plan: "The Free City Industrial Plan"
 DZG_industrial_plan_desc: "A plan for every quay and every workshop."
 DZG_technische_hochschule_idea: "The Technische Hochschule"
 DZG_technische_hochschule_idea_desc: "The best engineering school between Berlin and Leningrad."
 DZG_queen_of_the_vistula_idea: "Queen of the Vistula"
 DZG_queen_of_the_vistula_idea_desc: "Danzig commands the river again."

 # Unit
 dzg_oppressed_soldiers: "Oppressed Soldiers"
 dzg_oppressed_soldiers_desc: "Dockers, fishermen, refugees and the unemployed of the Free City, who have the least to lose and fight like it. Stronger than regular infantry in every respect and especially stubborn in cities, at a higher cost in manpower, training and supply."

 # Decisions
 DZG_danzig_question_category: "The Danzig Question"
 DZG_danzig_question_category_desc: "Berlin and Warsaw both pull at the Free City. Lean towards one to get its help against the other - or keep the city free."
 DZG_court_berlin: "Court Berlin"
 DZG_court_berlin_desc: "Ask the Reich for help - and accept its strings."
 DZG_court_warsaw: "Court Warsaw"
 DZG_court_warsaw_desc: "Ask Poland for credit and cargoes."
 DZG_assert_the_free_city: "Assert the Free City"
 DZG_assert_the_free_city_desc: "Remind both neighbours that Danzig belongs to the Danzigers."
 DZG_claims_category: "The Free City's Claims"
 DZG_claims_category_desc: "Danzig claims land from both of its neighbours. It can ask for it, buy it, or take it.\n\nA neighbour is most likely to give way when it is at war, losing, or in civil war; Germany when the Danzig Question leans towards Warsaw, Poland when it leans towards Berlin."
 DZG_demand_state: "Demand [FROM.GetName]"
 DZG_demand_state_desc: "Formally demand the transfer of a state we claim."
 DZG_demand_state_tt: "The owner will decide whether to give way. If it refuses, we may later take the state by force."
 DZG_purchase_state: "Make an Offer for [FROM.GetName]"
 DZG_purchase_state_desc: "The Bank of Danzig offers to buy a state we claim. If the offer is refused, most of the money comes back."
 DZG_purchase_state_tt: "The owner will decide whether to sell for §Y150§! political power."
 DZG_war_for_the_corridor: "War for the Corridor"
 DZG_war_for_the_corridor_desc: "Poland has had its chance."
 DZG_war_for_prussia: "War for Prussia"
 DZG_war_for_prussia_desc: "The Reich has had its chance."
 DZG_war_for_memel: "War for Memel"
 DZG_war_for_memel_desc: "Memel will be a free port of the Danzig sphere, by force if need be."
 DZG_integrate_state: "Integrate [FROM.GetName]"
 DZG_integrate_state_desc: "Extend the Free City's courts, schools and franchise to a state we own."
 DZG_forster_category: "Forster's Network"
 DZG_forster_category_desc: "Gauleiter Albert Forster's network of party men, informers and storm troopers reaches into every office of the Free City. Its strength: §Y[?DZG_forster_network]§! of 100. At 100 he will move against the Senate."
 DZG_arrest_forsters_lieutenants: "Arrest Forster's Lieutenants"
 DZG_arrest_forsters_lieutenants_desc: "A night of arrests in the Gau offices."
 DZG_seize_the_party_treasury: "Seize the Party Treasury"
 DZG_seize_the_party_treasury_desc: "The Gau's accounts are frozen by order of the Senate."
 DZG_win_over_the_storm_troopers: "Win Over the Storm Troopers"
 DZG_win_over_the_storm_troopers_desc: "The brown-shirted rank and file care more about jobs than about Forster."
 DZG_turn_the_senate_police: "Turn the Senate Police on the Gau"
 DZG_turn_the_senate_police_desc: "The Senate's own guard closes Forster's offices."
 DZG_hansa_category: "The Hanseatic Kontors"
 DZG_hansa_category_desc: "Merchant houses of the Free City in the ports of the Baltic and the North Sea. Open kontors: §Y[?DZG_kontor_count]§!. The third, sixth and ninth each bring a civilian factory."
 DZG_open_kontor: "Open a Kontor in [FROM.GetName]"
 DZG_open_kontor_desc: "A Danzig merchant house in a foreign port."
 DZG_kontor_reward_tt: "Every third kontor adds a §Ycivilian factory§!."
 DZG_harbour_category: "The Neutral Harbour"
 DZG_harbour_category_desc: "The Free City leases its quays to whoever pays, and the Bank of Danzig raises money where the treasury cannot."
 DZG_lease_harbour: "Lease Quays to [FROM.GetName]"
 DZG_lease_harbour_desc: "A long lease on a quay and a warehouse district."
 DZG_lease_limit_tt: "At most §Y3§! leases can be signed (currently §Y[?DZG_leases]§!)."
 DZG_bank_bond_issue: "Issue Gulden Bonds"
 DZG_bank_bond_issue_desc: "The Bank of Danzig borrows abroad at a fair rate."
 DZG_crown_category: "The Prussian Crown"
 DZG_crown_category_desc: "The King in Danzig wins over the Junker estates of the old Prussian provinces, one by one, and waits for the Reich to falter."
 DZG_win_over_the_junkers: "Win Over the Junkers of [FROM.GetName]"
 DZG_win_over_the_junkers_desc: "Letters from the King, visits from the princes, promises of titles."
 DZG_raise_the_royal_standard: "Raise the Royal Standard in [FROM.GetName]"
 DZG_raise_the_royal_standard_desc: "The Junkers of the province declare for the King."
 DZG_raise_the_royal_standard_tt: "The owner must decide whether to let the province go, or fight for it."
 DZG_royal_pamphlets: "Royal Pamphlets in the Reich"
 DZG_royal_pamphlets_desc: "Monarchist leaflets in every German officers' mess."
 DZG_crown_war_on_berlin: "The King's War on Berlin"
 DZG_crown_war_on_berlin_desc: "The Reich is falling. Its rightful King will pick up the pieces."
 DZG_red_category: "Red Danzig"
 DZG_red_category_desc: "Strikes, cells and mutinies: the commune is built in the yards and exported through the ports."
