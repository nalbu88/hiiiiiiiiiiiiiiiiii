l_english:
 DZG_danzig_focus_tree: "Free City of Danzig"
 DZG_shortcut_foreign: "The Danzig Question"
 DZG_shortcut_military: "The Armed Forces"
 DZG_shortcut_politics: "The Volkstag Crisis"
 DZG_shortcut_economy: "The Free Port"
 DZG_shortcut_society: "The Forest Opera"

 # Foreign policy
 DZG_the_danzig_question: "The Danzig Question"
 DZG_the_danzig_question_desc: "Every chancellery in Europe has an opinion about Danzig, and none of them asked the Danzigers. Berlin wants the city back, Warsaw wants its port, Geneva wants a quiet life. It is time the Free City had a policy of its own."
 DZG_lean_on_berlin: "Lean on Berlin"
 DZG_lean_on_berlin_desc: "Three hundred thousand Germans, a German university and a German Senate: Berlin will pay to keep the Free City on its side, in rifles if not in marks. The price is a longer leash for the Gauleiter."
 DZG_the_westerplatte_question: "The Westerplatte Question"
 DZG_the_westerplatte_question_desc: "On the Westerplatte peninsula, inside our own harbour, Poland keeps an ammunition depot and a garrison of two hundred men. It is the most hated half-mile of land in the city."
 DZG_lean_on_warsaw: "Lean on Warsaw"
 DZG_lean_on_warsaw_desc: "Two thirds of Poland's sea trade still passes through our quays. If Warsaw sends its cargoes to Danzig rather than to Gdynia, the Free City grows rich. Warsaw will want something in return."
 DZG_the_corridor_question: "The Corridor Question"
 DZG_the_corridor_question_desc: "The Polish Corridor cuts us off from Germany and Gdynia steals our trade. If Berlin is behind us, the Corridor is ours to ask for."
 DZG_break_the_customs_union: "Break the Customs Union"
 DZG_break_the_customs_union_desc: "Polish customs officers stand on our quays and Polish tariffs set our prices. The Free City will collect its own duties from now on."
 DZG_memel_free_port_treaty: "The Memel Free Port Treaty"
 DZG_memel_free_port_treaty_desc: "Memel, like Danzig, was cut off from Germany at Versailles and handed to a neighbour. A treaty between the two free ports of the Baltic would profit both - and Memel would remember who its friends were."
 DZG_the_kashubian_question: "The Kashubian Question"
 DZG_the_kashubian_question_desc: "The Kashubian fishermen and farmers around the bay are neither German nor quite Polish. Their villages fill our markets and their sons could fill our barracks."
 DZG_the_vistula_delta: "The Vistula Delta"
 DZG_the_vistula_delta_desc: "Marienburg, Elbing and the polders of the delta were cut away from Danzig by the borders of 1920. With Warsaw's backing, Germany could be asked to give them back to the city they always traded with."
 DZG_pomeranian_ambitions: "Pomeranian Ambitions"
 DZG_pomeranian_ambitions_desc: "Stolp, Köslin and the coast of Further Pomerania: if the Corridor is ours, the land beyond it should be too."
 DZG_the_polish_post_office: "The Polish Post Office"
 DZG_the_polish_post_office_desc: "Poland runs its own post office, its own railway directorate and its own telephone lines inside our city. Those days are over."
 DZG_baltic_diplomacy: "Baltic Diplomacy"
 DZG_baltic_diplomacy_desc: "Riga, Reval, Kaunas, Helsinki and Stockholm are old partners of the Hanseatic city. The small states of the Baltic need each other more than any of them needs a great power."
 DZG_kashubian_volunteers: "Kashubian Volunteers"
 DZG_kashubian_volunteers_desc: "Fishermen who know every sandbank of the bay make excellent soldiers and better pilots."
 DZG_east_prussian_ambitions: "East Prussian Ambitions"
 DZG_east_prussian_ambitions_desc: "Königsberg is an island of Germany cut off by the Corridor. Danzig is the natural capital of the whole Vistula and Pregel country."
 DZG_rival_of_warsaw: "Rival of Warsaw"
 DZG_rival_of_warsaw_desc: "If Poland will not give way, the Free City will prepare to take what it is owed."
 DZG_rival_of_warsaw_tt: "Unlocks the decision §YWar for the Corridor§!, which gives a war goal against Poland if Poland has refused one of our demands, or is at war with a great power, losing, or in civil war."
 DZG_seek_a_great_power_patron: "Seek a Great Power Patron"
 DZG_seek_a_great_power_patron_desc: "A city of four hundred thousand cannot stand alone between Germany and Poland. Somebody larger must promise to come if we call."
 DZG_rival_of_berlin: "Rival of Berlin"
 DZG_rival_of_berlin_desc: "The Reich will not hand back the Vistula delta out of kindness. The Free City will prepare to take what it is owed."
 DZG_rival_of_berlin_tt: "Unlocks the decision §YWar for Prussia§!, which gives a war goal against Germany if Germany has refused one of our demands, or is at war with a great power, losing, or in civil war."
 DZG_both_rivals_tt: "Unlocks the decisions §YWar for the Corridor§! and §YWar for Prussia§!."
 DZG_integrate_the_new_territories: "Integrate the New Territories"
 DZG_integrate_the_new_territories_desc: "The new provinces must become Danzig in more than name: courts, schools, tax offices and the right to vote in the Volkstag."
 DZG_the_baltic_shield: "The Baltic Shield"
 DZG_the_baltic_shield_desc: "Alone, each of the small Baltic states is a morsel. Together they are an army."
 DZG_queen_of_the_vistula: "Queen of the Vistula"
 DZG_queen_of_the_vistula_desc: "For five hundred years every grain of wheat that came down the Vistula was weighed, sold and shipped in Danzig. The city is the Queen of the river again."

 # Army
 DZG_the_landespolizei: "The Landespolizei"
 DZG_the_landespolizei_desc: "The Free City has no army - only a police force with barracks, machine guns, artillery and officers from the old Imperial Army. It is time to drill it like an army."
 DZG_tear_up_the_demilitarisation_clause: "Tear Up the Demilitarisation Clause"
 DZG_tear_up_the_demilitarisation_clause_desc: "Versailles forbade the Free City fortresses and an army. The League that guaranteed it can no longer enforce it. We will defend ourselves."
 DZG_the_oppressed_soldiers: "The Oppressed Soldiers"
 DZG_the_oppressed_soldiers_desc: "Dock labourers laid off by the customs war, Kashubian fishermen, refugees from both sides of the border: the people with the least to lose are the hardest to beat. Give them rifles, officers and a reason, and they will hold any street in Europe."
 DZG_the_oppressed_soldiers_tt: "Unlocks the §YOppressed Soldiers§! battalion: line infantry with §G+20%§! more strength, §G+10§! organisation, §G+20%§! soft attack and defence and §G+10%§! breakthrough compared with regular infantry, strong in cities. It needs more manpower and training time."
 DZG_bischofsberg_barracks: "The Bischofsberg Barracks"
 DZG_bischofsberg_barracks_desc: "The old Prussian barracks on the Bischofsberg can be turned into an arms works within months."
 DZG_hagelsberg_fortress: "The Hagelsberg Fortress"
 DZG_hagelsberg_fortress_desc: "Napoleon's engineers fortified the Hagelsberg in 1807. The new works will be dug deeper."
 DZG_citizens_in_arms: "Citizens in Arms"
 DZG_citizens_in_arms_desc: "Every Danziger of military age will train with the Landespolizei reserve one weekend a month."
 DZG_oppressed_soldiers_doctrine: "Doctrine of the Oppressed"
 DZG_oppressed_soldiers_doctrine_desc: "Small units, initiative from below, officers who march at the front. The Oppressed Soldiers will fight their own way."
 DZG_street_fighting_doctrine: "Street Fighting Doctrine"
 DZG_street_fighting_doctrine_desc: "Danzig will be defended house by house. Every block of the Rechtstadt is a fortress if the men inside know how to hold it."
 DZG_vistula_pioneers: "The Vistula Pioneers"
 DZG_vistula_pioneers_desc: "River crossings, demolitions and pontoon bridges: the delta is a maze of water and dykes, and engineers are worth a battalion each."
 DZG_artillery_of_the_bastions: "Artillery of the Bastions"
 DZG_artillery_of_the_bastions_desc: "The guns on the old bastions will be replaced with modern pieces that can reach the Corridor."
 DZG_staff_college: "The Staff College"
 DZG_staff_college_desc: "A real army needs a real general staff. The Landespolizei academy becomes a war college."
 DZG_motorised_police: "Motorised Police"
 DZG_motorised_police_desc: "Lorries and motorcycles can move a battalion of the Oppressed Soldiers from Zoppot to the Werder in an hour."
 DZG_armoured_cars_of_the_free_city: "Armoured Cars of the Free City"
 DZG_armoured_cars_of_the_free_city_desc: "The Landespolizei's armoured cars are the seed of an armoured force."
 DZG_the_unbreakable_city: "The Unbreakable City"
 DZG_the_unbreakable_city_desc: "Bastions, bunkers, flooded polders and men who know every cellar: Danzig will not fall to a coup de main."
 DZG_veterans_of_the_great_war: "Veterans of the Great War"
 DZG_veterans_of_the_great_war_desc: "Thousands of men in the city fought in Flanders and Galicia. Their experience is the Free City's cheapest weapon."
 DZG_officer_school_of_langfuhr: "The Officer School of Langfuhr"
 DZG_officer_school_of_langfuhr_desc: "The Technical University in Langfuhr will train engineers in uniform as well as out of it."
 DZG_the_mobile_reserve: "The Mobile Reserve"
 DZG_the_mobile_reserve_desc: "A motorised brigade held back in the city can strike at any breach in the line."
 DZG_army_of_the_free_city: "Army of the Free City"
 DZG_army_of_the_free_city_desc: "The Landespolizei is dead. Long live the Army of the Free City of Danzig."
 DZG_brotherhood_of_the_oppressed: "Brotherhood of the Oppressed"
 DZG_brotherhood_of_the_oppressed_desc: "The Oppressed Soldiers have become a legend in the Baltic ports. Volunteers arrive every week from Gdynia, Königsberg and Memel."

 # Navy
 DZG_schichau_contracts: "Schichau Contracts"
 DZG_schichau_contracts_desc: "The Schichau yard built torpedo boats for the Kaiser. Its slipways are empty; fill them."
 DZG_danziger_werft: "The Danziger Werft"
 DZG_danziger_werft_desc: "The old Imperial Dockyard, now the Danziger Werft, knows how to build submarines. Nobody has asked it to since 1918."
 DZG_coastal_flotilla: "The Coastal Flotilla"
 DZG_coastal_flotilla_desc: "Torpedo boats and minesweepers to keep the Bay of Danzig open."
 DZG_neufahrwasser_u_boat_pens: "The Neufahrwasser U-Boat Pens"
 DZG_neufahrwasser_u_boat_pens_desc: "Concrete pens at the mouth of the harbour will shelter a submarine flotilla from any bomber."
 DZG_minefields_of_the_bay: "Minefields of the Bay"
 DZG_minefields_of_the_bay_desc: "The approaches to Danzig are shallow and narrow. A few hundred mines will close them."
 DZG_baltic_raiders: "Baltic Raiders"
 DZG_baltic_raiders_desc: "A small navy cannot win a battle at sea. It can make sure nobody else's merchantmen sleep at night."
 DZG_marine_infantry: "Marine Infantry"
 DZG_marine_infantry_desc: "Seebataillone, trained to land on the Hela peninsula and the Frische Nehrung."
 DZG_free_city_navy: "Navy of the Free City"
 DZG_free_city_navy_desc: "Danzig, a Hanseatic city since 1361, has a fleet again."

 # Air force
 DZG_danziger_luftpost: "Danziger Luftpost"
 DZG_danziger_luftpost_desc: "The Danzig air mail company and its airfield at Langfuhr are the nucleus of an air arm."
 DZG_junkers_licence: "The Junkers Licence"
 DZG_junkers_licence_desc: "Junkers built aircraft in Danzig in the twenties, when Versailles forbade it in Germany. The workshops and the know-how are still here."
 DZG_langfuhr_fighter_wing: "The Langfuhr Fighter Wing"
 DZG_langfuhr_fighter_wing_desc: "A single wing of fighters over the city will make any bomber think twice."
 DZG_dive_bomber_staffel: "The Dive Bomber Staffel"
 DZG_dive_bomber_staffel_desc: "Against a larger army, the only answer is to break its spearhead from the air."
 DZG_coastal_patrol_squadron: "The Coastal Patrol Squadron"
 DZG_coastal_patrol_squadron_desc: "Seaplanes to watch the bay and hunt submarines."
 DZG_baltic_air_shield: "The Baltic Air Shield"
 DZG_baltic_air_shield_desc: "Fighters, flak and an observer network on every church tower."
 DZG_the_bomber_wing: "The Bomber Wing"
 DZG_the_bomber_wing_desc: "A handful of bombers that can reach the rail junctions of the Corridor and East Prussia is the Free City's longest arm."

 # Politics
 DZG_the_volkstag_crisis: "The Volkstag Crisis"
 DZG_the_volkstag_crisis_desc: "The NSDAP won half the seats in the Volkstag and behaves as if it had won all of them. The opposition appeals to the League High Commissioner, the Gauleiter takes his orders from Berlin, the dockers are on the edge of a strike and the old conservatives dream of a king. The Free City must decide what it is."
 DZG_the_volkstag_crisis_tt: "Opens the five political paths: §YGreiser's Senate§! (fascist), §YThe Geneva Appeal§! (democratic, non-aligned or monarchist) and §YRed Danzig§! (communist)."
 DZG_greisers_senate: "Greiser's Senate"
 DZG_greisers_senate_desc: "Senate President Arthur Greiser holds the government; Gauleiter Albert Forster holds the party. They loathe each other. Greiser means to rule Danzig for Danzig."
 DZG_the_enabling_decree: "The Enabling Decree"
 DZG_the_enabling_decree_desc: "The Senate will govern by decree, and the first decrees will be aimed at the Gauleiter's network."
 DZG_the_senate_police: "The Senate Police"
 DZG_the_senate_police_desc: "A guard loyal to the Senate rather than to the Gau: recruited in Danzig, paid by Danzig, sworn to the Senate President."
 DZG_purge_the_gau: "Purge the Gau"
 DZG_purge_the_gau_desc: "Forster's lieutenants are arrested, his newspaper is closed and the Gauleiter himself is put on a train to Berlin."
 DZG_forster_network_below_40_tt: "Forster's network is §Y40§! or less (currently §Y[?DZG_forster_network]§!)."
 DZG_danzig_first: "Danzig First!"
 DZG_danzig_first_desc: "Greiser's new slogan is not one Berlin likes to hear. The Free City's own national movement answers to the Senate in the Rathaus, not to the Chancellery."
 DZG_the_corporate_senate: "The Corporate Senate"
 DZG_the_corporate_senate_desc: "Employers and workers will sit in guilds under the Senate's chairmen, as they did in the Hanseatic city."
 DZG_the_vistula_doctrine: "The Vistula Doctrine"
 DZG_the_vistula_doctrine_desc: "Everything the Vistula touches between Thorn and the sea belongs to the city at its mouth."
 DZG_break_with_berlin: "Break with Berlin"
 DZG_break_with_berlin_desc: "The Free City will be no one's Gau. The German consul is told that the Senate no longer takes advice from the Chancellery."
 DZG_free_state_youth: "The Free State Youth"
 DZG_free_state_youth_desc: "A youth movement of the Free City's own, with uniforms in the city's red and white."
 DZG_the_baltic_axis: "The Baltic Axis"
 DZG_the_baltic_axis_desc: "Authoritarian governments from Kaunas to Budapest share our fear of both Berlin and Moscow. An alliance of the in-between."
 DZG_greater_danzig: "Greater Danzig"
 DZG_greater_danzig_desc: "West Prussia, East Prussia, Further Pomerania and Memel: the coast from the Oder to the Niemen."
 DZG_the_baltic_war_plan: "The Baltic War Plan"
 DZG_the_baltic_war_plan_desc: "Staff officers from the Baltic Axis draw up a common plan for the war everyone expects."
 DZG_the_eastern_march: "The Eastern March"
 DZG_the_eastern_march_desc: "The Corridor first. The Senate claims it, and the army is ready to take it."
 DZG_the_danziger_reich: "The Danziger Reich"
 DZG_the_danziger_reich_desc: "The Free City is no more. In its place stands a state that Berlin and Warsaw must both take seriously."
 DZG_the_geneva_appeal: "The Geneva Appeal"
 DZG_the_geneva_appeal_desc: "The opposition parties petition the League of Nations: the Senate has broken the constitution the League guarantees. High Commissioner Seán Lester agrees with them, loudly."
 DZG_lesters_restoration: "Lester's Restoration"
 DZG_lesters_restoration_desc: "With the League behind him, the High Commissioner suspends the decrees, reopens the opposition newspapers and calls new elections under international supervision."
 DZG_free_volkstag_elections: "Free Volkstag Elections"
 DZG_free_volkstag_elections_desc: "For the first time since 1933 the opposition campaigns without being beaten in the street."
 DZG_the_brill_coalition: "The Brill Coalition"
 DZG_the_brill_coalition_desc: "Arthur Brill's Social Democrats lead a government of the dockyards and the workshops."
 DZG_the_stachnik_coalition: "The Stachnik Coalition"
 DZG_the_stachnik_coalition_desc: "Father Richard Stachnik's Centre Party leads a Catholic, moderate government that Warsaw can talk to."
 DZG_social_insurance_act: "The Social Insurance Act"
 DZG_social_insurance_act_desc: "Pensions, sickness insurance and unemployment relief for the families the customs war ruined."
 DZG_hanseatic_kontors: "The Hanseatic Kontors"
 DZG_hanseatic_kontors_desc: "The Hanseatic League ruled the Baltic from its kontors: merchant houses in foreign ports. Danzig will open new ones."
 DZG_appeal_to_london_and_paris: "Appeal to London and Paris"
 DZG_appeal_to_london_and_paris_desc: "The Free City was created by the Allies. The Allies should guarantee it."
 DZG_appeal_to_london_and_paris_tt: "Britain and France are asked to guarantee the independence of the Free City."
 DZG_league_arbitration: "League Arbitration"
 DZG_league_arbitration_desc: "A democratic Danzig has friends in Geneva, and the League's judges can be asked to look at the borders of 1920 again."
 DZG_league_arbitration_tt: "Our territorial demands are §Gthree times§! as likely to be accepted. The League High Commissioner joins the Senate as an advisor."
 DZG_reconciliation_with_warsaw: "Reconciliation with Warsaw"
 DZG_reconciliation_with_warsaw_desc: "The customs war ends with a handshake: Polish cargoes return to the Free City, and the Polish garrison on the Westerplatte is just a tenant."
 DZG_the_leagues_shield: "The League's Shield"
 DZG_the_leagues_shield_desc: "A Free City that keeps its constitution keeps its guarantee."
 DZG_reclaim_the_hansa_ports: "Reclaim the Hansa Ports"
 DZG_reclaim_the_hansa_ports_desc: "Gdynia, Königsberg and Memel were Hanseatic towns or Danzig's daughters. They should trade under Danzig's law again."
 DZG_the_new_hanseatic_league: "The New Hanseatic League"
 DZG_the_new_hanseatic_league_desc: "Merchants, not generals, will keep the peace in the Baltic. Every port with a kontor of the Free City is invited into the League."
 DZG_three_kontors_tt: "At least §Y3§! Hanseatic kontors are open (currently §Y[?DZG_kontor_count]§!)."
 DZG_join_the_democracies: "Join the Democracies"
 DZG_join_the_democracies_desc: "The Free City asks to stand with the Western democracies, openly."
 DZG_the_hanseatic_republic: "The Hanseatic Republic"
 DZG_the_hanseatic_republic_desc: "The Free City takes the name of its golden age: the Hanseatic Republic of Danzig."
 DZG_the_senate_of_notables: "The Senate of Notables"
 DZG_the_senate_of_notables_desc: "The Volkstag cannot govern; the parties tear the city apart. The old men of the merchant houses, the university and the courts propose a government above party."
 DZG_rauschning_returns: "Rauschning Returns"
 DZG_rauschning_returns_desc: "Hermann Rauschning was Senate President in 1933 and broke with Hitler a year later. He knows the movement from the inside and despises it. He comes home to save the city from it."
 DZG_the_revolution_of_nihilism: "The Revolution of Nihilism"
 DZG_the_revolution_of_nihilism_desc: "Rauschning publishes his indictment of National Socialism: a revolution with no goal but power. The party in Danzig never recovers."
 DZG_neutral_harbour: "The Neutral Harbour"
 DZG_neutral_harbour_desc: "Everybody wants Danzig's quays. Let everybody pay for them."
 DZG_the_bank_of_danzig: "The Bank of Danzig"
 DZG_the_bank_of_danzig_desc: "The gulden is the hardest currency between the Oder and the Dnieper. The Bank of Danzig can buy what the army cannot take."
 DZG_armed_neutrality: "Armed Neutrality"
 DZG_armed_neutrality_desc: "Neutrality is respected only when it is armed."
 DZG_purchase_the_delta: "Purchase the Delta"
 DZG_purchase_the_delta_desc: "Governments short of money sell land. The Bank will make offers for the delta and the Corridor."
 DZG_balance_the_giants: "Balance the Giants"
 DZG_balance_the_giants_desc: "Danzig will lean towards neither Berlin nor Warsaw. The Free City is a hinge, and a hinge must turn freely."
 DZG_the_neutral_arsenal: "The Neutral Arsenal"
 DZG_the_neutral_arsenal_desc: "Swiss, Swedish and Czech arms dealers will sell to a neutral with hard currency."
 DZG_the_free_city_directorate: "The Free City Directorate"
 DZG_the_free_city_directorate_desc: "The Senate of Notables becomes a permanent Directorate, governing for the city rather than for any party."
 DZG_the_baltic_switzerland: "The Baltic Switzerland"
 DZG_the_baltic_switzerland_desc: "Danzig declares its perpetual neutrality and asks its neighbours to respect it."
 DZG_the_baltic_switzerland_tt: "Germany and Poland are asked to sign a non-aggression pact with the Free City."
 DZG_the_prussian_question: "The Prussian Question"
 DZG_the_prussian_question_desc: "Danzig was the capital of West Prussia when there was still a King of Prussia. Some of the notables would rather have a crown than a Directorate - and the House of Hohenzollern has a prince with nothing to do."
 DZG_coronation_in_the_marienkirche: "Coronation in the Marienkirche"
 DZG_coronation_in_the_marienkirche_desc: "In the largest brick church in the world, Louis Ferdinand of Prussia is crowned King. Berlin is not amused."
 DZG_the_junker_network: "The Junker Network"
 DZG_the_junker_network_desc: "The estates of East Prussia and Pomerania are full of officers who swore an oath to a King. The King is back."
 DZG_order_of_the_black_eagle: "The Order of the Black Eagle"
 DZG_order_of_the_black_eagle_desc: "The highest order of the Prussian crown is revived, and the princes of the house take commands."
 DZG_the_royal_wedding: "The Royal Wedding"
 DZG_the_royal_wedding_desc: "The King will marry Grand Duchess Kira of Russia. Half the crowned heads of Europe will come to Danzig."
 DZG_claim_the_prussian_inheritance: "Claim the Prussian Inheritance"
 DZG_claim_the_prussian_inheritance_desc: "East Prussia, the Vistula delta and Pomerania were the lands of the Prussian kings. Their heir claims them."
 DZG_royal_prussian_army: "The Royal Prussian Army"
 DZG_royal_prussian_army_desc: "The traditions of the Prussian army - the drill, the staff, the officer corps - are reborn in Danzig."
 DZG_the_kings_diplomacy: "The King's Diplomacy"
 DZG_the_kings_diplomacy_desc: "A King has cousins. Royal Europe rediscovers the city on the Vistula."
 DZG_restore_the_kingdom_of_prussia: "Restore the Kingdom of Prussia"
 DZG_restore_the_kingdom_of_prussia_desc: "With East Prussian soil under the throne, the King in Danzig is King of Prussia once more."
 DZG_monarchist_societies_in_the_reich: "Monarchist Societies in the Reich"
 DZG_monarchist_societies_in_the_reich_desc: "There are still officers' clubs and veterans' leagues in Germany where the Kaiser's portrait hangs. They can be reached."
 DZG_the_german_crown: "The German Crown"
 DZG_the_german_crown_desc: "The King of Prussia was also German Emperor. When the Reich falters, there is a pretender waiting in Danzig."
 DZG_the_german_crown_tt: "Gain claims on every German core state. Unlocks the decision §YThe King's War on Berlin§!."
 DZG_red_danzig: "Red Danzig"
 DZG_red_danzig_desc: "The Communist Party is banned, but its cells in the Schichau yard and the docks are intact. Anton Plenikowski's list won votes in 1935 even underground."
 DZG_the_shipyard_cells: "The Shipyard Cells"
 DZG_the_shipyard_cells_desc: "Every gang of riveters has its party man. When the call comes, the yards will stop."
 DZG_the_general_strike: "The General Strike"
 DZG_the_general_strike_desc: "The docks, the yards, the railways and the trams stop at once. The Senate has no police large enough to break a whole city."
 DZG_workers_militia: "The Workers' Militia"
 DZG_workers_militia_desc: "The Red Shipyard Guard: dockers and riveters with rifles, defending the commune."
 DZG_the_peoples_tribunals: "The People's Tribunals"
 DZG_the_peoples_tribunals_desc: "The commune judges its enemies in public, in the halls of the Artushof."
 DZG_collectivise_the_werder: "Collectivise the Werder"
 DZG_collectivise_the_werder_desc: "The rich farms of the Danziger Werder are turned over to the labourers who work them."
 DZG_red_sailors: "Red Sailors"
 DZG_red_sailors_desc: "Kiel in 1918 started with sailors. So will the Baltic revolution."
 DZG_join_the_comintern: "Join the Comintern"
 DZG_join_the_comintern_desc: "The commune cannot survive between Germany and Poland without Moscow."
 DZG_join_the_comintern_tt: "The Soviet Union is asked to take the Free Soviet City into its alliance."
 DZG_the_baltic_commune: "The Baltic Commune"
 DZG_the_baltic_commune_desc: "Not Moscow's commune: a council republic of the Baltic ports, run by the people who work them."
 DZG_export_the_revolution: "Export the Revolution"
 DZG_export_the_revolution_desc: "Gdynia, Königsberg and Memel have dockers too."
 DZG_the_red_baltic_fleet: "The Red Baltic Fleet"
 DZG_the_red_baltic_fleet_desc: "The yards that build for the commune build warships first."
 DZG_the_baltic_socialist_federation: "The Baltic Socialist Federation"
 DZG_the_baltic_socialist_federation_desc: "The Free Soviet City becomes the capital of a federation of Baltic workers' republics."

 # Economy
 DZG_the_free_port: "The Free Port"
 DZG_the_free_port_desc: "The harbour is half empty since Poland built Gdynia. Bring the ships back."
 DZG_expand_the_industrial_quarter: "Expand the Industrial Quarter"
 DZG_expand_the_industrial_quarter_desc: "The meadows of the Troyl and the Holm can carry factories."
 DZG_kaiserhafen_expansion: "Kaiserhafen Expansion"
 DZG_kaiserhafen_expansion_desc: "Deeper basins, more cranes, longer quays."
 DZG_gulden_reform: "The Gulden Reform"
 DZG_gulden_reform_desc: "The Danzig gulden is backed by sterling and gold. Keep it that way, and every merchant on the Baltic will want to hold it."
 DZG_the_holm_refinery: "The Holm Refinery"
 DZG_the_holm_refinery_desc: "Oil tankers already unload at the Holm. Storage tanks and a refinery will keep the city's lorries running."
 DZG_vistula_delta_polders: "The Vistula Delta Polders"
 DZG_vistula_delta_polders_desc: "Drained marsh is the cheapest building land on the Baltic."
 DZG_shipyard_expansion: "Shipyard Expansion"
 DZG_shipyard_expansion_desc: "A third slipway for the Schichau yard."
 DZG_ostbahn_rail_hub: "The Ostbahn Rail Hub"
 DZG_ostbahn_rail_hub_desc: "Danzig sits where the Berlin-Königsberg railway meets the line to Warsaw. Every train should stop here."
 DZG_amber_workshops: "The Amber Workshops"
 DZG_amber_workshops_desc: "Danzig amber has been sold to every court in Europe since the Middle Ages. It still sells."
 DZG_zoppot_casino: "The Zoppot Casino"
 DZG_zoppot_casino_desc: "The casino at Zoppot pays a good part of the Free City's budget. Let it pay more."
 DZG_baltic_grain_trade: "The Baltic Grain Trade"
 DZG_baltic_grain_trade_desc: "Polish and Lithuanian grain, Danzig ships, British buyers."
 DZG_chemical_works: "The Chemical Works"
 DZG_chemical_works_desc: "Fertiliser, explosives and synthetic materials from the refinery's by-products."
 DZG_heavy_industry_of_the_free_city: "Heavy Industry of the Free City"
 DZG_heavy_industry_of_the_free_city_desc: "Machine works and foundries to feed the shipyards and the arsenal."
 DZG_arms_exports: "Arms Exports"
 DZG_arms_exports_desc: "Neutral harbours make good arms markets."
 DZG_technische_hochschule: "The Technische Hochschule"
 DZG_technische_hochschule_desc: "The Technical University in Langfuhr is the best engineering school between Berlin and Leningrad."
 DZG_neutral_banking: "Neutral Banking"
 DZG_neutral_banking_desc: "Capital fleeing from Berlin and Warsaw alike looks for a quiet harbour."
 DZG_electrification_of_the_werder: "Electrification of the Werder"
 DZG_electrification_of_the_werder_desc: "Power lines and pumping stations across the delta."
 DZG_free_trade_zone: "The Free Trade Zone"
 DZG_free_trade_zone_desc: "Goods in transit through Danzig pay no duty at all."
 DZG_polytechnic_laboratories: "Polytechnic Laboratories"
 DZG_polytechnic_laboratories_desc: "Industrial research for the yards and the factories, paid for by the yards and the factories."
 DZG_electrical_works: "The Electrical Works"
 DZG_electrical_works_desc: "Radio sets, telephones and fire-control instruments."
 DZG_baltic_trade_hub: "The Baltic Trade Hub"
 DZG_baltic_trade_hub_desc: "Danzig is the clearing house of the Baltic once again."
 DZG_free_city_industrial_plan: "The Free City Industrial Plan"
 DZG_free_city_industrial_plan_desc: "A plan for every quay and every workshop, drawn up by the engineers of the Hochschule."
 DZG_institute_of_physics: "The Institute of Physics"
 DZG_institute_of_physics_desc: "Scientists who left Germany find laboratories, salaries and no questions in Langfuhr."
 DZG_the_spa_of_zoppot: "The Spa of Zoppot"
 DZG_the_spa_of_zoppot_desc: "The beaches, the pier and the casino of Zoppot draw visitors from all over Europe."

 # Society
 DZG_the_waldoper_zoppot: "The Forest Opera of Zoppot"
 DZG_the_waldoper_zoppot_desc: "In a forest valley above Zoppot lies the Waldoper: an open-air stage with seats for thousands under the beech trees."
 DZG_hold_an_open_air_concert: "Hold an Open Air Concert"
 DZG_hold_an_open_air_concert_desc: "Every summer evening the whole Free City - Germans, Poles, Kashubians, workers and senators - climbs the hill to the Forest Opera. For three hours nobody argues about the Corridor."
 DZG_the_bayreuth_of_the_north: "The Bayreuth of the North"
 DZG_the_bayreuth_of_the_north_desc: "The Forest Opera's summer festival rivals Bayreuth, and every newspaper in Germany says so."
 DZG_marienkirche_restoration: "Restoration of the Marienkirche"
 DZG_marienkirche_restoration_desc: "The great brick church of St. Mary is the symbol of the city. Its roofs and windows will be restored."
 DZG_minority_schools: "The Minority Schools"
 DZG_minority_schools_desc: "Polish and Kashubian schools, open and funded by the Free City. A Danziger may speak any language."
 DZG_danziger_neueste_nachrichten: "Danziger Neueste Nachrichten"
 DZG_danziger_neueste_nachrichten_desc: "The city's largest newspaper will explain the government's policy - every morning."
 DZG_free_city_citizenship: "Free City Citizenship"
 DZG_free_city_citizenship_desc: "Everyone who lives in Danzig is a Danziger, whatever language he prays in."
 DZG_the_baltic_pearl: "The Pearl of the Baltic"
 DZG_the_baltic_pearl_desc: "Rich, cultured and free, Danzig is the pearl of the Baltic once again."

 # Shared tooltips
 DZG_integrate_claimed_states_tt: "Every owned state we claim becomes a §Ycore§! state."
 DZG_purge_forster_tt: "§YGauleiter Albert Forster§! is removed and his network dismantled. Berlin's agitation no longer pulls the Danzig Question towards Berlin."
 DZG_forster_network_up_10_tt: "Forster's network grows by §R10§!. At §R100§! he moves against the Senate."
 DZG_forster_network_up_20_tt: "Forster's network grows by §R20§!. At §R100§! he moves against the Senate."
 DZG_forster_network_down_10_tt: "Forster's network shrinks by §G10§!."
 DZG_forster_network_down_15_tt: "Forster's network shrinks by §G15§!."
 DZG_befriend_the_baltic_tt: "Lithuania, Latvia, Estonia, Finland and Sweden and the Free City gain §G+20§! opinion of each other."
 DZG_befriend_the_monarchies_tt: "The monarchies of Europe and the Free City gain §G+25§! opinion of each other."
 DZG_invite_baltic_shield_members_tt: "Lithuania, Latvia, Estonia and Finland are invited to join the alliance."
 DZG_invite_baltic_axis_members_tt: "The non-democratic, non-communist governments of Lithuania, Latvia, Estonia, Finland and Hungary are invited to join the alliance."
 DZG_invite_hansa_members_tt: "Every small country with a Hanseatic kontor is invited to join the New Hanseatic League."
 DZG_request_allied_membership_tt: "The leading democratic alliance is asked to take the Free City in."
 DZG_the_danzig_question_tt: "Leaning towards §YBerlin§! makes Poland more likely to give up land we demand; leaning towards §YWarsaw§! makes Germany more likely to. Staying in the middle keeps the Free City free."
