 # Politics: Azov United
 AZV_the_white_fortress: "The White Fortress"
 AZV_the_white_fortress_desc: "In November 1920 the Red Army broke itself on the Perekop line, and the evacuation that everyone expected never came. Sixteen years later the Crimea is the last piece of the old Russia: a peninsula of barracks, batteries and émigré dreams, waiting for the war to start again."
 AZV_the_veterans_union: "The Veterans' Union"
 AZV_the_veterans_union_desc: "General Turkul has broken with the old guard of the officers' union and founded his own: the Azov Union of War Veterans. Its members wear black shirts, salute with the raised arm and say openly what the Baron's staff only whispers - that the White cause needs a new kind of leader."
 AZV_the_harbin_delegation: "The Harbin Delegation"
 AZV_the_harbin_delegation_desc: "In Manchuria, Konstantin Rodzaevsky leads the Russian Fascist Party with a newspaper, a uniform and a swastika of his own. Bring him to Sevastopol, and his propaganda machine with him."
 AZV_the_putnam_millions: "The Putnam Millions"
 AZV_the_putnam_millions_desc: "Anastasy Vonsiatsky married an American heiress and turned her fortune into the All-Russian Fascist Organization, run from a farm in Putnam, Connecticut. He wants a country to spend his money on. We have one."
 AZV_young_russia: "Young Russia"
 AZV_young_russia_desc: "Alexander Kazem-Bek's Mladorossi - the Young Russians - preach a Tsar who rules through Soviets and a nation reborn from both Reds and Whites. A strange creed, but the young officers love it."
 AZV_the_white_idea: "The White Idea"
 AZV_the_white_idea_desc: "From Berlin, the philosopher Ivan Ilyin writes that evil must be resisted by force. His 'White Idea' gives the movement what its generals never could: a doctrine."
 AZV_the_azov_congress: "The Azov Congress"
 AZV_the_azov_congress_desc: "Veterans, Cossacks, émigrés and students fill the theatre in Kerch for the first congress of the Azov Union. Whoever leaves the stage last will lead it."
 AZV_march_on_simferopol: "March on Simferopol"
 AZV_march_on_simferopol_desc: "The Union is the strongest force on the peninsula, and the Baron's government is a relic of 1920. Turkul's columns are ready to march on the capital. Wrangel can hand over his sword - or have it taken from him."
 AZV_azov_united: "Azov United"
 AZV_azov_united_desc: "South Russia is a name from a lost war. The new state takes the name of the sea it means to rule and the union that saved it: §YAzov United§!."
 AZV_the_vozhd_principle: "The Vozhd Principle"
 AZV_the_vozhd_principle_desc: "One leader, one army, one will. The Vozhd answers to no assembly and to no general staff."
 AZV_tatar_accord: "The Tatar Accord"
 AZV_tatar_accord_desc: "The Crimean Tatars have every reason to fear Moscow more than us. Cafer Seydamet, who led their national army in 1917, offers their regiments in exchange for their schools and mosques."
 AZV_the_militant_state: "The Militant State"
 AZV_the_militant_state_desc: "Every school a cadet corps, every factory an arsenal, every citizen a reservist. Azov United is not a state with an army - it is an army with a state."
 AZV_cossack_hosts_rise: "The Cossack Hosts Rise"
 AZV_cossack_hosts_rise_desc: "The Don and the Kuban never accepted the Soviets. Their exiled atamans swear that the stanitsas will rise the moment our banners cross the strait."
 AZV_the_azov_littoral: "The Azov Littoral"
 AZV_the_azov_littoral_desc: "A sea needs two shores. Kherson, Zaporizhia and the Donbass are the natural hinterland of the Crimea - and the first step out of the siege."
 AZV_the_white_crusade: "The Unfinished War"
 AZV_the_white_crusade_desc: "The armistice of 1920 was never a peace. Tear it up, and finish what Denikin and Wrangel started."
 AZV_the_azov_imperium: "The Azov Imperium"
 AZV_the_azov_imperium_desc: "From the Perekop line to the Don, the lands of the Azov are ours by right of arms. Their people will learn to be Azovians."

 # Army
 AZV_armed_forces_of_south_russia: "Armed Forces of South Russia"
 AZV_armed_forces_of_south_russia_desc: "The army that held Perekop is still the heart of the state. Its veterans are ageing, its rifles older still - but it has never forgotten how to fight."
 AZV_the_perekop_line: "The Perekop Line"
 AZV_the_perekop_line_desc: "Eight kilometres of isthmus, the old Turkish Wall and sixteen years of digging. The Reds broke here once. Make sure they never come close again."
 AZV_the_coloured_divisions: "The Coloured Divisions"
 AZV_the_coloured_divisions_desc: "Kornilovtsy in black and red, Markovtsy in black and white, Drozdovtsy in crimson caps. The elite regiments of the Volunteer Army are rebuilt around their old colours."
 AZV_the_cossack_hosts: "The Cossack Hosts"
 AZV_the_cossack_hosts_desc: "Thousands of Don and Kuban Cossacks followed Wrangel across the Perekop. Their sons ride with them now."
 AZV_lessons_of_1920: "Lessons of 1920"
 AZV_lessons_of_1920_desc: "Frunze's assault on the Perekop failed by a hair. The staff has studied every hour of it."
 AZV_fortify_the_isthmus: "Fortify the Isthmus"
 AZV_fortify_the_isthmus_desc: "Concrete instead of earth, steel instead of timber, guns that can reach the far shore of the Sivash."
 AZV_sevastopol_fortress: "Fortress Sevastopol"
 AZV_sevastopol_fortress_desc: "The coastal batteries that defied the British and French in 1854 are rebuilt for the age of the dreadnought."
 AZV_the_kornilov_shock_regiments: "The Kornilov Shock Regiments"
 AZV_the_kornilov_shock_regiments_desc: "The first shock units of the Russian army, founded in 1917, live on as our assault infantry."
 AZV_drozdovsky_discipline: "Drozdovsky Discipline"
 AZV_drozdovsky_discipline_desc: "Colonel Drozdovsky marched his men 1,200 kilometres from Romania to the Don in 1918. Turkul, who commanded his division, teaches every recruit the same iron discipline."
 AZV_don_cossack_cavalry: "Don Cossack Cavalry"
 AZV_don_cossack_cavalry_desc: "Ataman Krasnov reorganises the Don regiments into a modern cavalry corps."
 AZV_kuban_plastuns: "Kuban Plastuns"
 AZV_kuban_plastuns_desc: "The plastuns, the foot scouts of the Kuban Cossacks, are masters of the mountain and the ambush."
 AZV_the_british_tanks: "The British Tanks"
 AZV_the_british_tanks_desc: "The Mark V tanks that Britain sent Denikin in 1919 still guard Simferopol. Our engineers have learnt everything they can from them."
 AZV_the_artillery_park: "The Artillery Park"
 AZV_the_artillery_park_desc: "Guns from every arsenal of the old empire, repaired, rebored and finally standardised."
 AZV_the_isthmus_doctrine: "The Isthmus Doctrine"
 AZV_the_isthmus_doctrine_desc: "Hold the narrow places, bleed the enemy, then counter-attack. Every officer learns the doctrine that saved the Crimea."
 AZV_the_officer_battalions: "The Officer Battalions"
 AZV_the_officer_battalions_desc: "In 1918 colonels fought as privates. Now the old officer battalions become the cadre of a new army."
 AZV_the_cossack_charge: "The Cossack Charge"
 AZV_the_cossack_charge_desc: "Lances are for parades. The modern Cossack charge comes with machine-gun carts and horse artillery."
 AZV_mechanised_cossacks: "Mechanised Cossacks"
 AZV_mechanised_cossacks_desc: "If the horse cannot keep up with the tank, put the Cossack in a lorry."
 AZV_slashchovs_war_college: "Slashchov's War College"
 AZV_slashchovs_war_college_desc: "General Slashchov, who held the Crimea with a handful of men in the winter of 1920, opens a war college in Simferopol. His lectures are brilliant, his temper legendary."
 AZV_total_mobilisation: "Total Mobilisation"
 AZV_total_mobilisation_desc: "No exemptions, no deferments: every man between seventeen and fifty is a soldier of the White cause."
 AZV_the_wild_division: "The Wild Division"
 AZV_the_wild_division_desc: "Sultan Klych-Girey raises again the Caucasian cavalry division that the old army called 'Wild'."
 AZV_armoured_spearheads: "Armoured Spearheads"
 AZV_armoured_spearheads_desc: "Tanks massed at the point of attack will do what cavalry did in the steppe war of 1919."
 AZV_the_kutepov_reforms: "The Kutepov Reforms"
 AZV_the_kutepov_reforms_desc: "General Kutepov - 'the Iron General' - reforms the staff and the officer corps from top to bottom."
 AZV_the_white_guard: "The White Guard"
 AZV_the_white_guard_desc: "The White Guard is no longer a remnant. It is the best army on the Black Sea."
 AZV_the_unstoppable_host: "The Unstoppable Host"
 AZV_the_unstoppable_host_desc: "Cossack, tank and Wild Division together: a host that can ride from the Perekop to the Volga."

 # Navy
 AZV_the_black_sea_squadron: "The Black Sea Squadron"
 AZV_the_black_sea_squadron_desc: "What is left of the Imperial Black Sea Fleet never sailed for Bizerte. Its ships still lie at anchor in Sevastopol."
 AZV_refit_the_general_alekseyev: "Refit the General Alekseyev"
 AZV_refit_the_general_alekseyev_desc: "The battleship General Alekseyev - once the Imperator Aleksandr III - is the pride of the squadron. Give her new guns and new boilers."
 AZV_sevastopol_naval_yards: "Sevastopol Naval Yards"
 AZV_sevastopol_naval_yards_desc: "The yards that built the dreadnoughts of the Black Sea Fleet will build again."
 AZV_the_submarine_division: "The Submarine Division"
 AZV_the_submarine_division_desc: "Submarines are cheap, quiet and deadly in the narrow Black Sea."
 AZV_destroyer_flotillas: "Destroyer Flotillas"
 AZV_destroyer_flotillas_desc: "Fast destroyers of the Novik type will guard the approaches to the peninsula."
 AZV_marines_of_the_black_sea: "Marines of the Black Sea"
 AZV_marines_of_the_black_sea_desc: "Wrangel's landings on the Kuban in 1920 nearly turned the war. Next time they will be made by professionals."
 AZV_close_the_kerch_strait: "Close the Kerch Strait"
 AZV_close_the_kerch_strait_desc: "Whoever holds Kerch holds the key to the Sea of Azov. Mines, batteries and a naval base will lock it."
 AZV_naval_aviation: "Naval Aviation"
 AZV_naval_aviation_desc: "Seaplanes from the Kacha school will hunt Soviet ships across the Black Sea."
 AZV_masters_of_the_black_sea: "Masters of the Black Sea"
 AZV_masters_of_the_black_sea_desc: "The Black Sea is a small sea. It will be our sea."

 # Air force
 AZV_the_kacha_flight_school: "The Kacha Flight School"
 AZV_the_kacha_flight_school_desc: "Russia's first military flying school was founded at Kacha, near Sevastopol, in 1910. It never closed."
 AZV_fighter_regiments: "Fighter Regiments"
 AZV_fighter_regiments_desc: "Modern fighters to keep the Red air force away from the isthmus."
 AZV_ground_attack_squadrons: "Ground Attack Squadrons"
 AZV_ground_attack_squadrons_desc: "Aircraft that fly low over the steppe and break enemy columns before they reach the line."
 AZV_bomber_regiments: "Bomber Regiments"
 AZV_bomber_regiments_desc: "Bombers that can reach Kherson, Zaporizhia and the bridges of the Dnieper."
 AZV_air_defence_of_the_peninsula: "Air Defence of the Peninsula"
 AZV_air_defence_of_the_peninsula_desc: "Anti-aircraft batteries ring Sevastopol, Simferopol and the Perekop."
 AZV_the_white_eagles: "The White Eagles"
 AZV_the_white_eagles_desc: "The airmen of Azov paint the double-headed eagle on their fuselages, and the Reds have learnt to fear it."

 # Economy and the Arsenal
 AZV_the_garrison_economy: "The Garrison Economy"
 AZV_the_garrison_economy_desc: "Sixteen years of siege have shaped everything on the peninsula. It is time to organise the economy for what it really is: the supply service of an army."
 AZV_kerch_iron_works: "The Kerch Iron Works"
 AZV_kerch_iron_works_desc: "The iron ore of the Kerch peninsula feeds a blast furnace again - and the furnace feeds an arms plant."
 AZV_the_arsenal_of_the_white_cause: "The Arsenal of the White Cause"
 AZV_the_arsenal_of_the_white_cause_desc: "Our agents in Istanbul, Prague and Marseille have contacts with every arms dealer on the continent. Political goodwill and émigré money buy what our factories cannot make."
 AZV_massandra_wine_exports: "Massandra Wine Exports"
 AZV_massandra_wine_exports_desc: "The imperial cellars of Massandra hold the best wine on the Black Sea. Every bottle sold in Paris is a rifle bought in Prague."
 AZV_simferopol_industrial_district: "Simferopol Industrial District"
 AZV_simferopol_industrial_district_desc: "New workshops on the edge of the capital, built with émigré capital and Cossack labour."
 AZV_war_industry: "War Industry"
 AZV_war_industry_desc: "Every workshop that can make a shell, a fuse or a rifle bolt is put under the War Ministry."
 AZV_foreign_arms_dealers: "Foreign Arms Dealers"
 AZV_foreign_arms_dealers_desc: "Skoda, Bofors, Fiat - the great arms firms of Europe send their agents to Sevastopol. Every contract delivers more for less."
 AZV_the_yalta_riviera: "The Yalta Riviera"
 AZV_the_yalta_riviera_desc: "The palaces of the Tsars still stand at Livadia. Rich émigrés and curious foreigners pay well to winter on the last Russian riviera."
 AZV_salt_of_the_sivash: "Salt of the Sivash"
 AZV_salt_of_the_sivash_desc: "The 'Rotten Sea' behind the Perekop is a lake of salt and chemicals - the raw material for a synthetic industry."
 AZV_the_garrison_state: "The Garrison State"
 AZV_the_garrison_state_desc: "The economy exists to arm the soldier. Everything else can wait."
 AZV_emigre_war_bonds: "Émigré War Bonds"
 AZV_emigre_war_bonds_desc: "From Paris to Belgrade to Harbin, the Russian emigration buys bonds that will be redeemed in Moscow."
 AZV_the_simferopol_tank_works: "The Simferopol Tank Works"
 AZV_the_simferopol_tank_works_desc: "After years of repairing British and captured Soviet tanks, Simferopol builds its own."
 AZV_the_arsenal_state: "The Arsenal State"
 AZV_the_arsenal_state_desc: "Factories, dealers and émigré money form one machine: the arsenal of the White cause."
 AZV_the_sevastopol_institute: "The Sevastopol Institute"
 AZV_the_sevastopol_institute_desc: "Russian scientists who fled the Soviets find laboratories, salaries and a purpose in Sevastopol."

 # Foreign policy
 AZV_the_emigration_calls: "The Emigration Calls"
 AZV_the_emigration_calls_desc: "A million Russians live in exile. Every one of them who comes home is a soldier, a worker or a teacher."
 AZV_prometheism: "Prometheism"
 AZV_prometheism_desc: "Warsaw's Promethean movement backs every nation of the Soviet borderlands against Moscow. Russians and Prometheans are strange allies - but allies."
 AZV_friendship_with_ankara: "Friendship with Ankara"
 AZV_friendship_with_ankara_desc: "The Turks hold the Straits, the gate to everything we need. Old enemies can become good neighbours."
 AZV_approach_berlin: "Approach Berlin"
 AZV_approach_berlin_desc: "Germany fears Bolshevism as much as we do, and Berlin is full of Russian émigrés."
 AZV_the_white_crusade_alliance: "The White Crusade Alliance"
 AZV_the_white_crusade_alliance_desc: "Every state that borders the Soviet Union has reason to join a crusade against it. We will lead it."
 AZV_join_the_axis: "Join the Axis"
 AZV_join_the_axis_desc: "If Berlin and Rome will march against Moscow, Azov United will march with them."
 AZV_crusader_volunteers: "Crusader Volunteers"
 AZV_crusader_volunteers_desc: "Wherever the Reds fight - in Spain, in China, anywhere - our volunteers will be there."
 AZV_strike_when_moscow_burns: "Strike When Moscow Burns"
 AZV_strike_when_moscow_burns_desc: "The Soviet Union will not always be strong. When it is at war, at its weakest, the Whites will come back."
 AZV_a_new_south_russia: "A New South Russia"
 AZV_a_new_south_russia_desc: "Odessa, Mykolaiv, the Dnieper, Kharkiv: the South Russia of 1919, restored."
