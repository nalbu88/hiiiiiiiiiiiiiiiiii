 # National spirits
 AZV_island_of_crimea: "The Island of Crimea"
 AZV_island_of_crimea_desc: "Behind the Perekop line the Crimea is an island in all but name: impossible to storm, impossible to leave. The world trades with it reluctantly, and every brick has to be paid for twice.\n\nRemoved when South Russia claims the Azov littoral."
 AZV_white_army_remnants: "Remnants of the White Army"
 AZV_white_army_remnants_desc: "The veterans of the Civil War are superb soldiers, and there are fewer of them every year."
 AZV_white_army_reborn: "The White Army Reborn"
 AZV_white_army_reborn_desc: "The officer battalions have trained a new generation. The White Army is young again."
 AZV_azov_united_spirit: "Azov United"
 AZV_azov_united_spirit_desc: "One union, one sea, one army. The state that grew out of a besieged peninsula now looks beyond it."
 AZV_vozhd_principle: "The Vozhd Principle"
 AZV_vozhd_principle_desc: "Every decision belongs to the Vozhd, and every officer answers to him alone."
 AZV_tatar_accord_idea: "The Tatar Accord"
 AZV_tatar_accord_idea_desc: "The Crimean Tatars keep their schools and their mosques and send their sons to the army."
 AZV_militant_state: "The Militant State"
 AZV_militant_state_desc: "Every citizen is a soldier, and every soldier is ready."
 AZV_azov_imperium: "The Azov Imperium"
 AZV_azov_imperium_desc: "From the Perekop to the Don, the lands of the Azov answer to Sevastopol."
 AZV_drozdovsky_discipline_idea: "Drozdovsky Discipline"
 AZV_drozdovsky_discipline_idea_desc: "The march from Iaşi to the Don taught the Drozdovtsy that discipline wins wars. Every recruit learns the lesson."
 AZV_isthmus_doctrine: "The Isthmus Doctrine"
 AZV_isthmus_doctrine_desc: "Hold the narrow places, bleed the enemy white, then counter-attack."
 AZV_cossack_charge: "The Cossack Charge"
 AZV_cossack_charge_desc: "Machine-gun carts, horse artillery and the oldest war cry of the steppe."
 AZV_total_mobilisation_idea: "Total Mobilisation"
 AZV_total_mobilisation_idea_desc: "No exemptions and no deferments: the whole nation stands to arms."
 AZV_white_guard: "The White Guard"
 AZV_white_guard_desc: "The best army on the Black Sea, and it knows it."
 AZV_black_sea_masters: "Masters of the Black Sea"
 AZV_black_sea_masters_desc: "Our submarines and destroyers own the Black Sea."
 AZV_white_eagles: "The White Eagles"
 AZV_white_eagles_desc: "The double-headed eagle flies again over the Crimea."
 AZV_garrison_state_economy: "The Garrison State"
 AZV_garrison_state_economy_desc: "The economy exists to arm the soldier."
 AZV_arsenal_state: "The Arsenal State"
 AZV_arsenal_state_desc: "Factories, foreign dealers and émigré money form one great arsenal."
 AZV_crusaders: "Crusader Volunteers"
 AZV_crusaders_desc: "Wherever the Reds fight, White volunteers fight against them."

 # Decision categories
 AZV_arsenal_category: "The Arsenal of the White Cause"
 AZV_arsenal_category_desc: "Sixteen years of siege have made South Russia the best customer of every arms dealer between Marseille and Istanbul. Here political capital - favours, promises and émigré money - buys equipment.\n\nEvery purchase is multiplied by the current delivery rate: §Y[?AZV_arms_multiplier|2]x§!. §YThe Putnam Millions§!, §YForeign Arms Dealers§! and §YThe Arsenal State§! raise it, up to §Y2x§!."
 AZV_azov_union_category: "The Azov Union"
 AZV_azov_union_category_desc: "General Turkul's movement of war veterans, Cossacks and young émigrés. Before the March on Simferopol it needs supporters; after it, it needs soldiers."
 AZV_crusade_category: "The White Crusade"
 AZV_crusade_category_desc: "The Civil War never ended. It only paused."

 # Decisions: the Arsenal of the White Cause
 AZV_buy_istanbul_rifles: "Buy Rifles on the Istanbul Market"
 AZV_buy_istanbul_rifles_desc: "Mosins, Mausers and Lebels: the bazaar of Galata sells the rifles of every army of the Great War. §Y600§! rifles at the base rate."
 AZV_buy_skoda_guns: "Buy Skoda Guns"
 AZV_buy_skoda_guns_desc: "The Skoda works in Pilsen build some of the best field guns in Europe and ask few questions. §Y120§! guns at the base rate."
 AZV_buy_signals_and_engineering_gear: "Buy Signals and Engineering Gear"
 AZV_buy_signals_and_engineering_gear_desc: "Field telephones, wireless sets, bridging gear and medical stores. §Y150§! sets at the base rate."
 AZV_buy_fiat_lorries: "Buy Fiat Lorries"
 AZV_buy_fiat_lorries_desc: "Turin builds robust lorries for the Italian army, and sells them to its friends. §Y150§! lorries at the base rate."
 AZV_buy_bofors_anti_tank_guns: "Buy Bofors Anti-Tank Guns"
 AZV_buy_bofors_anti_tank_guns_desc: "Sweden's 37 mm gun is the best anti-tank weapon money can buy. §Y100§! guns at the base rate."
 AZV_buy_bofors_anti_air_guns: "Buy Bofors Anti-Air Guns"
 AZV_buy_bofors_anti_air_guns_desc: "The Bofors 40 mm gun is fast becoming the anti-aircraft gun of half the world. §Y100§! guns at the base rate."
 AZV_the_great_rifle_contract: "The Great Rifle Contract"
 AZV_the_great_rifle_contract_desc: "One contract, one shipment, one whole army corps armed. §Y2500§! rifles at the base rate."
 AZV_charter_greek_steamers: "Charter Greek Steamers"
 AZV_charter_greek_steamers_desc: "The tramp steamers of Piraeus will carry anything for anyone. §Y15§! convoys at the base rate."
 AZV_arm_a_cossack_host: "Arm a Cossack Host"
 AZV_arm_a_cossack_host_desc: "Rifles, guns, signals gear and the men to use them: a whole Cossack host, armed at once. §Y1500§! rifles, §Y300§! support sets and §Y150§! guns at the base rate."

 # Decisions: the Azov Union
 AZV_rally_the_veterans: "Rally the Veterans"
 AZV_rally_the_veterans_desc: "Turkul speaks, the old soldiers listen, and the young ones join."
 AZV_march_of_the_drozdovtsy: "March of the Drozdovtsy"
 AZV_march_of_the_drozdovtsy_desc: "Crimson caps and black shirts march through Sevastopol. The Baron's police look away."
 AZV_win_over_the_old_generals: "Win Over the Old Generals"
 AZV_win_over_the_old_generals_desc: "Kutepov, Slashchov and the other generals respect Wrangel, but they respect strength more."
 AZV_raise_the_azov_legions: "Raise the Azov Legions"
 AZV_raise_the_azov_legions_desc: "The Union's members volunteer as a body for the army."
 AZV_purge_the_kadets: "Purge the Kadets"
 AZV_purge_the_kadets_desc: "The liberals of the Constitutional Democratic Party lost Russia once. They will not lose it again."
 AZV_recruit_the_emigration: "Recruit from the Emigration"
 AZV_recruit_the_emigration_desc: "Recruiting offices in Paris, Belgrade, Sofia and Harbin send us officers and volunteers."

 # Decisions: the White Crusade
 AZV_strike_at_the_soviets: "Strike at the Soviets"
 AZV_strike_at_the_soviets_desc: "Moscow is busy. Tear up the armistice and march."
 AZV_raise_the_cossack_hosts: "Raise the Cossack Host"
 AZV_raise_the_cossack_hosts_desc: "Our army stands in the Cossack lands. Call the stanitsas to arms and make the land ours."
 AZV_captured_soviet_stocks: "Captured Soviet Stocks"
 AZV_captured_soviet_stocks_desc: "The Red Army's depots in the occupied lands are full of rifles and shells."

 # Tooltips
 AZV_the_white_fortress_tt: "§YThe Armistice of 1920§! - a non-aggression pact with the Soviet Union - holds until South Russia tears it up.\n"
 AZV_arsenal_tier_2_tt: "Unlocks the second tier of §YThe Arsenal of the White Cause§!: Fiat lorries and Bofors anti-tank and anti-air guns.\n"
 AZV_arsenal_tier_3_tt: "Unlocks the third tier of §YThe Arsenal of the White Cause§!: the Great Rifle Contract, Greek steamers and the arms for a whole Cossack host.\n"
 AZV_arsenal_tier_2_open_tt: "Has completed the focus §YThe Arsenal of the White Cause§!"
 AZV_arsenal_tier_3_open_tt: "Has completed the focus §YForeign Arms Dealers§!"
 AZV_arms_multiplier_up_25_tt: "Every purchase of §YThe Arsenal of the White Cause§! delivers §G25%§! more of the base amount (at most twice the base amount).\n"
 AZV_arms_multiplier_up_50_tt: "Every purchase of §YThe Arsenal of the White Cause§! delivers §G50%§! more of the base amount (at most twice the base amount).\n"
 AZV_soviets_are_busy_tt: "The Soviet Union is in a civil war, losing a war, or at war with a major power"
 AZV_integrate_claimed_states_tt: "Gain §Ycores§! on every owned state South Russia claims.\n"
 AZV_befriend_the_promethean_powers_tt: "Poland, Turkey, Romania, Finland and the free nations of Ukraine and the Caucasus gain §G+25§! opinion of us, and we of them.\n"
 AZV_invite_white_crusade_members_tt: "Poland, Romania, Finland, Turkey, Hungary, Danzig and the free nations of the Soviet borderlands are invited to join §YThe White Crusade§!.\n"
 AZV_request_axis_membership_tt: "Ask the leading fascist faction to admit us.\n"
 AZV_win_over_the_old_generals_tt: "When the Azov Union marches on Simferopol, the Baron can hand over his sword without a fight.\n"

