 # Leader and advisor traits
 AZV_trait_the_black_baron: "The Black Baron"
 AZV_trait_vozhd_of_azov: "Vozhd of Azov"
 AZV_trait_harbin_propagandist: "Harbin Propagandist"
 AZV_trait_putnam_millionaire: "The Putnam Millionaire"
 AZV_trait_young_russia_ideologue: "Young Russia Ideologue"
 AZV_trait_white_statesman: "White Statesman"
