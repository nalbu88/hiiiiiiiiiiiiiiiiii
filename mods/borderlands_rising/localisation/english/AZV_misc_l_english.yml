 # Characters
 AZV_pyotr_wrangel: "Pyotr Wrangel"
 AZV_pyotr_wrangel_desc: "Baron Pyotr Wrangel, 'the Black Baron', took command of the Armed Forces of South Russia in April 1920 after Denikin's defeat. In this world his line at Perekop held, and he has ruled the Crimea ever since: a soldier first, a reformer second, and a politician only when he cannot avoid it."
 AZV_anton_turkul: "Anton Turkul"
 AZV_anton_turkul_desc: "The last commander of the Drozdovsky Division, decorated for bravery more times than anyone can count. In 1936 he broke with the cautious generals of the officers' union to found his own movement of war veterans, openly modelled on Mussolini's. To his men he is a hero; to his rivals, a gambler who never loses his nerve."
 AZV_konstantin_rodzaevsky: "Konstantin Rodzaevsky"
