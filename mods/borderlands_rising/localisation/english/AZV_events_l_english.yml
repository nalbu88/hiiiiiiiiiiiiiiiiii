 azv.1.t: "The Azov Congress"
 azv.1.d: "The municipal theatre in Kerch has never been so full. Veterans of the Ice March sit beside Cossack atamans, Harbin propagandists beside Mladorossi students, and in the front row a delegation of Crimean Tatar officers watches it all with polite reserve.\n\nWhen General Turkul takes the stage the hall rises as one man. He speaks for an hour about the siege, the armistice and the cowardice of 'the old men in Simferopol', and ends with the words that will be printed on every wall of the peninsula by morning: 'The war is not over. We are not finished.'"
 azv.1.a: "The Union marches!"
 azv.1.b: "Let the Mladorossi speak as well."
 azv.2.t: "The March on Simferopol"
 azv.2.d: "Since dawn the columns of the Azov Union have been marching on the capital: veterans in crimson caps, Cossacks on horseback, students in black shirts. The garrison of Simferopol has not fired a shot. Its officers are watching the road - and waiting to see what the Baron will do.\n\nIn the Governor's Palace, Wrangel receives Turkul's envoy. He listens in silence, and asks only one question: whether the army will stand behind the new government."
 azv.2.a: "The Baron hands over his sword."
 azv.2.b: "Storm the palace!"
 azv.4.t: "The Whites Tear Up the Armistice"
 azv.4.d: "For sixteen years the armistice of 1920 has kept the guns silent on the Perekop. Now the self-proclaimed government in Sevastopol has denounced it, claims half of the Ukrainian SSR and the Don, and openly calls for a 'crusade' against the Soviet state.\n\nThe People's Commissariat of Defence asks for permission to finish the war that should have ended in 1920."
 azv.4.a: "Finish them."
 azv.4.b: "The Whites can shout. They cannot march."
 azv.5.t: "The OGPU in Sevastopol"
 azv.5.d: "The counter-intelligence service has uncovered a Soviet network in Sevastopol: a cipher clerk in the Admiralty, two officers of the coastal artillery and a café owner on the Primorsky Boulevard who passed their reports across the Black Sea. Its leader is said to have planned the kidnapping of General Kutepov.\n\nThe arrests have shaken the garrison. The Azov Union demands that the trials be held in public."
 azv.5.a: "Try them quietly and reassure the army."
 azv.5.b: "A public trial - let everyone see the Red menace."
 azv.10.t: "An Invitation to the White Crusade"
 azv.10.d: "[From.GetLeader] of [From.GetNameDef] invites us to join §YThe White Crusade§!, an alliance of the nations that border the Soviet Union, 'until Bolshevism is driven from Europe'. The Whites have a formidable army for so small a state, and every friend counts against Moscow."
 azv.10.a: "Join the crusade."
 azv.10.b: "We will not be dragged into their war."
 azv.11.t: "Our Invitation Was Declined"
 azv.11.d: "[From.GetNameDefCap] has declined to join the White Crusade. The fear of Moscow, it seems, is stronger than the hatred of Bolshevism."
 azv.11.a: "We will march alone if we must."
 azv.12.t: "[From.GetNameDefCap] Asks to Join Our Faction"
 azv.12.d: "[From.GetLeader] of [From.GetNameDef] has asked us to admit the White Russian state of the Crimea into our faction. Its army is small but battle-hardened, its harbour of Sevastopol commands the Black Sea, and its hatred of the Soviet Union is beyond doubt."
 azv.12.a: "Welcome them."
 azv.12.b: "They would drag us into a war with Moscow."
 azv.13.t: "Our Request Was Refused"
 azv.13.d: "[From.GetNameDefCap] has refused to admit us into its faction. In Sevastopol, nobody is surprised: the great powers have always made their peace with Moscow in the end."
 azv.13.a: "Then the White Crusade will be ours alone."
