 # Characters (fictional)
 PLM_teter_phiel: "Teter Phiel"
 PLM_teter_phiel_desc: "A contrarian financier who left Kaunas as a boy, made a fortune in America by betting against everyone, and came home with a machine called Palanmir. He believes that competition is for losers, that democracy is an interesting historical experiment, and that the people's wellbeing is a lagging indicator.\n\n§gTeter Phiel is a fictional, satirical character.§!"
 PLM_adele_karpaite: "Adele Karpaitė"
 PLM_ieva_stonkute: "Ieva Stonkutė"
 PLM_mindaugas_saltis: "Mindaugas Šaltis"
 PLM_algirdas_tinklas: "Algirdas Tinklas"
 PLM_rasa_debesyte: "Rasa Debesytė"

 # Traits
 PLM_trait_contrarian_financier: "Contrarian Financier"
 PLM_trait_chief_executive_of_the_nation: "Chief Executive of the Nation"
 PLM_trait_chief_data_officer: "Chief Data Officer"
 PLM_trait_predictive_logistician: "Predictive Logistician"
 PLM_trait_integration_architect: "Integration Architect"

 # Palanmir (dynamic modifier)
 PLM_palanmir: "Palanmir"
 PLM_palanmir_desc: "Palanmir collects every piece of data the state can find and turns it into decisions. It is level §Y[?PLM_palanmir_level|0]§! and has collected §Y[?PLM_data|0]§! data points, adding §Y[?PLM_data_rate|0]§! a month and more for every integrated state and foreign client.\n\nThe more it knows, the more efficient the country becomes - and the less anyone asks how the people feel about it."

 # National spirits
 PLM_lagging_indicator: "Wellbeing Is a Lagging Indicator"
 PLM_lagging_indicator_desc: "Research and construction come first. The people's happiness will be measured later."
 PLM_efficiency_decrees: "The Efficiency Decrees"
 PLM_efficiency_decrees_desc: "Every manager is measured against Palanmir's targets."
 PLM_predictive_policing_idea: "Predictive Policing"
 PLM_predictive_policing_idea_desc: "Trouble is stopped before it starts."
 PLM_algorithmic_budget: "The Algorithmic Budget"
 PLM_algorithmic_budget_desc: "The budget is calculated, not debated."
 PLM_shareholder_state: "The Shareholder State"
 PLM_shareholder_state_desc: "Investors trust a state run like a company."
 PLM_the_technate_idea: "The Technate"
 PLM_the_technate_idea_desc: "A state run by engineers and machines, for results."
 PLM_science_over_sentiment_idea: "Science over Sentiment"
 PLM_science_over_sentiment_idea_desc: "If an experiment is worth doing, it is worth doing now."
 PLM_algorithmic_construction_idea: "Algorithmic Construction"
 PLM_algorithmic_construction_idea_desc: "Palanmir plans every building site."
 PLM_concrete_algorithm: "The Concrete Algorithm"
 PLM_concrete_algorithm_desc: "Prefabricated, standardised, optimised."
 PLM_seven_day_week: "The Seven-Day Week"
 PLM_seven_day_week_desc: "Sunday has been found to be inefficient."
 PLM_data_driven_army_idea: "The Data-Driven Army"
 PLM_data_driven_army_idea_desc: "The army plans with Palanmir's information."
 PLM_riflemens_union: "The Riflemen's Union"
 PLM_riflemens_union_desc: "Tens of thousands of trained volunteers, all of them on file."

 # Decisions
 PLM_palanmir_category: "Palanmir"
 PLM_palanmir_category_desc: "Palanmir is at level §Y[?PLM_palanmir_level|0]§!, with §Y[?PLM_data|0]§! data points (next levels at 100, 250, 500 and 1000). It collects §Y[?PLM_data_rate|0]§! a month, plus 2 for each of the §Y[?PLM_integrated_states|0]§! integrated states and 3 for each of the §Y[?PLM_clients|0]§! foreign clients.\n\nAny state Lithuania controls can be §Yintegrated into Palanmir§!, which gives Lithuania a core on it."
 PLM_integrate_state: "Integrate into Palanmir"
 PLM_integrate_state_desc: "Connect this state's records, police and telephone exchanges to Palanmir. When the integration is complete, Lithuania gains a core on the state."
 PLM_data_harvest: "Data Harvest"
 PLM_data_harvest_desc: "A month of intensive collection: questionnaires, interviews and a great deal of opened post."
 PLM_mandatory_data_sharing: "Mandatory Data Sharing"
 PLM_mandatory_data_sharing_desc: "Every business and household must report to Palanmir."
 PLM_wellbeing_survey: "Commission a Wellbeing Survey"
 PLM_wellbeing_survey_desc: "A survey of the people's wellbeing. The results, Mr Phiel promises, will be excellent."
 PLM_sell_palanmir_licence: "Sell a Palanmir Licence"
 PLM_sell_palanmir_licence_desc: "A licence for Palanmir: the client gets the machine, Lithuania gets the money - and a copy of the data."

 # Tooltips
 PLM_install_palanmir_tt: "Adds the national spirit §YPalanmir§!. Palanmir collects §Y5§! data a month and grows stronger at §Y100§!, §Y250§!, §Y500§! and §Y1000§! data.\n"
 PLM_data_up_25_tt: "Palanmir data: §G+25§!\n"
 PLM_data_up_50_tt: "Palanmir data: §G+50§!\n"
 PLM_data_up_100_tt: "Palanmir data: §G+100§!\n"
 PLM_data_rate_up_5_tt: "Palanmir collects §G5§! more data every month.\n"
 PLM_data_rate_up_10_tt: "Palanmir collects §G10§! more data every month.\n"
 PLM_integration_failed_tt: "If we no longer control the state, the integration fails.\n"
 PLM_palanmir_level_2_tt: "Palanmir is at least level §Y2§!"
 PLM_palanmir_level_3_tt: "Palanmir is at least level §Y3§!"
 PLM_palanmir_level_4_tt: "Palanmir is at least level §Y4§!"
 PLM_poland_is_weak_tt: "Poland is at war, unstable (below §Y40%§! stability) or a subject of another country"
 PLM_befriend_the_baltic_tt: "Latvia, Estonia, Finland and Sweden gain §G+15§! opinion of us, and we of them.\n"
 PLM_export_palanmir_tt: "We can sell up to §Y6§! Palanmir licences instead of §Y3§!.\n"
 PLM_client_limit_tt: "Fewer than §Y3§! licences sold"
 PLM_client_limit_export_tt: "Has completed §YExport Palanmir§! and sold fewer than §Y6§! licences"
 PLM_client_data_tt: "The client's data adds §G3§! to Palanmir's monthly collection. Every second client brings a §Ycivilian factory§! of licence revenue.\n"

