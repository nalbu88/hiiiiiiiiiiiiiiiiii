l_english:
 PLM_lithuania_focus_tree: "The Palanmir Technate"
 PLM_shortcut_technate: "The Technate and Palanmir"
 PLM_shortcut_research: "Research"
 PLM_shortcut_industry: "Construction and Industry"
 PLM_shortcut_army: "The Army"
 PLM_shortcut_foreign: "Foreign Policy"

 # The proposal
 PLM_a_proposal_from_mr_phiel: "A Proposal from Mr Phiel"
 PLM_a_proposal_from_mr_phiel_desc: "Teter Phiel left Kaunas as a boy and came back a very rich man. He has a proposal for the government: a machine that collects everything the state knows, and tells it what to do next."
 PLM_install_palanmir: "Install Palanmir"
 PLM_install_palanmir_desc: "Rooms full of punch-card machines, a thousand clerks and a cable to every ministry: Palanmir goes live. It starts to collect data, and the more it collects, the better it gets."

 # The Phiel Administration
 PLM_the_census_of_everything: "The Census of Everything"
 PLM_the_census_of_everything_desc: "Not just who lives where, but what they buy, whom they write to and what they read. Palanmir wants to know."
 PLM_the_data_ministry: "The Data Ministry"
 PLM_the_data_ministry_desc: "Adele Karpaitė, Mr Phiel's chief data officer, takes a seat in the cabinet. Every ministry now reports to Palanmir first."
 PLM_pack_the_fourth_seimas: "Pack the Fourth Seimas"
 PLM_pack_the_fourth_seimas_desc: "The Seimas elected in 1936 is meant to be a quiet parliament. Palanmir's predictions make it quieter still."
 PLM_smetonas_dilemma: "Smetona's Dilemma"
 PLM_smetonas_dilemma_desc: "President Smetona built the modern Lithuanian state. Mr Phiel has offered to run it more efficiently. The President must decide."
 PLM_the_phiel_administration: "The Phiel Administration"
 PLM_the_phiel_administration_desc: "Teter Phiel becomes Chief Executive of the Nation. Lithuania becomes a Technate: a state run like a very ambitious start-up."
 PLM_wellbeing_is_a_lagging_indicator: "Wellbeing Is a Lagging Indicator"
 PLM_wellbeing_is_a_lagging_indicator_desc: "Happiness can be measured later. Laboratories and construction sites cannot wait."
 PLM_the_efficiency_decrees: "The Efficiency Decrees"
 PLM_the_efficiency_decrees_desc: "Every factory, office and farm receives targets from Palanmir, and every manager is measured against them."
 PLM_predictive_policing: "Predictive Policing"
 PLM_predictive_policing_desc: "Palanmir knows who will cause trouble before they know it themselves."
 PLM_the_algorithmic_budget: "The Algorithmic Budget"
 PLM_the_algorithmic_budget_desc: "The state budget is no longer debated. It is calculated."
 PLM_the_shareholder_state: "The Shareholder State"
 PLM_the_shareholder_state_desc: "Citizens are shareholders, ministers are managers and the Chief Executive answers to the board. The board is Mr Phiel."
 PLM_the_technate: "The Technate"
 PLM_the_technate_desc: "Competition is for losers. The Lithuanian Technate will not compete with the great powers - it will out-think them."

 # The Palanmir system
 PLM_palanmir_2_0: "Palanmir 2.0"
 PLM_palanmir_2_0_desc: "Faster sorters, more clerks and a new method of cross-referencing: Palanmir 2.0 collects more and forgets nothing."
 PLM_the_sensor_network: "The Sensor Network"
 PLM_the_sensor_network_desc: "Telephone exchanges, post offices, railway stations and radio direction-finders all report to Palanmir."
 PLM_predictive_logistics: "Predictive Logistics"
 PLM_predictive_logistics_desc: "Mindaugas Šaltis claims Palanmir can tell where the army will need its bread a week before the army knows."
 PLM_the_integration_protocol: "The Integration Protocol"
 PLM_the_integration_protocol_desc: "Ieva Stonkutė has written a protocol to connect any territory to Palanmir: its records, its police and its people. Once a land is integrated, it is part of Lithuania in every way that matters."
 PLM_the_punch_card_bureau: "The Punch Card Bureau"
 PLM_the_punch_card_bureau_desc: "A bureau of tabulating machines processes a million cards a day."
 PLM_palanmir_3_0: "Palanmir 3.0"
 PLM_palanmir_3_0_desc: "The third generation of Palanmir learns from its own predictions."
 PLM_total_awareness: "Total Awareness"
 PLM_total_awareness_desc: "Nothing happens in the Technate that Palanmir does not record."
 PLM_the_all_seeing_stone: "The All-Seeing Stone"
 PLM_the_all_seeing_stone_desc: "Palanmir no longer collects data about the world. It is beginning to understand it."

 # Research
 PLM_the_kaunas_laboratories: "The Kaunas Laboratories"
 PLM_the_kaunas_laboratories_desc: "Mr Phiel's money builds laboratories that Lithuania could never have afforded."
 PLM_vytautas_magnus_university: "Vytautas Magnus University"
 PLM_vytautas_magnus_university_desc: "The university in Kaunas receives the largest grant in its history - and a new board of trustees."
 PLM_poach_foreign_scientists: "Poach Foreign Scientists"
 PLM_poach_foreign_scientists_desc: "Every scientist who is unhappy in Berlin, Moscow or Warsaw receives a letter from Kaunas with a very generous offer."
 PLM_the_engineering_faculty: "The Engineering Faculty"
 PLM_the_engineering_faculty_desc: "Engineers are the only profession the Technate cannot have too many of."
 PLM_calculating_machines: "Calculating Machines"
 PLM_calculating_machines_desc: "Palanmir needs faster machines, and the Technate will build them."
 PLM_the_radio_laboratory: "The Radio Laboratory"
 PLM_the_radio_laboratory_desc: "Radio waves can carry messages - and find aircraft."
 PLM_the_rocket_society: "The Rocket Society"
 PLM_the_rocket_society_desc: "A group of young enthusiasts in Kaunas fire rockets over the Nemunas. Mr Phiel likes ambition."
 PLM_the_research_campus: "The Research Campus"
 PLM_the_research_campus_desc: "A whole district of Kaunas becomes a campus where scientists live, work and are measured."
 PLM_science_over_sentiment: "Science over Sentiment"
 PLM_science_over_sentiment_desc: "If an experiment is worth doing, it is worth doing now."

 # Construction and industry
 PLM_algorithmic_construction: "Algorithmic Construction"
 PLM_algorithmic_construction_desc: "Palanmir plans every building site: where the bricks go, when the cement arrives, who works the night shift."
 PLM_the_klaipeda_works: "The Klaipėda Works"
 PLM_the_klaipeda_works_desc: "Lithuania's only port gets a modern shipyard."
 PLM_the_kaunas_factories: "The Kaunas Factories"
 PLM_the_kaunas_factories_desc: "Factories designed by Palanmir, built by Palanmir and run by Palanmir."
 PLM_automated_planning: "Automated Planning"
 PLM_automated_planning_desc: "Roads and railways are planned by the machine, not by committees."
 PLM_the_seven_day_week: "The Seven-Day Week"
 PLM_the_seven_day_week_desc: "Palanmir has calculated that Sunday is inefficient."
 PLM_the_concrete_algorithm: "The Concrete Algorithm"
 PLM_the_concrete_algorithm_desc: "Prefabricated, standardised, optimised: the Technate builds faster than any state in Europe."
 PLM_the_industrial_stack: "The Industrial Stack"
 PLM_the_industrial_stack_desc: "A full industrial base, from steel to shells, planned as one machine."

 # The army
 PLM_the_data_driven_army: "The Data-Driven Army"
 PLM_the_data_driven_army_desc: "General Algirdas Tinklas believes the next war will be won by the side with the best information."
 PLM_predictive_maintenance: "Predictive Maintenance"
 PLM_predictive_maintenance_desc: "Palanmir knows when a rifle will jam before the soldier does."
 PLM_signals_intelligence: "Signals Intelligence"
 PLM_signals_intelligence_desc: "Every radio signal in the Baltic is recorded, sorted and decoded."
 PLM_the_air_wing: "The Air Wing"
 PLM_the_air_wing_desc: "Rasa Debesytė, a pilot with more hours than most of the General Staff together, reorganises the air force."
 PLM_algorithmic_doctrine: "Algorithmic Doctrine"
 PLM_algorithmic_doctrine_desc: "Battle plans calculated, not improvised."
 PLM_the_riflemens_union: "The Riflemen's Union"
 PLM_the_riflemens_union_desc: "The Lithuanian Riflemen's Union trains tens of thousands of volunteers. Palanmir now knows exactly where every one of them is."

 # Foreign policy
 PLM_the_client_list: "The Client List"
 PLM_the_client_list_desc: "If Palanmir works for Lithuania, it will work for anyone who can pay. Mr Phiel has a list of potential clients."
 PLM_the_vilnius_question: "The Vilnius Question"
 PLM_the_vilnius_question_desc: "Vilnius is the historic capital of Lithuania, and Poland has held it since 1920. Palanmir has run the numbers."
 PLM_memel_data_hub: "The Memel Data Hub"
 PLM_memel_data_hub_desc: "The cable to Sweden makes Klaipėda the data hub of the Baltic."
 PLM_the_baltic_data_union: "The Baltic Data Union"
 PLM_the_baltic_data_union_desc: "Latvia, Estonia and Finland are offered Palanmir's predictions as friends, not clients."
 PLM_export_palanmir: "Export Palanmir"
 PLM_export_palanmir_desc: "Palanmir is the Technate's most valuable export."
 PLM_reclaim_vilnius: "Reclaim Vilnius"
 PLM_reclaim_vilnius_desc: "Palanmir predicts that Warsaw will give in. Send the ultimatum."
 PLM_the_global_platform: "The Global Platform"
 PLM_the_global_platform_desc: "Every client of Palanmir makes Palanmir smarter, and every client needs it more."
