 # The Regency and the Infant President
 ODL_the_baby_president: "The Baby President"
 ODL_the_baby_president_desc: "The Republic of 1918 survived the storms of 1920, and its oil has made it rich. Its President, by a turn of events nobody in Baku can quite explain, is Ilham Aliyev - who is still in nappies. The nation adores him. The Regency Council governs in his name, and waits for him to grow up."
 ODL_the_regency_council: "The Regency Council"
 ODL_the_regency_council_desc: "Somebody has to sign the laws until the President can hold a pen. The question is who sits on the council that signs them."
 ODL_the_presidential_nursery: "The Presidential Nursery"
 ODL_the_presidential_nursery_desc: "The nursery in the Presidential Palace is the most photographed room in the Caucasus, and half the young couples of Baku want one just like it."
 ODL_regency_of_the_musavat: "Regency of the Musavat"
 ODL_regency_of_the_musavat_desc: "Mammad Amin Rasulzade, who proclaimed the Republic in 1918, returns from exile to chair the Regency Council. The Musavat will govern as it always promised: by law, by parliament and by consent."
 ODL_regency_of_the_oil_barons: "Regency of the Oil Barons"
 ODL_regency_of_the_oil_barons_desc: "The men who own the wells of Absheron pay for the Republic. Let them run it until the President is old enough to read a balance sheet."
 ODL_regency_of_the_generals: "Regency of the Generals"
 ODL_regency_of_the_generals_desc: "General Shikhlinski and the officers of the National Army will guard the President - and the Republic - until he comes of age."
 ODL_first_words: "First Words"
 ODL_first_words_desc: "The whole government has gathered around the presidential cot. The President is about to speak."
 ODL_the_national_anthem: "The National Anthem"
 ODL_the_national_anthem_desc: "Uzeyir Hajibeyov's anthem of 1919 is sung in every school, at every parade - and, every evening, as a lullaby in the Presidential Palace."
 ODL_womens_suffrage: "Women's Suffrage"
 ODL_womens_suffrage_desc: "In 1918 the Republic gave women the vote, the first country of the Muslim world to do so. The Musavat regency makes it the foundation of a modern state."
 ODL_the_paris_emigres: "The Paris Émigrés"
 ODL_the_paris_emigres_desc: "Jeyhun Hajibeyli has spent years in Paris arguing Azerbaijan's case in newspapers and salons. Bring him home to argue it to the world."
 ODL_the_war_council: "The War Council"
 ODL_the_war_council_desc: "The generals' regency meets in the War Ministry, not the Palace. Its first order: an army ready for anything."
 ODL_first_steps: "First Steps"
 ODL_first_steps_desc: "The President is on his feet. The question is which way he will walk."
 ODL_the_opera_of_uzeyir: "The Opera of Uzeyir"
 ODL_the_opera_of_uzeyir_desc: "'Leyli and Majnun', the first opera of the Muslim East, was written in Baku in 1908. A new season at the Opera House shows the world the Republic's culture."
 ODL_the_latin_alphabet: "The Latin Alphabet"
 ODL_the_latin_alphabet_desc: "Azerbaijani has been written in the Latin alphabet since the 1920s. A national literacy campaign teaches it in every village."
 ODL_the_kindergarten_cabinet: "The Kindergarten Cabinet"
 ODL_the_kindergarten_cabinet_desc: "The President has announced that he wishes to appoint his own ministers. The Regency Council is nervous."
 ODL_baku_state_university: "Baku State University"
 ODL_baku_state_university_desc: "Founded in 1919, the university trains the engineers, doctors and chemists the oil republic needs."
 ODL_school_days: "School Days"
 ODL_school_days_desc: "The President goes to school. His teachers report that he is very good at geography, especially the borders."
 ODL_the_president_takes_charge: "The President Takes Charge"
 ODL_the_president_takes_charge_desc: "The President has grown up - or at least grown up enough. The Regency Council is thanked for its service and dissolved."
 ODL_the_eternal_flame: "The Eternal Flame"
 ODL_the_eternal_flame_desc: "At Yanar Dag the hillside has burned for as long as anyone remembers, and at Ateshgah fire-worshippers once prayed to flames that rose from the earth. Azerbaijan is the Land of Fire, and its people are one."

 # Army and air force
 ODL_the_national_army: "The National Army"
 ODL_the_national_army_desc: "The army that defended the Republic in 1918 is small, proud and in need of modern weapons."
 ODL_shikhlinskis_artillery: "Shikhlinski's Artillery"
 ODL_shikhlinskis_artillery_desc: "General Aliagha Shikhlinski, whom the Russian army called 'the god of artillery', rebuilds the Republic's guns on his own principles."
 ODL_karabakh_mountain_brigades: "Karabakh Mountain Brigades"
 ODL_karabakh_mountain_brigades_desc: "The mountains of Karabakh and Nakhchivan need troops who can fight on goat paths and in the snow."
 ODL_the_shusha_cavalry: "The Shusha Cavalry"
 ODL_the_shusha_cavalry_desc: "Karabakh horses are famous throughout the Caucasus, and so are the men who ride them."
 ODL_wings_of_the_republic: "Wings of the Republic"
 ODL_wings_of_the_republic_desc: "A flying school and an airfield outside Baku: the beginning of an air force."
 ODL_the_military_academy: "The Military Academy"
 ODL_the_military_academy_desc: "Baku's military school becomes an academy that trains staff officers to European standards."
 ODL_conscription_reform: "Conscription Reform"
 ODL_conscription_reform_desc: "Every young man of the Republic serves, from Lankaran to Zaqatala."
 ODL_aslanovs_tanks: "Aslanov's Tanks"
 ODL_aslanovs_tanks_desc: "A young cavalry officer named Hazi Aslanov has ideas about armour that nobody in the General Staff understands. Give him a battalion and see."
 ODL_fighter_squadrons: "Fighter Squadrons"
 ODL_fighter_squadrons_desc: "Fighters to protect the oil fields from the air."
 ODL_defend_the_absheron: "Defend the Absheron"
 ODL_defend_the_absheron_desc: "Every great power covets the oil of the Absheron peninsula. Bunkers and anti-aircraft guns will make it expensive to take."
 ODL_mountain_warfare_doctrine: "Mountain Warfare Doctrine"
 ODL_mountain_warfare_doctrine_desc: "The Caucasus is the Republic's fortress. The army will learn to fight in it better than anyone."
 ODL_motorised_cavalry: "Motorised Cavalry"
 ODL_motorised_cavalry_desc: "Lorries and armoured cars for the cavalry: speed without the horse."
 ODL_close_air_support: "Close Air Support"
 ODL_close_air_support_desc: "Ground-attack aircraft for the mountain passes."
 ODL_the_fire_guard: "The Fire Guard"
 ODL_the_fire_guard_desc: "The elite of the National Army swears its oath before the flames of Yanar Dag."

 # Oil and industry
 ODL_the_oil_republic: "The Oil Republic"
 ODL_the_oil_republic_desc: "At the turn of the century Baku produced half of the world's oil. The wells are older now, but the Republic still floats on them."
 ODL_the_black_city: "The Black City"
 ODL_the_black_city_desc: "East of Baku lies the Black City, a district of refineries so thick with soot that it gave itself its name. Modernise it."
 ODL_the_nobel_legacy: "The Nobel Legacy"
 ODL_the_nobel_legacy_desc: "The Nobel brothers built the first oil tanker and the first pipelines of Baku. Their engineers and methods are still the best in the region."
 ODL_ganja_industry: "Ganja Industry"
 ODL_ganja_industry_desc: "The Republic's second city gets factories of its own."
 ODL_railways_of_the_republic: "Railways of the Republic"
 ODL_railways_of_the_republic_desc: "Better railways from Baku to Ganja, Tbilisi and the Iranian border."
 ODL_bibi_heybat_bay: "Bibi-Heybat Bay"
 ODL_bibi_heybat_bay_desc: "Engineers have filled in part of the Bibi-Heybat bay to drill the oil beneath the sea bed. Extend the reclaimed land."
 ODL_oil_concessions: "Oil Concessions"
 ODL_oil_concessions_desc: "Foreign oil companies are queueing at the Ministry. Each concession brings a factory - and takes a share of the oil."
 ODL_the_oil_council: "The Oil Council"
 ODL_the_oil_council_desc: "The oil industrialists of Baku want a seat at the table. Give them one - in the Ministry, where they can be watched."
 ODL_the_sumgait_works: "The Sumgait Works"
 ODL_the_sumgait_works_desc: "On the coast north of Baku the planners see a new industrial town of steel and chemicals."
 ODL_baku_batumi_pipeline: "The Baku-Batumi Pipeline"
 ODL_baku_batumi_pipeline_desc: "The pipeline of 1906 carries Baku's oil to the Black Sea. Doubled and modernised, it carries the Republic's wealth to the world."
 ODL_petrochemistry_institute: "The Petrochemistry Institute"
 ODL_petrochemistry_institute_desc: "Young Yusif Mammadaliyev believes oil can be turned into almost anything. Give him an institute."
 ODL_mingachevir_dam: "The Mingachevir Dam"
 ODL_mingachevir_dam_desc: "A dam on the Kura at Mingachevir will light Ganja and water the plains."
 ODL_caspian_trade: "Caspian Trade"
 ODL_caspian_trade_desc: "Baku is the greatest port of the Caspian. Trade with Persia and Central Asia brings capital to the Republic."
 ODL_the_oil_fund: "The Oil Fund"
 ODL_the_oil_fund_desc: "A share of every barrel goes into a state fund, saved for the day the wells run dry. A very modern idea, says the President."
 ODL_heavy_industry: "Heavy Industry"
 ODL_heavy_industry_desc: "The Republic arms itself with its own factories."
 ODL_oil_capital_of_the_world: "Oil Capital of the World"
 ODL_oil_capital_of_the_world_desc: "Baku was the oil capital of the world once. It will be again."

 # Foreign policy, the Southern Question and Odlar Yurdu
 ODL_the_republic_abroad: "The Republic Abroad"
 ODL_the_republic_abroad_desc: "A small republic between great empires needs friends - and needs them to know it exists."
 ODL_the_treaty_of_moscow: "The Treaty of Moscow"
 ODL_the_treaty_of_moscow_desc: "In 1920 Moscow recognised the Republic, as it recognised Georgia. As long as Baku keeps selling oil to the Soviets, the treaty will hold."
 ODL_one_nation_two_states: "One Nation, Two States"
 ODL_one_nation_two_states_desc: "Turks and Azerbaijanis speak almost the same language, and in 1918 the Ottoman Army of Islam fought for Baku beside the Republic's own army. 'Bir millət, iki dövlət' - one nation, two states."
 ODL_british_oil_partners: "British Oil Partners"
 ODL_british_oil_partners_desc: "British troops held Baku in 1919, and British companies still want its oil."
 ODL_german_engineers: "German Engineers"
 ODL_german_engineers_desc: "German firms offer radio sets, power stations and engineers in exchange for oil."
 ODL_the_caucasian_house: "The Caucasian House"
 ODL_the_caucasian_house_desc: "In 1918 Georgia, Armenia and Azerbaijan left Russia together as the Transcaucasian Federation. A new alliance of the peoples of the Caucasus can succeed where that one failed."
 ODL_the_neutral_caspian: "The Neutral Caspian"
 ODL_the_neutral_caspian_desc: "The Republic will be the Switzerland of the Caucasus: armed, rich and friends with everyone."
 ODL_turkish_military_mission: "Turkish Military Mission"
 ODL_turkish_military_mission_desc: "Turkish officers train the National Army and bring Turkish rifles with them."
 ODL_khasmammadovs_embassy: "Khasmammadov's Embassy"
 ODL_khasmammadovs_embassy_desc: "Khalil bey Khasmammadov, the Republic's first envoy to Turkey, knows every corridor of Ankara."
 ODL_oil_diplomacy: "Oil Diplomacy"
 ODL_oil_diplomacy_desc: "Every great power needs oil, and every great power has weapons to spare."
 ODL_the_caucasian_legion: "The Caucasian Legion"
 ODL_the_caucasian_legion_desc: "Volunteers from all over the Caucasus join a legion under the Republic's banner."
 ODL_the_southern_question: "The Southern Question"
 ODL_the_southern_question_desc: "More Azerbaijanis live south of the Araz, in Tabriz and Urmia, than in the Republic itself. They are ruled from Tehran."
 ODL_the_tabriz_uprising: "The Tabriz Uprising"
 ODL_the_tabriz_uprising_desc: "The committees in Tabriz are ready. When they rise, the National Army will cross the Araz to support them."
 ODL_a_deal_with_tehran: "A Deal with Tehran"
 ODL_a_deal_with_tehran_desc: "Tehran needs money more than it needs Tabriz. Offer it factories and a share of Baku's oil for the Azerbaijani provinces."
 ODL_the_land_of_fire: "The Land of Fire"
 ODL_the_land_of_fire_desc: "North and South are one at last. Odlar Yurdu - the Land of Fire - is whole."
 ODL_derbent_and_beyond: "Derbent and Beyond"
 ODL_derbent_and_beyond_desc: "The old city of Derbent, the gate of the Caucasus, was an Azerbaijani khanate once."
