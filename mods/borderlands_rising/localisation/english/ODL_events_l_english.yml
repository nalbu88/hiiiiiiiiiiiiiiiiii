l_english:
 odl.2.t: "The President's First Word"
 odl.2.d: "The Prime Minister, the Chief of the General Staff, three oil barons and most of the diplomatic corps are crowded around the presidential cot. Photographers wait in the corridor. For a long moment the President studies the assembled dignitaries with great seriousness.\n\nThen he opens his mouth, and the Republic holds its breath."
 odl.2.a: "'Neft!' (Oil!)"
 odl.2.b: "'Ana!' (Mother!)"
 odl.2.c: "'Vətən!' (Homeland!)"
 odl.3.t: "The President's First Steps"
 odl.3.d: "Newsreel cameras captured the moment: the President, holding on to the leg of the Cabinet table, let go and took four wobbly steps across the floor of the Palace. Every newspaper in Baku has printed the photographs.\n\nThe Regency Council is less interested in how far he walked than in which way. He was heading for..."
 odl.3.a: "...the Ministry of Oil."
 odl.3.b: "...the General Staff."
 odl.4.t: "The Kindergarten Cabinet"
 odl.4.d: "The President has announced his first cabinet. A stuffed bear is to be Minister of Defence, a wooden horse Minister of Transport and his nanny Prime Minister. The President has also appointed himself Minister of Biscuits.\n\nThe Regency Council has met in emergency session. Foreign newspapers are delighted. The bear has not yet given an interview."
 odl.4.a: "The bear will make a fine Minister of Defence."
 odl.4.b: "The Regency Council gently overrules him."
 odl.5.t: "The President Takes Charge"
 odl.5.d: "In a short ceremony at the National Council, the President thanked the members of the Regency Council for their service, shook hands with each of them, and informed them that their services would no longer be required. Then he read a speech - by himself, without notes and only slightly helped by his teacher.\n\nBaku has a President again, in every sense of the word."
 odl.5.a: "A speech to the nation."
 odl.5.b: "A speech to the army."
 odl.10.t: "An Invitation to the Caucasian House"
 odl.10.d: "[From.GetNameDefCap] invites us to join §YThe Caucasian House§!, an alliance of the peoples of the Caucasus 'so that the mountains never again belong to empires'. Baku offers oil, money and a modern army."
 odl.10.a: "Join the Caucasian House."
 odl.10.b: "We will keep our own counsel."
 odl.11.t: "Our Invitation Was Declined"
 odl.11.d: "[From.GetNameDefCap] has declined to join the Caucasian House."
 odl.11.a: "The door remains open."
 odl.20.t: "Baku Proposes a Deal"
 odl.20.d: "The envoy of [From.GetNameDef] has brought an unusual offer to Tehran: factories, investment and a permanent share of the oil of Baku, in exchange for the provinces of Tabriz and West Azerbaijan, whose people speak the language of Baku rather than of Tehran.\n\nThe Shah's ministers are divided. The money is real. So, they say, is the precedent."
 odl.20.a: "Accept the oil and the factories."
 odl.20.b: "Iran's provinces are not for sale."
 odl.21.t: "Baku Demands South Azerbaijan"
 odl.21.d: "[From.GetNameDefCap] demands the cession of Tabriz and West Azerbaijan, 'in accordance with the will of their people'. The committees in Tabriz have called a general strike in support. With our army needed elsewhere, our generals doubt that the provinces can be held by force."
 odl.21.a: "Cede the provinces."
 odl.21.b: "Never."
 odl.22.t: "Tehran Agrees"
 odl.22.d: "Iran has agreed to cede Tabriz and West Azerbaijan to the Republic. In the streets of Tabriz, crowds are waving the tricolour of the Republic."
 odl.22.a: "North and South, together at last!"
 odl.23.t: "Tehran Refuses"
 odl.23.d: "Iran has rejected our proposal. The committees in Tabriz ask how long they must wait."
 odl.23.a: "Then we will take what is ours."
 odl.23.b: "Patience. The time is not yet right."
 odl.30.t: "One Nation, Two States"
 odl.30.d: "The government of [From.GetNameDef] proposes a treaty of eternal friendship between our peoples, who share a language, a history and the memory of the Army of Islam that fought for Baku in 1918. 'Bir millət, iki dövlət,' the Azerbaijani envoy said in Ankara: one nation, two states."
 odl.30.a: "One nation, two states!"
 odl.30.b: "Turkey has interests of its own."
 odl.31.t: "Ankara Embraces Us"
 odl.31.d: "Turkey has accepted our treaty of friendship. One nation, two states: the words are on every front page in Baku."
 odl.31.a: "Long live the friendship of our peoples!"
 odl.32.t: "Ankara Keeps Its Distance"
 odl.32.d: "Turkey has politely declined our treaty of friendship, citing its obligations to its neighbours."
 odl.32.a: "Brothers can disagree."
