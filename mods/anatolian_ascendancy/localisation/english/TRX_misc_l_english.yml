 ### Scripted effect tooltips ###
 TRX_start_first_plan_tt:0 "Starts the §YFirst Five-Year Plan§! mission: own §Y3 more civilian factories§! and §Y1 more military factory§! than today within §Y365 days§!."
 TRX_start_second_plan_tt:0 "Starts the §YSecond Five-Year Plan§! mission: own §Y5 more civilian factories§! and §Y3 more military factories§! than today within §Y540 days§!."
 TRX_plan_civ_goal_tt:0 "Own at least §Y[?TRX_plan_civ_goal|0]§! civilian factories"
 TRX_plan_mil_goal_tt:0 "Own at least §Y[?TRX_plan_mil_goal|0]§! military factories"
 TRX_add_arrow_tt:0 "Adds an arrow to §YThe Six Arrows§!. Every second arrow upgrades the spirit, and all six turn it into §YThe Kemalist State§!."
 TRX_placate_islamists_tt:0 "Removes religious unrest from the states of central and northern Anatolia."
 TRX_kurdish_concessions_tt:0 "Gain §Ycores§! on §YDiyarbakır§!, §YHakkâri§!, §YTunceli§! and §YVan§!. Their §Yresistance§! ends and Kurdish unrest there is removed."
 TRX_integrate_claimed_states_tt:0 "Gain §Ycores§! on every state we own and claim."
 TRX_integrate_compliant_states_tt:0 "Gain §Ycores§! on every state we own that we claim or that is at least §Y30%§! compliant."
 TRX_integrate_all_owned_states_tt:0 "Gain §Ycores§! on every state we own."
 TRX_integrate_turkic_states_tt:0 "Gain §Ycores§! on every Turkic state we own and on every state we own and claim."
 TRX_request_allied_membership_tt:0 "We will ask the leading democratic alliance (§YBritain§! first, then the §YUnited States§! and §YFrance§!) to let us join."
 TRX_request_axis_membership_tt:0 "We will ask the leading fascist alliance (§YGermany§! first, then §YItaly§! and §YJapan§!) to let us join."
 TRX_invite_pact_members_tt:0 "Every independent neighbour outside a faction (§YGreece§!, §YYugoslavia§!, §YRomania§!, §YBulgaria§!, §YAlbania§!, §YIran§!, §YIraq§!, §YAfghanistan§!, §YSaudi Arabia§! and §YYemen§!) will be invited to join our alliance."

 ### Characters ###
 TRX_abdulmecid_ii:0 "Abdülmecid II"
 TRX_abdulmecid_ii_desc:0 "The last Caliph of the Ottoman dynasty, Abdülmecid II was exiled in 1924 and settled in France, where he became a respected painter and musician. Cultured, liberal-minded and deeply devout, he has been called home to wear the crown his family lost."
 TRX_nihal_atsiz:0 "Nihal Atsız"
 TRX_nihal_atsiz_desc:0 "Novelist, poet and the fiercest voice of Turanism, Hüseyin Nihal Atsız dreams of a single state for all the Turkic peoples. His romantic nationalism has found an army willing to fight for it."
 TRX_sefik_husnu:0 "Şefik Hüsnü"
 TRX_sefik_husnu_desc:0 "A Paris-trained physician who has led the underground Communist Party of Turkey for more than a decade, Şefik Hüsnü Değmer now heads the first workers' government in Anatolia."
 TRX_celal_bayar:0 "Celal Bayar"
 TRX_celal_bayar_desc:0 "Founder of the İş Bankası and veteran of the War of Independence, Celal Bayar is a pragmatic economist who believes that a free market and a free vote will make Turkey prosper."
