 ### Units ###
 trx_janissary_guard:0 "Janissary Guard"
 trx_janissary_guard_desc:0 "Yeniçeri Muhafız Taburu. Elite guard infantry with superior organisation and defence, at the cost of longer training and more equipment. Excels in cities."
 trx_akinci_cavalry:0 "Akıncı Cavalry"
 trx_akinci_cavalry_desc:0 "Akıncı Süvari Taburu. Fast light cavalry raiders with high breakthrough and suppression. Deadly on plains and in deserts, weak in mountains and cities."
 trx_mountain_commando:0 "Mountain Commandos"
 trx_mountain_commando_desc:0 "Dağ Komando Taburu. Special forces mountaineers with stronger mountain and hill bonuses than regular mountaineers."
 trx_straits_artillery:0 "Straits Fortress Artillery"
 trx_straits_artillery_desc:0 "Boğaz Tahkimat Topçusu. Heavy fortress guns that let a division entrench faster and hold river and city lines."

