 ### Game rule ###
 TRX_AI_BEHAVIOR:0 "@TUR Turkey (Anatolian Ascendancy)"
 TRX_RULE_OPTION_DEFAULT:0 "Default"
 TRX_RULE_OPTION_DEFAULT_DESC:0 "With historical focus on, Turkey stays Kemalist. Otherwise it picks a weighted random path, most often Kemalist."
 TRX_RULE_OPTION_KEMALIST:0 "Kemalist Republic"
 TRX_RULE_OPTION_KEMALIST_DESC:0 "Turkey will follow the Six Arrows and armed neutrality."
 TRX_RULE_OPTION_DEMOCRATIC:0 "Democratic Opening"
 TRX_RULE_OPTION_DEMOCRATIC_DESC:0 "Turkey will hold free elections and seek a Balkan federation."
 TRX_RULE_OPTION_OTTOMAN:0 "Ottoman Restoration"
 TRX_RULE_OPTION_OTTOMAN_DESC:0 "Turkey will restore the Sultanate and try to rebuild the Ottoman Empire."
 TRX_RULE_OPTION_TURANIST:0 "Turanism"
 TRX_RULE_OPTION_TURANIST_DESC:0 "Turkey will turn to pan-Turkic nationalism and march towards Turan."
 TRX_RULE_OPTION_SOCIALIST:0 "Red Crescent"
 TRX_RULE_OPTION_SOCIALIST_DESC:0 "Turkey will undergo a socialist revolution."
 TRX_RULE_OPTION_RANDOM:0 "Random"
 TRX_RULE_OPTION_RANDOM_DESC:0 "Turkey will pick one of the five paths at random."
