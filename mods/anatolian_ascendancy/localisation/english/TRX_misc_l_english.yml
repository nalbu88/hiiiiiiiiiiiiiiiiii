 ### National spirits ###
 TRX_eastern_question:0 "The Eastern Question"
 TRX_eastern_question_desc:0 "Poverty, banditry and simmering Kurdish discontent in the eastern provinces drain the Republic. Until Ankara settles the question, one way or another, the east will remain a wound."
 TRX_eastern_reconciliation:0 "Eastern Reconciliation"
 TRX_eastern_reconciliation_desc:0 "Schools, roads and local autonomy have won over the eastern provinces."
 TRX_eastern_pacification:0 "Eastern Pacification"
 TRX_eastern_pacification_desc:0 "The east has been pacified by force. It is quiet, for now, and heavily garrisoned."
 TRX_straits_sovereignty:0 "Straits Sovereignty"
 TRX_straits_sovereignty_desc:0 "The Montreux Convention returned full control of the Bosphorus and the Dardanelles to Turkey."
 TRX_masters_of_the_straits_idea:0 "Masters of the Straits"
 TRX_masters_of_the_straits_idea_desc:0 "Fortresses on both shores and a modern fleet make the Straits the most heavily defended waterway in the world."
 TRX_six_arrows:0 "The Six Arrows"
 TRX_six_arrows_desc:0 "Republicanism, nationalism, populism, statism, laicism and revolutionism: the six principles of Kemalism."
 TRX_kemalist_state:0 "The Kemalist State"
 TRX_kemalist_state_desc:0 "The Six Arrows fly together. The Kemalist Republic is stable, modern and confident."
 TRX_multi_party_democracy:0 "Multi-Party Democracy"
 TRX_multi_party_democracy_desc:0 "Rival parties now compete openly for the votes of the Turkish people."
 TRX_balkan_partnership_idea:0 "Balkan Partnership"
 TRX_balkan_partnership_idea_desc:0 "Trade, scholarship and goodwill flow freely between Turkey and its Balkan neighbours."
 TRX_sublime_porte:0 "The Sublime Porte"
 TRX_sublime_porte_desc:0 "The ancient machinery of Ottoman government has been restored around the throne of the Sultan."
 TRX_ottoman_revival:0 "Ottoman Revival"
 TRX_ottoman_revival_desc:0 "The banners of the Empire fly again, and its soldiers march to reclaim what was lost."
 TRX_grey_wolves:0 "The Grey Wolves"
 TRX_grey_wolves_desc:0 "Uniformed Turanist youth fill the squares and the recruiting offices."
 TRX_kizil_elma_idea:0 "Kızıl Elma"
 TRX_kizil_elma_idea_desc:0 "The Red Apple beckons from beyond the horizon."
 TRX_village_soviets_idea:0 "Village Soviets"
 TRX_village_soviets_idea_desc:0 "Elected councils of peasants and workers run the villages and cooperatives."
 TRX_red_crescent:0 "The Red Crescent"
 TRX_red_crescent_desc:0 "A revolutionary Turkey mobilises its workers and peasants for the defence of socialism."
 TRX_reformed_army:0 "Reformed Army"
 TRX_reformed_army_desc:0 "New regulations, new training and new officers are transforming the Turkish Army."
 TRX_mehmetcik_spirit_idea:0 "Spirit of Mehmetçik"
 TRX_mehmetcik_spirit_idea_desc:0 "The Turkish infantryman is famous for his endurance and his stubbornness in defence."
 TRX_defense_of_anatolia_idea:0 "Defence of Anatolia"
 TRX_defense_of_anatolia_idea_desc:0 "Every ridge a trench, every river a moat."
 TRX_akinci_doctrine_idea:0 "Lightning of the Akıncı"
 TRX_akinci_doctrine_idea_desc:0 "Fast columns and bold raids carry the fight to the enemy."
 TRX_general_mobilization_idea:0 "General Mobilisation"
 TRX_general_mobilization_idea_desc:0 "The nation stands under arms."
 TRX_army_of_the_republic_idea:0 "Army of the Republic"
 TRX_army_of_the_republic_idea_desc:0 "A modern, well-trained army worthy of the nation."
 TRX_aeronautical_association_idea:0 "Turkish Aeronautical Association"
 TRX_aeronautical_association_idea_desc:0 "Public subscriptions fund flight schools and aircraft across the country."
 TRX_modern_air_force_idea:0 "A Modern Air Force"
 TRX_modern_air_force_idea_desc:0 "The Turkish Air Force has come of age."
 TRX_statist_drive:0 "Statist Industrial Drive"
 TRX_statist_drive_desc:0 "State planning and state banks are building the factories private capital could not."
 TRX_statism_idea:0 "Statism"
 TRX_statism_idea_desc:0 "The state owns and directs the commanding heights of the economy."
 TRX_liberal_market_idea:0 "Liberal Market"
 TRX_liberal_market_idea_desc:0 "Private enterprise and foreign trade drive Turkish growth."
 TRX_industrial_heartland_idea:0 "Anatolian Industrial Heartland"
 TRX_industrial_heartland_idea_desc:0 "Central Anatolia is now ringed with mines, mills and power stations."
 TRX_village_institutes_idea:0 "Village Institutes"
 TRX_village_institutes_idea_desc:0 "Rural teachers trained in the Village Institutes are spreading literacy and modern farming."
 TRX_scientific_republic_idea:0 "A Scientific Republic"
 TRX_scientific_republic_idea_desc:0 "Science is the truest guide in life."
 TRX_national_unity_idea:0 "National Unity"
 TRX_national_unity_idea_desc:0 "From Edirne to Van, the Republic is one nation."
 TRX_spirit_misak_fulfilled:0 "The National Pact Fulfilled"
 TRX_spirit_misak_fulfilled_desc:0 "Every land promised in the Misak-ı Millî has been brought home."
 TRX_spirit_ottoman_restored:0 "The Sublime State Restored"
 TRX_spirit_ottoman_restored_desc:0 "Devlet-i Aliyye, the Sublime Ottoman State, rules again over three continents."
 TRX_spirit_kayser_i_rum:0 "Caesar of Rome"
 TRX_spirit_kayser_i_rum_desc:0 "The Padishah is also Kayser-i Rûm, heir of Constantine and of Mehmed the Conqueror alike."
 TRX_spirit_turan_unity:0 "The Unity of Turan"
 TRX_spirit_turan_unity_desc:0 "From the Bosphorus to the Altai the Turkic peoples stand united under one banner."
 TRX_spirit_balkan_federation:0 "Federal Unity"
 TRX_spirit_balkan_federation_desc:0 "Old enemies have become fellow citizens of a single federation."
 TRX_spirit_near_east_socialist:0 "Socialist Federation"
 TRX_spirit_near_east_socialist_desc:0 "The soviet republics of the Near East plan their economies together."

 ### Characters ###
 TRX_abdulmecid_ii:0 "Abdülmecid II"
 TRX_abdulmecid_ii_desc:0 "The last Caliph of the Ottoman dynasty, Abdülmecid II was exiled in 1924 and settled in France, where he became a respected painter and musician. Cultured, liberal-minded and deeply devout, he has been called home to wear the crown his family lost."
 TRX_nihal_atsiz:0 "Nihal Atsız"
 TRX_nihal_atsiz_desc:0 "Novelist, poet and the fiercest voice of Turanism, Hüseyin Nihal Atsız dreams of a single state for all the Turkic peoples. His romantic nationalism has found an army willing to fight for it."
 TRX_sefik_husnu:0 "Şefik Hüsnü"
 TRX_sefik_husnu_desc:0 "A Paris-trained physician who has led the underground Communist Party of Turkey for more than a decade, Şefik Hüsnü Değmer now heads the first workers' government in Anatolia."
 TRX_celal_bayar:0 "Celal Bayar"
 TRX_celal_bayar_desc:0 "Founder of the İş Bankası and veteran of the War of Independence, Celal Bayar is a pragmatic economist who believes that a free market and a free vote will make Turkey prosper."
