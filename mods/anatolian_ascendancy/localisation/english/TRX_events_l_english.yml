l_english:
 trx.1.t:0 "The Republic at the Crossroads"
 trx.1.d:0 "Ankara, 1936. The Republic is thirteen years old. Its founder has given the nation a new alphabet, new laws, new surnames and a new capital, but the world beyond our borders is growing darker by the month.\n\nIn the Grand National Assembly and in the coffee houses of Istanbul, everyone agrees that Turkey must be ready. No one agrees on what it must be ready for."
 trx.1.a:0 "Ankara will chart its own course."
 trx.1.b:0 "Let the people be heard."

 trx.2.t:0 "Turkey Demands Hatay"
 trx.2.d:0 "The Turkish government has formally demanded the transfer of the Sanjak of Alexandretta, which the Turks call Hatay. Ankara argues that the Turkish community there is the largest and that the territory was promised to Turkey by the National Pact.\n\nRefusing will not end the matter. Ankara has made it clear that it is prepared to act."
 trx.2.a:0 "Hand Hatay over to Turkey."
 trx.2.b:0 "We will not be bullied."

 trx.3.t:0 "Hatay Returns"
 trx.3.d:0 "The government of [FROM.GetNameDef] has agreed to transfer Hatay to the Republic. Turkish troops are being welcomed in Antakya and İskenderun with flowers and flags."
 trx.3.a:0 "Welcome home."

 trx.4.t:0 "Hatay Demand Refused"
 trx.4.d:0 "[FROM.GetNameDef] has rejected our demand for Hatay. The Turkish population of the sanjak looks to Ankara to see what we will do next."
 trx.4.a:0 "Then we will take it."
 trx.4.b:0 "Patience. Its time will come."

 trx.5.t:0 "The Saadabad Pact"
 trx.5.d:0 "Turkey has proposed a pact of non-aggression and consultation between the states of the Middle East, to be signed at the Saadabad Palace in Tehran. The signatories would respect each other's borders and refuse to aid any power that attacked one of them."
 trx.5.a:0 "Sign the pact."
 trx.5.b:0 "We prefer to keep our hands free."

 trx.6.t:0 "Renewing the Balkan Entente"
 trx.6.d:0 "Ankara proposes to turn the Balkan Pact of 1934 into a firm guarantee of non-aggression between its members, in the face of growing threats from the great powers."
 trx.6.a:0 "Renew the pact."
 trx.6.b:0 "We have other guarantees."

 trx.8.t:0 "Invitation to the Saadabad Accord"
 trx.8.d:0 "Turkey has founded a military alliance, the Saadabad Accord, and invites us to join. Together the states of the Middle East could resist any great power."
 trx.8.a:0 "Join the Accord."
 trx.8.b:0 "Decline politely."

 trx.9.t:0 "Invitation to the Balkan Pact"
 trx.9.d:0 "Turkey has turned the Balkan Entente into a true military alliance and invites us to stand with it against any aggressor."
 trx.9.a:0 "Join the Balkan Pact."
 trx.9.b:0 "Decline politely."

 trx.10.t:0 "Turkey Requests Membership"
 trx.10.d:0 "The Turkish government has asked to join our alliance. Turkey controls the Straits and the land bridge between Europe and the Middle East, and its army is growing."
 trx.10.a:0 "Welcome them."
 trx.10.b:0 "Refuse."

 trx.11.t:0 "Membership Accepted"
 trx.11.d:0 "[FROM.GetNameDef] has welcomed Turkey into its alliance."
 trx.11.a:0 "Excellent."

 trx.12.t:0 "Membership Refused"
 trx.12.d:0 "[FROM.GetNameDef] has rejected our request to join its alliance."
 trx.12.a:0 "We will manage alone."

 trx.13.t:0 "An Invitation from Ankara"
 trx.13.d:0 "[FROM.GetNameDef] invites us to join its alliance. Membership would bring Turkish protection, and Turkish leadership."
 trx.13.a:0 "We accept."
 trx.13.b:0 "We prefer to stand alone."

 trx.90.t:0 "Turkey Asks to Join the Comintern"
 trx.90.d:0 "The new socialist government in Ankara asks to stand beside us. Turkey would give the revolution a foothold on the Straits and in the Middle East."
 trx.90.a:0 "Welcome, comrades."
 trx.90.b:0 "Turkey must prove itself first."
 trx.91.t:0 "Welcome to the Comintern"
 trx.91.d:0 "[FROM.GetNameDef] has accepted us into its alliance. Turkish workers now stand shoulder to shoulder with the world proletariat."
 trx.91.a:0 "Long live international solidarity!"
 trx.92.t:0 "Moscow Hesitates"
 trx.92.d:0 "[FROM.GetNameDef] has politely declined to take us into its alliance. Perhaps it is just as well that Turkish socialism keeps its own counsel."
 trx.92.a:0 "Then we will go our own way."

 trx.101.t:0 "A Windfall on the Bourse"
 trx.101.d:0 "Our railway and tobacco shares have soared. The Treasury's brokers are toasting their good fortune in the cafés of Galata."
 trx.101.a:0 "Excellent."
 trx.102.t:0 "Steady Gains"
 trx.102.d:0 "The market moved slowly but surely in our favour. A modest profit, but a profit all the same."
 trx.102.a:0 "Every kuruş counts."
 trx.103.t:0 "The Shares Collapse"
 trx.103.d:0 "A rumour of war sent the market tumbling, and our stake went with it."
 trx.103.a:0 "Win some, lose some."
 trx.104.t:0 "Jackpot on the Bourse!"
 trx.104.d:0 "Our mining and shipping stocks have tripled in value. The newspapers are calling the Finance Minister a genius."
 trx.104.a:0 "Let them."
 trx.105.t:0 "A Solid Profit"
 trx.105.d:0 "Our bold wager has paid off handsomely."
 trx.105.a:0 "Well played."
 trx.106.t:0 "A Crash in Galata"
 trx.106.d:0 "The market turned against us overnight. Our position is worthless, and our brokers are not answering the telephone."
 trx.106.a:0 "Fire the brokers."
 trx.107.t:0 "The Deal of the Century"
 trx.107.d:0 "Our insiders were right about everything. The speculation has paid off beyond anyone's dreams, and the Treasury is overflowing."
 trx.107.a:0 "Fortune favours the bold!"
 trx.108.t:0 "A Fortune Made"
 trx.108.d:0 "The great speculation has paid off. The Treasury is richer by a fortune."
 trx.108.a:0 "Splendid."
 trx.109.t:0 "A Narrow Win"
 trx.109.d:0 "It was close, but we came out ahead."
 trx.109.a:0 "A win is a win."
 trx.110.t:0 "Black Friday in Istanbul"
 trx.110.d:0 "The great speculation has collapsed. Our stake is lost, the market is in panic and the opposition press is asking who authorised the gamble."
 trx.110.a:0 "Find a scapegoat."
 trx.111.t:0 "The Grand Prize"
 trx.111.d:0 "The New Year's draw was a record: millions of tickets sold and the grand prize unclaimed. The proceeds go to the state."
 trx.111.a:0 "Happy New Year!"
 trx.112.t:0 "A Good Year for the Lottery"
 trx.112.d:0 "Ticket sales were strong this year, and the state's share is substantial."
 trx.112.a:0 "Very good."
 trx.113.t:0 "A Quiet Draw"
 trx.113.d:0 "Sales were disappointing, but the lottery still made a small profit."
 trx.113.a:0 "Better luck next year."
 trx.114.t:0 "A Gusher!"
 trx.114.d:0 "The TPAO drillers have struck oil, and a lot of it. A column of black crude stands over the derrick."
 trx.114.a:0 "Cap it and start pumping."
 trx.115.t:0 "A Modest Well"
 trx.115.d:0 "The well produces, but not much. It will pay for itself in time."
 trx.115.a:0 "It is a start."
 trx.116.t:0 "A Dry Hole"
 trx.116.d:0 "After weeks of drilling the crews have found nothing but rock and salt water."
 trx.116.a:0 "Try somewhere else."
 trx.120.t:0 "The Bosphorus Bridge Opens"
 trx.120.d:0 "Crowds lined both shores as the first cars crossed from Europe to Asia. Istanbul is a single city at last."
 trx.120.a:0 "Two continents, one nation."
 trx.121.t:0 "The Atatürk Dam is Inaugurated"
 trx.121.d:0 "The waters of the Euphrates are rising behind the new dam. Canals will soon carry them to the dry plains of Harran."
 trx.121.a:0 "Mesopotamia will bloom again."

 trx.20.t:0 "The Caliph Accepts"
 trx.20.d:0 "A telegram has arrived from Paris. Abdülmecid II, the last Caliph, has accepted the invitation to return to Istanbul. Monarchists across the country are already preparing to receive him."
 trx.20.a:0 "Prepare a grand ceremony at Dolmabahçe."
 trx.20.b:0 "Bring him home quietly."

 trx.21.t:0 "Republican Backlash"
 trx.21.d:0 "Veterans of the War of Independence and young Kemalist officers have taken to the streets of Ankara to protest the restoration of the Sultanate. Some garrisons are said to be wavering."
 trx.21.a:0 "Arrest the ringleaders."
 trx.21.b:0 "Offer the republicans seats in the cabinet."

 trx.30.t:0 "The Grey Wolves Rally"
 trx.30.d:0 "Tens of thousands of young Turanists have marched through Istanbul carrying grey wolf banners and maps of a Turkic empire stretching to the Altai."
 trx.30.a:0 "This is the spirit of the nation!"
 trx.30.b:0 "Keep them in check."

 trx.40.t:0 "Strike in Istanbul"
 trx.40.d:0 "With the Communist Party legal, the dockers and tobacco workers of Istanbul have gone on strike for higher wages and recognised unions."
 trx.40.a:0 "Support the workers."
 trx.40.b:0 "Mediate a settlement."

 trx.50.t:0 "The Karabük Furnaces Are Lit"
 trx.50.d:0 "The first blast furnace at Karabük has been lit. For the first time, Turkish iron ore and Turkish coal produce Turkish steel."
 trx.50.a:0 "Steel for the Republic!"

 trx.51.t:0 "Oil Struck at Raman"
 trx.51.d:0 "Drillers on Raman Mountain have struck oil. It is not Baku, but it is ours."
 trx.51.a:0 "Fill the reserve tanks."

 trx.52.t:0 "The First Village Teachers"
 trx.52.d:0 "The first graduates of the Village Institutes are returning to their villages as teachers, agronomists and nurses. Literacy is spreading faster than anyone dared hope."
 trx.52.a:0 "Educated citizens are loyal citizens."
 trx.52.b:0 "Send them where the state needs them most."

 trx.60.t:0 "The Janissaries Parade"
 trx.60.d:0 "The first battalions of the new Janissary Guard paraded through Ankara today to the old mehter marches. Foreign attachés watched in silence."
 trx.60.a:0 "Let Europe take note."

 trx.61.t:0 "Akıncı Manoeuvres"
 trx.61.d:0 "In manoeuvres on the Thracian plain, the new Akıncı cavalry raided a mock enemy's rear areas and vanished before the motorised reserves could react."
 trx.61.a:0 "Lessons learned."


 trx.80.t:0 "Anatolian Ascendancy"
 trx.80.d:0 "Welcome to §YAnatolian Ascendancy§!.\n\nTurkey has a new national focus tree of more than 200 focuses, none longer than 35 days. Five linked political paths, the §YRed Crescent§!, the §YKemalist Republic§!, the §YDemocratic Opening§!, the §YOttoman Restoration§! and §YTuranism§!, each end in a formable nation, and each makes it easier to win cores on new lands.\n\nThe economy branch starts the §YKalkınma Hamlesi§!, a development drive that grows with every economy focus, and unlocks five-year plans, megaprojects, mineral prospecting, chromium diplomacy and the §YIstanbul Bourse§!, where you can gamble political power at very good odds.\n\nYour first quick win: §YConcessions to the East§! settles the Kurdish question and gives you cores on the south-east."
 trx.80.a:0 "İleri!"

 ### News ###
 trx_news.1.t:0 "The Montreux Convention Signed"
 trx_news.1.d:0 "Delegates meeting in Montreux, Switzerland, have agreed to return full sovereignty over the Bosphorus and the Dardanelles to Turkey. Turkish troops may again garrison the Straits, and Ankara may close them to warships of nations at war with Turkey."
 trx_news.1.a:0 "The keys of the Straits are ours again."
 trx_news.1.b:0 "Turkey grows bolder."

 trx_news.2.t:0 "Hatay Joins Turkey"
 trx_news.2.d:0 "The Sanjak of Alexandretta has been transferred to Turkey and renamed Hatay. Celebrations are reported in Antakya and Ankara."
 trx_news.2.a:0 "Another step towards the National Pact."
 trx_news.2.b:0 "A small change on the map."

 trx_news.3.t:0 "The Sultanate Restored in Turkey"
 trx_news.3.d:0 "In a stunning reversal, the Turkish Republic has restored the Ottoman Sultanate. Abdülmecid II, the last Caliph, has returned from his exile in Paris to take the throne of his ancestors."
 trx_news.3.a:0 "Long live the Padishah!"
 trx_news.3.b:0 "The old empire stirs."

 trx_news.4.t:0 "Turanists Seize Power in Ankara"
 trx_news.4.d:0 "The pan-Turkist writer Nihal Atsız has become the leader of Turkey at the head of a radical nationalist movement. He speaks openly of uniting all Turkic peoples from the Balkans to China in a single state."
 trx_news.4.a:0 "Towards Turan!"
 trx_news.4.b:0 "Moscow will not be pleased."

 trx_news.5.t:0 "The Red Crescent Revolution"
 trx_news.5.d:0 "Turkey has become a socialist state. Şefik Hüsnü of the Communist Party of Turkey now leads a government of workers' and peasants' councils."
 trx_news.5.a:0 "Power to the councils!"
 trx_news.5.b:0 "A red flag flies over the Bosphorus."

 trx_news.6.t:0 "Free Elections in Turkey"
 trx_news.6.d:0 "For the first time since the founding of the Republic, Turkish voters have chosen between rival parties. The liberal opposition led by Celal Bayar has won, and the single-party era is over."
 trx_news.6.a:0 "The nation has spoken."
 trx_news.6.b:0 "A new democracy is born."

 trx_news.10.t:0 "Greater Turkey Proclaimed"
 trx_news.10.d:0 "Ankara has proclaimed that every territory named in the National Pact of 1920 is once again Turkish. The Republic now stretches from Western Thrace to Mosul."
 trx_news.10.a:0 "The Pact is fulfilled."
 trx_news.10.b:0 "Turkey's appetite grows."

 trx_news.11.t:0 "The Ottoman Empire Reborn"
 trx_news.11.d:0 "Two decades after its collapse, the Ottoman Empire has risen again. From the Bosphorus the Sultan-Caliph once more rules Damascus, Baghdad, Jerusalem and the Holy Cities."
 trx_news.11.a:0 "Devlet-i Ebed-müddet!"
 trx_news.11.b:0 "The sick man of Europe has recovered."

 trx_news.12.t:0 "Caesar of Rome"
 trx_news.12.d:0 "Holding Rome, Athens, Belgrade, Cairo and Jerusalem, the Ottoman Padishah has proclaimed himself Kayser-i Rûm, Caesar of Rome, heir of both Constantine and Mehmed the Conqueror."
 trx_news.12.a:0 "The world is ours."
 trx_news.12.b:0 "Rome has a new emperor."

 trx_news.13.t:0 "Turan Proclaimed"
 trx_news.13.d:0 "The Turkic peoples from the Bosphorus to Central Asia have been united under a single government in Ankara. The grey wolf banner flies over Baku, Tashkent and Alma-Ata."
 trx_news.13.a:0 "Turan is real!"
 trx_news.13.b:0 "A new giant in Asia."

 trx_news.14.t:0 "The Balkan-Anatolian Federation"
 trx_news.14.d:0 "In a ceremony in Istanbul, the states of the Balkan Pact have merged with Turkey into a single federal state. Old enemies now share one parliament."
 trx_news.14.a:0 "Unity in diversity."
 trx_news.14.b:0 "The Balkans are no longer a powder keg."

 trx_news.15.t:0 "The Near Eastern Socialist Federation"
 trx_news.15.d:0 "The soviet republics of Turkey, Iran, Iraq and the Levant have proclaimed a single socialist federation."
 trx_news.15.a:0 "Workers of the Near East, unite!"
 trx_news.15.b:0 "The revolution has reached the Gulf."

 trx_news.7.t:0 "Military Junta Seizes Power in Turkey"
 trx_news.7.d:0 "Tanks surrounded the Grand National Assembly this morning. Marshal Fevzi Çakmak has announced that a council of officers will govern the country until order is restored."
 trx_news.7.a:0 "The army has saved the nation."
 trx_news.7.b:0 "Another general in power."
 trx_news.8.t:0 "Turkey Among the Great Powers"
 trx_news.8.d:0 "Steel mills, oil fields, dams and a booming stock exchange: in a single generation Turkey has turned itself from a war-ravaged agrarian state into an industrial power."
 trx_news.8.a:0 "The world will take us seriously now."
 trx_news.8.b:0 "A new power rises on the Bosphorus."
 trx_news.9.t:0 "Kanal İstanbul Opens"
 trx_news.9.d:0 "After a year of round-the-clock work, the first ships have passed through Kanal İstanbul, a new waterway linking the Black Sea and the Sea of Marmara."
 trx_news.9.a:0 "A second Bosphorus, built by Turks."
 trx_news.9.b:0 "Ankara now controls two straits."
