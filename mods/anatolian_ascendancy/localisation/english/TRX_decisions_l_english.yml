l_english:
 ### Categories ###
 TRX_straits_category:0 "The Straits"
 TRX_straits_category_desc:0 "Since Montreux the Bosphorus and the Dardanelles are ours again. Fortify them, tax the shipping that passes through, and close them to our enemies in time of war."
 TRX_eastern_development_category:0 "The Eastern Question"
 TRX_eastern_development_category_desc:0 "The eastern provinces are poor, mountainous and restless. Ankara must choose how to bind them to the Republic: with schools and roads, or with garrisons."
 TRX_procurement_category:0 "Arms Procurement"
 TRX_procurement_category_desc:0 "Our own arsenals cannot yet supply the army. Foreign suppliers can, for a price."
 TRX_formables_category:0 "Destiny of the Nation"
 TRX_formables_category_desc:0 "The borders drawn at Lausanne are not the last word. Depending on the path the nation has chosen, a greater destiny awaits."
 TRX_irredentism_category:0 "Lost Lands"
 TRX_irredentism_category_desc:0 "The lands we claim will not return by themselves."

 ### Straits ###
 TRX_levy_straits_transit_fees:0 "Levy Straits Transit Fees"
 TRX_levy_straits_transit_fees_desc:0 "Every merchant ship passing the Bosphorus pays for the lighthouses, pilots and sanitary inspections. The proceeds fund the state."
 TRX_fortify_the_bosphorus:0 "Fortify the Bosphorus"
 TRX_fortify_the_bosphorus_desc:0 "Batteries on both shores of Istanbul will make the city an impregnable fortress."
 TRX_fortify_the_dardanelles:0 "Fortify the Dardanelles"
 TRX_fortify_the_dardanelles_desc:0 "The forts of Çanakkale threw back the Allied fleet in 1915. Rebuilt with modern guns, they will do so again."
 TRX_close_the_straits:0 "Close the Straits"
 TRX_close_the_straits_desc:0 "The Montreux Convention lets Turkey close the Straits to warships when it is at war. Mines, booms and batteries will seal them."

 ### Eastern Question ###
 TRX_policy_of_reconciliation:0 "Policy of Reconciliation"
 TRX_policy_of_reconciliation_desc:0 "Schools, local administration in the local language and investment will win the trust of the eastern provinces. It is expensive and slow, but it lasts."
 TRX_policy_of_pacification:0 "Policy of Pacification"
 TRX_policy_of_pacification_desc:0 "The gendarmerie and the army will impose order on the east. It is quick, but the price will be paid in stability."
 TRX_develop_eastern_province:0 "Develop [FROM.GetName]"
 TRX_develop_eastern_province_desc:0 "Roads, a power station and a state factory will bring [FROM.GetName] into the modern economy."
 TRX_dersim_crisis:0 "The Dersim Crisis"
 TRX_dersim_crisis_desc:0 "Unrest in the mountains of Dersim threatens to become an open revolt. Settle the Eastern Question before it boils over."

 ### Procurement ###
 TRX_buy_german_rifles:0 "Buy German Rifles"
 TRX_buy_german_rifles_desc:0 "Mauser rifles from Germany, paid for with chromium and tobacco."
 TRX_buy_soviet_artillery:0 "Buy Soviet Artillery"
 TRX_buy_soviet_artillery_desc:0 "The friendship treaty of 1925 still opens Soviet arsenals to Turkish buyers."
 TRX_buy_british_trucks:0 "Buy British Trucks"
 TRX_buy_british_trucks_desc:0 "British credit can motorise the Turkish Army."
 TRX_buy_american_supplies:0 "Buy American Supplies"
 TRX_buy_american_supplies_desc:0 "American factories produce field telephones, radios and engineering equipment in abundance."

 ### Formables ###
 TRX_form_misak_i_milli:0 "Proclaim Greater Turkey"
 TRX_form_misak_i_milli_desc:0 "Hatay, Mosul, Western Thrace and the Aegean Islands are home again. The borders of the National Pact are restored."
 TRX_form_ottoman_empire:0 "Restore the Ottoman Empire"
 TRX_form_ottoman_empire_desc:0 "From Mecca to the Taurus, the lands of the Sultan-Caliph are reunited. The Sublime State is reborn."
 TRX_form_kayser_i_rum:0 "Proclaim the Empire of Rûm"
 TRX_form_kayser_i_rum_desc:0 "Rome, Athens, Belgrade, Cairo and Jerusalem bow to the Padishah. He is Kayser-i Rûm, Caesar of Rome, in deed as well as in title."
 TRX_form_turan:0 "Proclaim Turan"
 TRX_form_turan_desc:0 "Baku, Kazan, Tashkent, Ashgabat and Alma-Ata fly the banner of the grey wolf. The age-old dream of Turan is real."
 TRX_form_balkan_federation:0 "Found the Balkan-Anatolian Federation"
 TRX_form_balkan_federation_desc:0 "Greeks, Bulgarians, Yugoslavs, Albanians and Turks will sit in one parliament. Partner nations in our alliance will join the federation peacefully."
 TRX_form_near_eastern_federation:0 "Found the Near Eastern Socialist Federation"
 TRX_form_near_eastern_federation_desc:0 "Iran, Iraq and the Levant are free of shahs and colonial governors. Their soviet republics will unite with ours."
 TRX_federation_greece_tt:0 "§YGreece§! is in our faction or our subject, or we control §YAttica§!."
 TRX_federation_bulgaria_tt:0 "§YBulgaria§! is in our faction or our subject, or we control §YSofia§!."
 TRX_federation_yugoslavia_tt:0 "§YYugoslavia§! is in our faction or our subject, or we control §YSerbia§!."
 TRX_federation_albania_tt:0 "§YAlbania§! is in our faction or our subject, or we control §YCentral Albania§!."
 TRX_federation_union_tt:0 "Every partner that is in our faction or our subject is §Gpeacefully annexed§!. Gain §Ycores§! on all Greek, Bulgarian, Yugoslav and Albanian territory."
 TRX_nesf_persia_tt:0 "A communist §YIran§! is in our faction or our subject, or we control §YTehran§!."
 TRX_nesf_iraq_tt:0 "A communist §YIraq§! is in our faction or our subject, or we control §YBaghdad§!."
 TRX_nesf_union_tt:0 "Communist partners in our faction or our subjects are §Gpeacefully annexed§!. Gain §Ycores§! on Iran, Iraq and the Levant."
 TRX_ottoman_cores_tt:0 "Gain §Ycores§! on the Levant, Iraq, Kuwait and the Hejaz, and §Yclaims§! on Egypt, Libya, Yemen, Cyprus, Crete, the Dodecanese and the Crimea."
 TRX_kayser_cores_tt:0 "Gain §Ycores§! on all Italian, Greek and Egyptian territory."
 TRX_turan_cores_tt:0 "Gain §Ycores§! on the Turkic lands of the Caucasus, the Volga, the Crimea, Central Asia and East Turkestan."

 ### Irredentism ###
 TRX_reclaim_rumelia_war:0 "Reclaim Rumelia from [FROM.GetNameDef]"
 TRX_reclaim_rumelia_war_desc:0 "The Balkan lands of the Sultan will return, by the sword if necessary."
 TRX_reclaim_arabia_war:0 "Reclaim the Arab Provinces from [FROM.GetNameDef]"
 TRX_reclaim_arabia_war_desc:0 "The Arab provinces were stolen by foreign intrigue. The Sultan-Caliph's armies will restore them."
 TRX_liberate_the_caucasus:0 "Liberate the Caucasus"
 TRX_liberate_the_caucasus_desc:0 "Azerbaijan, Armenia and Georgia stand between Turkey and the Turkic heartland."
 TRX_liberate_east_turkestan:0 "Liberate East Turkestan"
 TRX_liberate_east_turkestan_desc:0 "The Uyghurs of Sinkiang are our brothers. Their warlord masters will be swept aside."
 TRX_export_the_revolution:0 "Export the Revolution to [FROM.GetNameDef]"
 TRX_export_the_revolution_desc:0 "A workers' rising, backed by Turkish volunteers and Turkish guns, will topple the reactionary government."
