l_english:
 ### Categories ###
 TRX_development_category:0 "Kalkınma: the Development Drive"
 TRX_development_category_desc:0 "Five-year plans and megaprojects that will put Turkey among the industrial powers. Megaprojects keep some civilian factories busy until they are finished."
 TRX_bourse_category:0 "The Istanbul Bourse"
 TRX_bourse_category_desc:0 "Stake political power on the market. The odds are good, but nothing is certain. Only one bet can be open at a time, and each pays out when it expires."
 TRX_prospecting_category:0 "Mineral Research and Exploration"
 TRX_prospecting_category_desc:0 "The MTA's geologists know where the ore lies. All they need are men and machines."
 TRX_chromium_category:0 "Chromium Diplomacy"
 TRX_chromium_category_desc:0 "Turkish chromium is wanted by every arsenal in the world. Each deal ties up part of our mining output for 180 days and angers the other camp."
 TRX_exiles_category:0 "Haymatloz: Exiles in Anatolia"
 TRX_exiles_category_desc:0 "Civil war abroad has driven scholars, politicians and officers from their homes. Turkey can offer them refuge and put their talents to work."
 TRX_integration_category:0 "Integration of New Lands"
 TRX_integration_category_desc:0 "Lands that have accepted our rule can be made a lasting part of the state."
 TRX_straits_category:0 "The Straits"
 TRX_straits_category_desc:0 "Since Montreux the Bosphorus and the Dardanelles are ours again. Fortify them, tax the shipping that passes through, and close them to our enemies in time of war."
 TRX_eastern_development_category:0 "Developing the East"
 TRX_eastern_development_category_desc:0 "The eastern provinces are poor and mountainous. Roads and factories will bind them to the rest of the Republic."
 TRX_procurement_category:0 "Arms Procurement"
 TRX_procurement_category_desc:0 "Our own arsenals cannot yet supply the army. Foreign suppliers can, for a price."
 TRX_formables_category:0 "Destiny of the Nation"
 TRX_formables_category_desc:0 "The borders drawn at Lausanne are not the last word. Depending on the path the nation has chosen, a greater destiny awaits."
 TRX_irredentism_category:0 "Lost Lands"
 TRX_irredentism_category_desc:0 "The lands we claim will not return by themselves."

 ### Development Drive ###
 TRX_first_plan_mission:0 "The First Five-Year Plan"
 TRX_first_plan_mission_desc:0 "The plan's factory targets must be met before the deadline. Success brings prestige and momentum; failure, recriminations."
 TRX_second_plan_mission:0 "The Second Five-Year Plan"
 TRX_second_plan_mission_desc:0 "Heavier targets for heavy industry. Ankara is watching."
 TRX_megaproject_bosphorus_bridge:0 "Megaproject: the Bosphorus Bridge"
 TRX_megaproject_bosphorus_bridge_desc:0 "A suspension bridge between Europe and Asia will carry traffic, trade and pride across the Bosphorus."
 TRX_megaproject_kanal_istanbul:0 "Megaproject: Kanal İstanbul"
 TRX_megaproject_kanal_istanbul_desc:0 "A forty-kilometre canal between the Black Sea and the Sea of Marmara. The most ambitious project in the history of the Republic."
 TRX_megaproject_ataturk_dam:0 "Megaproject: the Atatürk Dam"
 TRX_megaproject_ataturk_dam_desc:0 "The heart of the Southeastern Anatolia Project: a giant dam on the Euphrates to irrigate Upper Mesopotamia and power its new industries."
 TRX_megaproject_research_reactor:0 "Megaproject: the Çekmece Research Reactor"
 TRX_megaproject_research_reactor_desc:0 "A nuclear research centre on the shores of Lake Küçükçekmece will give Turkish physicists their first reactor."
 TRX_build_synthetic_rubber_plant:0 "Build a Synthetic Rubber Plant"
 TRX_build_synthetic_rubber_plant_desc:0 "Turkey grows no rubber. The chemists of İzmit can make it."
 TRX_sell_surplus_arms:0 "Sell Surplus Rifles"
 TRX_sell_surplus_arms_desc:0 "Rifles gathering dust in our depots are worth more in the hands of foreign buyers."

 ### The Istanbul Bourse ###
 TRX_bourse_small_stake:0 "Bourse: a Small Stake"
 TRX_bourse_small_stake_desc:0 "A careful investment in railway and tobacco shares. The result is known in two weeks."
 TRX_bourse_bold_wager:0 "Bourse: a Bold Wager"
 TRX_bourse_bold_wager_desc:0 "A heavy position in mining and shipping stocks. The result is known in a month."
 TRX_bourse_all_in:0 "Bourse: All In"
 TRX_bourse_all_in_desc:0 "Everything on one great speculation, backed by our insiders. The result is known in six weeks. A loss would shake public confidence."
 TRX_milli_piyango_draw:0 "The New Year's Lottery Draw"
 TRX_milli_piyango_draw_desc:0 "The National Lottery's great New Year's draw. The state always takes its share."
 TRX_bourse_small_odds_tt:0 "In §Y14 days§! the bet pays out: §G45%§! chance of §G60§! political power, §Y35%§! chance of §Y35§!, §R20%§! chance of nothing. The §YInsider Network§! improves the odds."
 TRX_bourse_bold_odds_tt:0 "In §Y30 days§! the bet pays out: §G40%§! chance of §G200§! political power, §Y35%§! chance of §Y100§!, §R25%§! chance of nothing."
 TRX_bourse_all_in_odds_tt:0 "In §Y45 days§! the bet pays out: §G25%§! chance of §G500§! political power, §G30%§! chance of §G250§!, §Y20%§! chance of §Y120§!, §R25%§! chance of nothing and §R-5% stability§!."
 TRX_lottery_odds_tt:0 "The draw pays out at once: §G10%§! chance of §G400§! political power, §Y40%§! chance of §Y80§!, otherwise §Y20§!."

 ### Mineral Research and Exploration ###
 TRX_prospect_seydisehir_bauxite:0 "Open the Seydişehir Bauxite Mines"
 TRX_prospect_seydisehir_bauxite_desc:0 "The Taurus mountains near Konya hold large bauxite deposits, the ore of aluminium."
 TRX_prospect_uludag_tungsten:0 "Mine Uludağ Tungsten"
 TRX_prospect_uludag_tungsten_desc:0 "High on Mount Uludağ above Bursa lies one of the richest tungsten deposits in Europe."
 TRX_prospect_fethiye_chromite:0 "Develop the Fethiye Chromite"
 TRX_prospect_fethiye_chromite_desc:0 "The chromite mines near Fethiye can be expanded and connected to the coast."
 TRX_expand_zonguldak_collieries:0 "Expand the Zonguldak Collieries"
 TRX_expand_zonguldak_collieries_desc:0 "More shafts and better pumps will raise the coal output that feeds our steel mills."
 TRX_wildcat_drilling:0 "Wildcat Drilling in [FROM.GetName]"
 TRX_wildcat_drilling_desc:0 "TPAO's crews will drill an exploratory well in [FROM.GetName]. It could be a gusher, a modest well or a dry hole: §G40%§! chance of a major find, §Y30%§! of a small one, §R30%§! of nothing."

 ### Chromium Diplomacy ###
 TRX_chromium_deal_germany:0 "Chromium for German Arms"
 TRX_chromium_deal_germany_desc:0 "Berlin will pay for chromium with rifles and guns. London will not be pleased."
 TRX_chromium_deal_allies:0 "Pre-emptive Purchase by the Allies"
 TRX_chromium_deal_allies_desc:0 "Britain will buy our chromium just to keep it out of German hands, and pay handsomely in money and machinery."
 TRX_chromium_deal_soviets:0 "Chromium for Soviet Equipment"
 TRX_chromium_deal_soviets_desc:0 "Moscow will exchange lorries and artillery for Turkish ore."

 ### Exiles ###
 TRX_invite_german_economists:0 "Invite German Economists"
 TRX_invite_german_economists_desc:0 "Fritz Neumark and Wilhelm Röpke have fled the fighting in Germany. Istanbul University would welcome them, and so would the Ministry of Finance."
 TRX_invite_ernst_reuter:0 "Invite Ernst Reuter"
 TRX_invite_ernst_reuter_desc:0 "The former mayor of Magdeburg is an expert in city planning and transport. Ankara is a capital still being built."
 TRX_invite_german_scientists:0 "Invite German Scientists"
 TRX_invite_german_scientists_desc:0 "The mathematician Richard von Mises and his colleagues need a safe haven. Our universities need their knowledge."
 TRX_invite_german_officers:0 "Shelter German Officers"
 TRX_invite_german_officers_desc:0 "Generals Kurt von Hammerstein-Equord and Friedrich von Rabenau have fled the civil war. Their experience would serve our army well."
 TRX_invite_caucasian_emigres:0 "Welcome the Caucasian Emigration"
 TRX_invite_caucasian_emigres_desc:0 "Mammad Amin Rasulzade, founder of the first Azerbaijani republic, sees a chance to free his homeland. He will advise us, and remind us of our claim to Baku."
 TRX_invite_idel_ural_exiles:0 "Welcome the Idel-Ural Exiles"
 TRX_invite_idel_ural_exiles_desc:0 "Ayaz İshaki and the Tatar exiles of the Volga have long looked to Turkey for help."
 TRX_invite_kremlin_defector:0 "Debrief a Kremlin Defector"
 TRX_invite_kremlin_defector_desc:0 "Boris Bazhanov, once Stalin's personal secretary, knows how the Soviet state really works."
 TRX_invite_white_generals:0 "Recruit the White Generals"
 TRX_invite_white_generals_desc:0 "With the Soviet Union at war with itself, veterans of the White armies, among them Anton Denikin and the Circassian cavalryman Sultan Klych-Girey, offer their swords to Ankara."

 ### Integration ###
 TRX_integrate_state:0 "Integrate [FROM.GetName]"
 TRX_integrate_state_desc:0 "[FROM.GetName] has accepted our rule. Schools, officials and investment will make it a core part of the state.\n\nAvailable for owned states that we §Yclaim§! or that are at least §Y20%§! compliant."

 ### Straits ###
 TRX_levy_straits_transit_fees:0 "Levy Straits Transit Fees"
 TRX_levy_straits_transit_fees_desc:0 "Every merchant ship passing the Bosphorus pays for the lighthouses, pilots and sanitary inspections. The proceeds fund the state."
 TRX_fortify_the_bosphorus:0 "Fortify the Bosphorus"
 TRX_fortify_the_bosphorus_desc:0 "Batteries on both shores of Istanbul will make the city an impregnable fortress."
 TRX_fortify_the_dardanelles:0 "Fortify the Dardanelles"
 TRX_fortify_the_dardanelles_desc:0 "The forts of Çanakkale threw back the Allied fleet in 1915. Rebuilt with modern guns, they will do so again."
 TRX_close_the_straits:0 "Close the Straits"
 TRX_close_the_straits_desc:0 "The Montreux Convention lets Turkey close the Straits to warships when it is at war. Mines, booms and batteries will seal them."

 ### The East ###
 TRX_develop_eastern_province:0 "Develop [FROM.GetName]"
 TRX_develop_eastern_province_desc:0 "Roads, a power station and a state factory will bring [FROM.GetName] into the modern economy."

 ### Procurement ###
 TRX_buy_german_rifles:0 "Buy German Rifles"
 TRX_buy_german_rifles_desc:0 "Mauser rifles from Germany, paid for with chromium and tobacco."
 TRX_buy_soviet_artillery:0 "Buy Soviet Artillery"
 TRX_buy_soviet_artillery_desc:0 "The friendship treaty of 1925 still opens Soviet arsenals to Turkish buyers."
 TRX_buy_british_trucks:0 "Buy British Trucks"
 TRX_buy_british_trucks_desc:0 "British credit can motorise the Turkish Army."
 TRX_buy_american_supplies:0 "Buy American Supplies"
 TRX_buy_american_supplies_desc:0 "American factories produce field telephones, radios and engineering equipment in abundance."

 ### Formables ###
 TRX_form_misak_i_milli:0 "Proclaim Greater Turkey"
 TRX_form_misak_i_milli_desc:0 "Hatay, Mosul, Western Thrace and the Aegean Islands are home again. The borders of the National Pact are restored."
 TRX_form_ottoman_empire:0 "Restore the Ottoman Empire"
 TRX_form_ottoman_empire_desc:0 "From Mecca to the Taurus, the lands of the Sultan-Caliph are reunited. The Sublime State is reborn."
 TRX_form_kayser_i_rum:0 "Proclaim the Empire of Rûm"
 TRX_form_kayser_i_rum_desc:0 "Rome, Athens, Belgrade, Cairo and Jerusalem bow to the Padishah. He is Kayser-i Rûm, Caesar of Rome, in deed as well as in title."
 TRX_form_turan:0 "Proclaim Turan"
 TRX_form_turan_desc:0 "Baku, Kazan, Tashkent, Ashgabat and Alma-Ata fly the banner of the grey wolf. The age-old dream of Turan is real."
 TRX_form_balkan_federation:0 "Found the Balkan-Anatolian Federation"
 TRX_form_balkan_federation_desc:0 "Greeks, Bulgarians, Yugoslavs, Albanians and Turks will sit in one parliament. Partner nations in our alliance will join the federation peacefully."
 TRX_form_near_eastern_federation:0 "Found the Near Eastern Socialist Federation"
 TRX_form_near_eastern_federation_desc:0 "Iran, Iraq and the Levant are free of shahs and colonial governors. Their soviet republics will unite with ours."
 TRX_federation_greece_tt:0 "§YGreece§! is in our faction or our subject, or we control §YAttica§!."
 TRX_federation_bulgaria_tt:0 "§YBulgaria§! is in our faction or our subject, or we control §YSofia§!."
 TRX_federation_yugoslavia_tt:0 "§YYugoslavia§! is in our faction or our subject, or we control §YSerbia§!."
 TRX_federation_albania_tt:0 "§YAlbania§! is in our faction or our subject, or we control §YCentral Albania§!."
 TRX_federation_union_tt:0 "Every partner that is in our faction or our subject is §Gpeacefully annexed§!. Gain §Ycores§! on all Greek, Bulgarian, Yugoslav and Albanian territory."
 TRX_nesf_persia_tt:0 "A communist §YIran§! is in our faction or our subject, or we control §YTehran§!."
 TRX_nesf_iraq_tt:0 "A communist §YIraq§! is in our faction or our subject, or we control §YBaghdad§!."
 TRX_nesf_union_tt:0 "Communist partners in our faction or our subjects are §Gpeacefully annexed§!. Gain §Ycores§! on Iran, Iraq and the Levant."
 TRX_ottoman_cores_tt:0 "Gain §Ycores§! on the Levant, Iraq, Kuwait and the Hejaz, and §Yclaims§! on Egypt, Libya, Yemen, Cyprus, Crete, the Dodecanese and the Crimea."
 TRX_kayser_cores_tt:0 "Gain §Ycores§! on all Italian, Greek and Egyptian territory."
 TRX_turan_cores_tt:0 "Gain §Ycores§! on the Turkic lands of the Caucasus, the Volga, the Crimea, Central Asia and East Turkestan."

 ### Irredentism ###
 TRX_reclaim_rumelia_war:0 "Reclaim Rumelia from [FROM.GetNameDef]"
 TRX_reclaim_rumelia_war_desc:0 "The Balkan lands of the Sultan will return, by the sword if necessary."
 TRX_reclaim_arabia_war:0 "Reclaim the Arab Provinces from [FROM.GetNameDef]"
 TRX_reclaim_arabia_war_desc:0 "The Arab provinces were stolen by foreign intrigue. The Sultan-Caliph's armies will restore them."
 TRX_liberate_the_caucasus:0 "Liberate the Caucasus"
 TRX_liberate_the_caucasus_desc:0 "Azerbaijan, Armenia and Georgia stand between Turkey and the Turkic heartland."
 TRX_liberate_east_turkestan:0 "Liberate East Turkestan"
 TRX_liberate_east_turkestan_desc:0 "The Uyghurs of Sinkiang are our brothers. Their warlord masters will be swept aside."
 TRX_export_the_revolution:0 "Export the Revolution to [FROM.GetNameDef]"
 TRX_export_the_revolution_desc:0 "A workers' rising, backed by Turkish volunteers and Turkish guns, will topple the reactionary government."
