 ### Foreign policy ###
 TRX_peace_at_home:0 "Peace at Home, Peace in the World"
 TRX_peace_at_home_desc:0 "§Y“Yurtta sulh, cihanda sulh.”§! The Republic was born from a decade of war. Its first duty is to keep the peace it bled for, and to make sure no one mistakes that peace for weakness."
 TRX_montreux_convention:0 "The Montreux Convention"
 TRX_montreux_convention_desc:0 "The Lausanne settlement left the Straits demilitarised and under international control. In the Swiss town of Montreux we will ask the powers to return the keys of the Bosphorus and the Dardanelles to their rightful owner."
 TRX_seat_among_the_powers:0 "A Seat Among the Powers"
 TRX_seat_among_the_powers_desc:0 "Montreux proved that Ankara can negotiate as an equal. London, Paris, Berlin and Moscow are all courting Turkey. It is time to decide what we want from them."
 TRX_seat_among_the_powers_tt:0 "Unlocks a choice between the §YTripartite Treaty§! with Britain and France and §YFriendship with Germany§!, followed by joining a bloc or staying out in §YActive Neutrality§!."
 TRX_tripartite_treaty:0 "The Tripartite Treaty"
 TRX_tripartite_treaty_desc:0 "In October 1939 Turkey signed a treaty of mutual assistance with Britain and France. British credits and French guns came with it."
 TRX_german_turkish_friendship:0 "German-Turkish Friendship"
 TRX_german_turkish_friendship_desc:0 "Germany is Turkey's largest trading partner and an old comrade in arms. A treaty of friendship will keep its engineers and its credit flowing."
 TRX_join_the_allies:0 "Join the Allies"
 TRX_join_the_allies_desc:0 "Neutrality has served us well, but the democracies need us and we need their protection. Turkey will ask to join their alliance."
 TRX_active_neutrality:0 "Active Neutrality"
 TRX_active_neutrality_desc:0 "İsmet İnönü's policy: talk to everyone, promise little, keep the army strong and keep the country out of the war."
 TRX_join_the_axis:0 "Join the Axis"
 TRX_join_the_axis_desc:0 "The future belongs to the new powers of Europe. Turkey will take its seat among them and claim its share."
 TRX_allied_arms_shipments:0 "Allied Arms Shipments"
 TRX_allied_arms_shipments_desc:0 "British and American convoys bring rifles, guns and lorries to Mersin and İskenderun."
 TRX_city_of_spies:0 "Istanbul, City of Spies"
 TRX_city_of_spies_desc:0 "Neutral Istanbul is full of agents of every power. Our own service, the MAH, will learn from all of them."
 TRX_clodius_agreement:0 "The Clodius Agreement"
 TRX_clodius_agreement_desc:0 "German weapons for Turkish chromium. Ambassador Clodius drives a hard bargain, but the Wehrmacht's arsenals are open to us."
 TRX_saadabad_pact:0 "The Saadabad Pact"
 TRX_saadabad_pact_desc:0 "Iran, Iraq and Afghanistan share our borders, our worries and our distrust of distant empires. A treaty of non-aggression signed in the Saadabad Palace will secure our eastern flank."
 TRX_balkan_entente:0 "Renew the Balkan Entente"
 TRX_balkan_entente_desc:0 "The Balkan Pact of 1934 bound Ankara, Athens, Belgrade and Bucharest to respect each other's borders. In a darkening Europe the pact must be more than paper."
 TRX_eastern_alliance:0 "The Saadabad Accord"
 TRX_eastern_alliance_desc:0 "A treaty of non-aggression is a beginning. An alliance with Ankara at its head would make the Middle East a bloc the great powers cannot carve up."
 TRX_balkan_alliance:0 "The Balkan Pact Alliance"
 TRX_balkan_alliance_desc:0 "If the Balkan states stand together they will not be devoured one by one. Turkey offers to lead a true military alliance from the Danube to the Taurus."
 TRX_expand_the_pact:0 "The Ankara Pact"
 TRX_expand_the_pact_desc:0 "Our alliance has proven itself. From the Danube to the Gulf, every neighbour that wants security will be welcome in it."
 TRX_joint_defense_council:0 "The Joint Defence Council"
 TRX_joint_defense_council_desc:0 "Staff talks, shared war plans and common exercises will turn a paper alliance into a fighting one."
 TRX_joint_defense_council_tt:0 "Every member of our faction gains §Ga better opinion§! of us."
 TRX_guarantor_of_the_region:0 "Guarantor of the Near East"
 TRX_guarantor_of_the_region_desc:0 "An attack on any member of our pact is an attack on Ankara."
 TRX_guarantor_of_the_region_tt:0 "We §Yguarantee the independence§! of every member of our faction."
 TRX_hatay_question:0 "The Hatay Question"
 TRX_hatay_question_desc:0 "The Sanjak of Alexandretta, which our people call Hatay, was left outside our borders. Its Turks look north to Ankara. We will demand its return, peacefully if possible."
 TRX_mosul_question:0 "Revisit the Mosul Question"
 TRX_mosul_question_desc:0 "The National Pact of 1920 claimed the vilayet of Mosul and its oil. The League of Nations gave it away in 1926. The question was closed by others, and it can be reopened by us."
 TRX_aegean_ambitions:0 "Aegean Ambitions"
 TRX_aegean_ambitions_desc:0 "Islands within sight of the Anatolian coast are held by foreign navies. No nation can feel safe with its harbours watched from a stone's throw away."
 TRX_national_pact:0 "Restore the Misak-ı Millî"
 TRX_national_pact_desc:0 "The last Ottoman parliament swore the National Pact: the lands where Turks were the majority would never be surrendered. It is time to finish what the War of Independence began."
 TRX_batum_question:0 "The Batum Question"
 TRX_batum_question_desc:0 "Batum was named in the National Pact and lost by the treaties of 1921. The port and its hinterland remain a wound on our north-eastern frontier."
 TRX_western_thrace:0 "Western Thrace"
 TRX_western_thrace_desc:0 "Tens of thousands of Turks live beyond the Maritsa in Western Thrace. Their protection is our duty, and their land is part of the National Pact."
 TRX_cyprus_question:0 "The Cyprus Question"
 TRX_cyprus_question_desc:0 "Cyprus was leased to Britain in 1878 and annexed outright in 1914. Its Turkish community has never forgotten Istanbul, and neither have we."

 ### Army ###
 TRX_reform_the_army:0 "Reform the Turkish Army"
 TRX_reform_the_army_desc:0 "Marshal Fevzi Çakmak has led the General Staff since the War of Independence. Our soldiers are brave but their rifles are old and their doctrine older. The army must be rebuilt from the ground up."
 TRX_mehmetcik_spirit:0 "The Spirit of Mehmetçik"
 TRX_mehmetcik_spirit_desc:0 "Mehmetçik, the common Turkish soldier, held Gallipoli and won at Sakarya. Give him modern weapons and a reason to fight, and no army on earth will dislodge him."
 TRX_kirikkale_arsenal:0 "Expand the Kırıkkale Arsenal"
 TRX_kirikkale_arsenal_desc:0 "The arms works at Kırıkkale, safely inland from Ankara, can become the beating heart of a national arms industry."
 TRX_janissary_guard:0 "Revive the Janissary Guard"
 TRX_janissary_guard_desc:0 "The old Janissaries were the terror of Europe. A new elite guard, hand-picked and lavishly trained, will carry their name with republican discipline.\n\n§GUnlocks the Janissary Guard battalion.§!"
 TRX_reserve_officer_corps:0 "The Reserve Officer Corps"
 TRX_reserve_officer_corps_desc:0 "Every university graduate will serve as a reserve officer. In war, the army will never run short of leaders."
 TRX_harbiye_academy:0 "Modernise the Harbiye Academy"
 TRX_harbiye_academy_desc:0 "The War Academy produced the officers who saved the nation in 1919. Its curriculum must now teach the war of engines and radios."
 TRX_straits_fortress_artillery:0 "Straits Fortress Artillery"
 TRX_straits_fortress_artillery_desc:0 "The guns that broke the Allied fleet in 1915 still guard the Dardanelles. Their crews will form the core of a heavy fortress artillery arm.\n\n§GUnlocks the Straits Fortress Artillery support company.§!"
 TRX_motorize_the_army:0 "Motorise the Army"
 TRX_motorize_the_army_desc:0 "Ox carts and camels still haul the army's supplies. Lorries will replace them."
 TRX_mountain_commandos:0 "Mountain Commandos of Anatolia"
 TRX_mountain_commandos_desc:0 "Most of Anatolia is mountain. Troops raised in the Taurus and the eastern highlands will fight where no enemy column can follow.\n\n§GUnlocks the Mountain Commando battalion.§!"
 TRX_gendarmerie_reform:0 "Reform the Gendarmerie"
 TRX_gendarmerie_reform_desc:0 "A professional rural police will keep order in the provinces and in any land our armies occupy."
 TRX_akinci_raiders:0 "The Akıncı Raiders"
 TRX_akinci_raiders_desc:0 "The akıncı light horsemen once rode ahead of the Ottoman armies, striking deep and vanishing. On the open plains of Thrace and the east, their heirs can still ride.\n\n§GUnlocks the Akıncı Cavalry battalion.§!"
 TRX_eastern_frontier_forts:0 "Fortify the Eastern Frontier"
 TRX_eastern_frontier_forts_desc:0 "Kars and Erzurum guard the old invasion route from the Caucasus. Their fortress belts must be modernised."
 TRX_first_armored_brigade:0 "Turkey's First Armoured Brigade"
 TRX_first_armored_brigade_desc:0 "A handful of foreign tanks are not an armoured force. We need our own designs, our own crews and our own doctrine."
 TRX_defense_of_anatolia:0 "The Defence of Anatolia"
 TRX_defense_of_anatolia_desc:0 "Anatolia is a fortress built by God. Our doctrine will make every ridge a trench line and every river a moat."
 TRX_akinci_doctrine:0 "Lightning of the Akıncı"
 TRX_akinci_doctrine_desc:0 "Defence alone has never won a war. Fast columns, deep raids and bold commanders will carry the fight to the enemy."
 TRX_armored_corps:0 "The Armoured Corps"
 TRX_armored_corps_desc:0 "One brigade has become a corps. Turkish tanks and motorised infantry will fight together."
 TRX_general_mobilization:0 "General Mobilisation"
 TRX_general_mobilization_desc:0 "When the storm breaks, every Turk must be ready to stand in the line."
 TRX_army_of_the_republic:0 "The Army of the Republic"
 TRX_army_of_the_republic_desc:0 "Reformed, re-equipped and retrained, the Turkish Army is once again an instrument worthy of the nation."

 ### Air force ###
 TRX_aeronautical_association:0 "The Turkish Aeronautical Association"
 TRX_aeronautical_association_desc:0 "The Türk Hava Kurumu funds gliders, flight schools and aircraft by public subscription. Every village that buys a plane buys a share in the nation's future."
 TRX_nuri_demirag_works:0 "Nuri Demirağ's Aircraft Works"
 TRX_nuri_demirag_works_desc:0 "Industrialist Nuri Demirağ has built an aircraft factory and an airfield in Istanbul with his own money. With state contracts he could build our air force."
 TRX_kayseri_aircraft_factory:0 "The Kayseri Aircraft Factory"
 TRX_kayseri_aircraft_factory_desc:0 "Deep in central Anatolia, the Kayseri works are beyond the reach of any enemy bomber. They will assemble and maintain our frontline aircraft."
 TRX_hurkus_designs:0 "Vecihi Hürkuş's Designs"
 TRX_hurkus_designs_desc:0 "Vecihi Hürkuş built Turkey's first aircraft in 1925 out of wreckage. Give him a design office and he will give us fighters."
 TRX_sabiha_gokcen_academy:0 "The Sabiha Gökçen Flight Academy"
 TRX_sabiha_gokcen_academy_desc:0 "Sabiha Gökçen, adopted daughter of Atatürk, is the world's first female combat pilot. Her example will draw a generation of young Turks into the sky."
 TRX_air_defense_network:0 "The Air Defence Network"
 TRX_air_defense_network_desc:0 "Anti-aircraft guns and radar around Istanbul, Ankara and İzmir will make our cities expensive targets."
 TRX_fighter_command:0 "Fighter Command"
 TRX_fighter_command_desc:0 "Air superiority over Anatolia is the first requirement of its defence."
 TRX_bomber_command:0 "Bomber Command"
 TRX_bomber_command_desc:0 "Ground attack and tactical bombers will give our infantry the support that artillery cannot always provide in the mountains."
 TRX_modern_air_force:0 "A Modern Air Force"
 TRX_modern_air_force_desc:0 "From a handful of biplanes to a modern air arm: the Turkish Air Force is ready."

 ### Navy ###
 TRX_golcuk_shipyards:0 "Expand the Gölcük Shipyards"
 TRX_golcuk_shipyards_desc:0 "The naval yard at Gölcük in the Gulf of İzmit is the only one capable of servicing our capital ships. It must grow into a true shipbuilding centre."
 TRX_refit_the_yavuz:0 "Refit the Yavuz"
 TRX_refit_the_yavuz_desc:0 "The battlecruiser Yavuz Sultan Selim, once the German Goeben, is still the most powerful ship in the Black Sea. A thorough refit will keep her so."
 TRX_destroyer_program:0 "The Destroyer Programme"
 TRX_destroyer_program_desc:0 "The Kocatepe and Tınaztepe class destroyers are the backbone of the fleet. From now on they will be built at home."
 TRX_black_sea_submarines:0 "A Black Sea Submarine Fleet"
 TRX_black_sea_submarines_desc:0 "Submarines are the weapon of a nation that guards narrow waters. A modern flotilla will make any invasion fleet think twice."
 TRX_aegean_naval_bases:0 "Aegean Naval Bases"
 TRX_aegean_naval_bases_desc:0 "İzmir and Antalya will become proper bases for a Mediterranean squadron."
 TRX_coastal_fortifications:0 "Coastal Fortifications"
 TRX_coastal_fortifications_desc:0 "İzmir, Trabzon and Mersin are open doors to Anatolia. Coastal batteries will shut them."
 TRX_black_sea_fleet:0 "A Black Sea Squadron"
 TRX_black_sea_fleet_desc:0 "Trabzon and Samsun will base a squadron to watch over the Black Sea."
 TRX_masters_of_the_straits:0 "Masters of the Straits"
 TRX_masters_of_the_straits_desc:0 "With guns on both shores and a fleet in the Sea of Marmara, no ship passes between the Black Sea and the Mediterranean without Ankara's permission."

 ### Politics: root ###
 TRX_republic_at_the_crossroads:0 "The Republic at the Crossroads"
 TRX_republic_at_the_crossroads_desc:0 "Thirteen years after its founding, the Turkish Republic faces a world sliding towards war. The single-party state built by Atatürk has achieved wonders, but its future is anything but certain."
 TRX_debate_the_future:0 "Debate the Future of the Nation"
 TRX_debate_the_future_desc:0 "In the coffee houses of Istanbul and the halls of the Grand National Assembly, old Kemalists, liberals, monarchists, pan-Turkists and socialists argue over what the Republic should become."
 TRX_debate_the_future_tt:0 "§YUnlocks five political paths§!: the §YRed Crescent§!, the §YKemalist Republic§!, the §YDemocratic Opening§!, the §YOttoman Restoration§! and §YTuranism§!. Only one can be chosen, but they are linked: §YKadro§! leads into socialism, §YLiberal Kemalism§! into democracy, and the §YTurkish-Islamic Synthesis§! is open to Ottomanists and Turanists alike."

 ### Politics: the Red Crescent ###
 TRX_legalize_the_tkp:0 "Legalise the Communist Party"
 TRX_legalize_the_tkp_desc:0 "The Communist Party of Turkey has been underground since the murder of its founders in 1921. Its leaders, Şefik Hüsnü and the poet Nazım Hikmet, ask only to be heard."
 TRX_tobacco_workers_strike:0 "The Tobacco Workers' Strike"
 TRX_tobacco_workers_strike_desc:0 "The tobacco warehouses of İzmir and Istanbul employ thousands of poorly paid workers, most of them women. Their strike is the party's first great test."
 TRX_cells_in_the_army:0 "Cells in the Army and Navy"
 TRX_cells_in_the_army_desc:0 "In 1938 Nazım Hikmet was sentenced for “inciting the army and navy to revolt” because cadets read his poems. This time the poems will be read openly."
 TRX_popular_front:0 "The Popular Front"
 TRX_popular_front_desc:0 "Communists, socialists and left-wing Kemalists will stand together against fascism and reaction."
 TRX_land_committees:0 "Peasant Land Committees"
 TRX_land_committees_desc:0 "In every village a committee will decide who works the land of the absent aghas."
 TRX_village_soviets:0 "Village Soviets"
 TRX_village_soviets_desc:0 "Elected councils of peasants and workers will run the villages, the cooperatives and the new factories. Even the old Kadro men now argue for them."
 TRX_red_crescent_revolution:0 "The Red Crescent Revolution"
 TRX_red_crescent_revolution_desc:0 "The single-party Republic gives way to a workers' state. The crescent remains, now on a field of revolution."
 TRX_join_the_comintern:0 "Join the Comintern"
 TRX_join_the_comintern_desc:0 "The revolution cannot survive alone. Turkey will ask Moscow to take it into the alliance of the Communist International."
 TRX_join_the_comintern_tt:0 "The §YSoviet Union§! will be asked to take Turkey into its alliance. If Moscow does not lead a faction yet, it will found the §YComintern§! with us."
 TRX_collectivize_agriculture:0 "Collectivise Agriculture"
 TRX_collectivize_agriculture_desc:0 "Cooperatives and state farms will feed the cities and free hands for the factories."
 TRX_turkish_path_to_socialism:0 "The Turkish Path to Socialism"
 TRX_turkish_path_to_socialism_desc:0 "We are not a Soviet province. Turkish socialism will be built by Turks, in Turkish, on Turkish soil."
 TRX_soviet_military_aid:0 "Soviet Military Aid"
 TRX_soviet_military_aid_desc:0 "Soviet instructors, rifles and guns arrive through Batum and the Black Sea ports."
 TRX_red_crescent_international:0 "The Red Crescent International"
 TRX_red_crescent_international_desc:0 "Turkey will lead its own alliance of socialist states in the Near East, independent of Moscow."
 TRX_invite_red_crescent_tt:0 "Communist governments in the Balkans and the Near East will be invited to join our alliance."
 TRX_spread_the_revolution:0 "Spread the Revolution"
 TRX_spread_the_revolution_desc:0 "The peasants of Iran, the oil workers of Iraq and the dockers of Beirut are waiting for a signal."
 TRX_brotherhood_of_peoples:0 "Brotherhood of Peoples"
 TRX_brotherhood_of_peoples_desc:0 "Turks, Kurds, Arabs, Greeks and Armenians: under socialism every people is a full citizen of the union."
 TRX_near_eastern_federation:0 "The Near Eastern Federation"
 TRX_near_eastern_federation_desc:0 "A federation of soviet republics from the Aegean to the Persian Gulf, free of sultans, shahs and colonial governors."

 ### Politics: Kemalism ###
 TRX_kemalist_consolidation:0 "Kemalist Consolidation"
 TRX_kemalist_consolidation_desc:0 "The six principles of Kemalism, the Six Arrows, are written into the constitution. Now they must be written into the life of every citizen."
 TRX_arrow_republicanism:0 "Republicanism"
 TRX_arrow_republicanism_desc:0 "Cumhuriyetçilik: sovereignty belongs unconditionally to the nation. There will be no sultans and no caliphs in Ankara."
 TRX_arrow_revolutionism:0 "Revolutionism"
 TRX_arrow_revolutionism_desc:0 "İnkılapçılık: the reforms are not finished. The Republic must keep modernising or wither."
 TRX_arrow_laicism:0 "Laicism"
 TRX_arrow_laicism_desc:0 "Laiklik: religion belongs to the conscience of the citizen, and law belongs to the Republic."
 TRX_arrow_statism:0 "Statism"
 TRX_arrow_statism_desc:0 "Devletçilik: where private capital is too weak to build factories, the state will build them."
 TRX_arrow_nationalism:0 "Nationalism"
 TRX_arrow_nationalism_desc:0 "Milliyetçilik: a modern nation bound by citizenship, language and a shared future rather than by dynasty or religion."
 TRX_arrow_populism:0 "Populism"
 TRX_arrow_populism_desc:0 "Halkçılık: the state serves the people as a whole, not a class or a privileged few."
 TRX_kadro_movement:0 "The Kadro Movement"
 TRX_kadro_movement_desc:0 "The journal Kadro, edited by the former communists Şevket Süreyya Aydemir and Vedat Nedim Tör, preached a planned, anti-imperialist economy. Some of its readers want to go much further.\n\n§YOpens the road to the Village Soviets of the socialist path.§!"
 TRX_milli_sef:0 "The National Chief"
 TRX_milli_sef_desc:0 "İsmet İnönü, the victor of İnönü and the negotiator of Lausanne, will lead the Republic as Milli Şef, the National Chief."
 TRX_liberal_kemalism:0 "Liberal Kemalism"
 TRX_liberal_kemalism_desc:0 "The reforms are secure and the single party has done its job. A Kemalist republic can survive an opposition, and it should.\n\n§YOpens the road to Free Elections on the democratic path.§!"
 TRX_the_eternal_chief:0 "Ebedi Şef"
 TRX_the_eternal_chief_desc:0 "The Eternal Chief. The Six Arrows now fly as one, and the Kemalist state stands complete."
 TRX_armed_neutrality:0 "Armed Neutrality"
 TRX_armed_neutrality_desc:0 "Turkey will not be dragged into the wars of others. But anyone who mistakes neutrality for weakness will find every pass in Anatolia defended."
 TRX_military_guardianship:0 "The Army as Guardian"
 TRX_military_guardianship_desc:0 "The officer corps swears to defend the Republic and its principles against every enemy, foreign or domestic."
 TRX_citizenship_law:0 "One Citizenship"
 TRX_citizenship_law_desc:0 "§Y“Ne mutlu Türküm diyene.”§! Every citizen of the Republic is a Turk before the law, whatever their origin."
 TRX_leader_of_the_near_east:0 "Leader of the Near East"
 TRX_leader_of_the_near_east_desc:0 "A strong, modern and secular Turkey is the natural leader of the region. It is time the National Pact borders were restored."

 ### Politics: the Democratic Opening ###
 TRX_multi_party_experiment:0 "The Multi-Party Experiment"
 TRX_multi_party_experiment_desc:0 "Atatürk tried twice to allow a loyal opposition. Both times the experiment was cut short. Perhaps the Republic is finally mature enough for real competition."
 TRX_revive_the_free_party:0 "Revive the Free Republican Party"
 TRX_revive_the_free_party_desc:0 "The Free Republican Party of 1930 drew crowds that frightened the government. Its founder, Fethi Okyar, is ready to try again."
 TRX_repeal_the_maintenance_law:0 "Repeal the Maintenance of Order Law"
 TRX_repeal_the_maintenance_law_desc:0 "The Takrir-i Sükûn law of 1925 let the government close any newspaper or party it disliked. It is time it went."
 TRX_memorandum_of_the_four:0 "The Memorandum of the Four"
 TRX_memorandum_of_the_four_desc:0 "Celal Bayar, Adnan Menderes, Fuad Köprülü and Refik Koraltan demand that the party and the press be set free. Their memorandum is the birth certificate of a new party."
 TRX_secret_ballot:0 "Secret Ballot, Open Count"
 TRX_secret_ballot_desc:0 "Voting in secret and counting in public: the only election law the opposition will trust."
 TRX_free_elections:0 "Free Elections"
 TRX_free_elections_desc:0 "“Yeter! Söz milletindir!” Enough, the word belongs to the nation. For the first time, Turks will choose their government from more than one list."
 TRX_democrat_party:0 "The Democrat Party"
 TRX_democrat_party_desc:0 "A broad party of farmers, merchants and liberals, led by Bayar and the young landowner Adnan Menderes, now governs in Ankara. Its goal: a “little America” on the Bosphorus."
 TRX_freedom_of_the_press:0 "Freedom of the Press"
 TRX_freedom_of_the_press_desc:0 "Newspapers closed by decree will reopen. A free press is the guardian of a free republic."
 TRX_social_democracy:0 "Left of Centre"
 TRX_social_democracy_desc:0 "Ortanın Solu: a social-democratic Republic of trade unions, welfare and planning, without the excesses of either camp."
 TRX_marshall_aid:0 "American Aid"
 TRX_marshall_aid_desc:0 "Washington has decided that Turkey matters. Dollars, tractors and machinery are on their way."
 TRX_social_security_act:0 "The Social Insurance Act"
 TRX_social_security_act_desc:0 "Pensions, sick pay and insurance against accidents at work for every industrial worker."
 TRX_balkan_partnership:0 "The Balkan Partnership"
 TRX_balkan_partnership_desc:0 "Trade agreements, joint research and open borders will tie the democracies of south-eastern Europe together."
 TRX_federal_constitution:0 "A Federal Constitution"
 TRX_federal_constitution_desc:0 "A constitution of provinces with their own assemblies can hold together peoples who would never accept rule from Ankara alone."
 TRX_balkan_anatolian_federation:0 "The Balkan-Anatolian Federation"
 TRX_balkan_anatolian_federation_desc:0 "Venizelos and Atatürk once dreamed aloud of a Greek-Turkish federation. With our partners, that dream can become a constitution."

 ### Politics: the Ottoman Restoration ###
 TRX_invite_the_house_of_osman:0 "Invite the House of Osman"
 TRX_invite_the_house_of_osman_desc:0 "Abdülmecid II, the last Caliph, lives in exile in Paris and paints in his studio. Many in the provinces still pray for his return."
 TRX_restore_the_sultanate:0 "Restore the Sultanate"
 TRX_restore_the_sultanate_desc:0 "The Republic will become a sultanate under the House of Osman again. The old banners will fly once more over Topkapı."
 TRX_constitutional_sultanate:0 "A Constitutional Sultanate"
 TRX_constitutional_sultanate_desc:0 "The Sultan reigns and parliament legislates. The constitution of 1876 will be restored and modernised."
 TRX_restored_caliphate:0 "Restore the Caliphate"
 TRX_restored_caliphate_desc:0 "The Caliphate abolished in 1924 is restored. Abdülmecid II is once again the Commander of the Faithful."
 TRX_reopen_the_sublime_porte:0 "Reopen the Sublime Porte"
 TRX_reopen_the_sublime_porte_desc:0 "The Bâbıâli, the gate of the Grand Vizier's palace, gave its name to the Ottoman government itself. It will once again be the seat of the state."
 TRX_call_of_the_caliph:0 "The Call of the Caliph"
 TRX_call_of_the_caliph_desc:0 "From Bosnia to Java, Muslims answer the call of the restored Caliph. Volunteers flock to Istanbul."
 TRX_turkish_islamic_synthesis:0 "The Turkish-Islamic Synthesis"
 TRX_turkish_islamic_synthesis_desc:0 "Nationalists and believers have the same enemies. Turkishness and Islam, the argument goes, are two halves of a single identity.\n\n§YOpen to both the Ottoman and the Turanist paths.§!"
 TRX_a_new_janissary_corps:0 "A New Janissary Corps"
 TRX_a_new_janissary_corps_desc:0 "The Sultan needs a guard loyal to the throne alone. The Janissaries will march again.\n\n§GUnlocks the Janissary Guard battalion and improves it.§!"
 TRX_reclaim_rumelia:0 "Reclaim Rumelia"
 TRX_reclaim_rumelia_desc:0 "For five centuries the Balkans were Ottoman Rumelia. Its cities still carry the mosques, bridges and bazaars of the Sultans."
 TRX_reclaim_arabia:0 "Reclaim the Arab Provinces"
 TRX_reclaim_arabia_desc:0 "Damascus, Baghdad, Jerusalem and the Holy Cities were torn from the Empire by British and French intrigue. The Sultan-Caliph will reclaim them."
 TRX_padishah_of_three_continents:0 "Padishah of Three Continents"
 TRX_padishah_of_three_continents_desc:0 "Europe, Asia and Africa: the Ottoman Sultan once ruled on all three. He will do so again."
 TRX_millet_system:0 "Restore the Millet System"
 TRX_millet_system_desc:0 "Under the Ottomans every religious community ran its own affairs. Restored, the millets can reconcile the new provinces to the Sultan's rule."
 TRX_kayser_i_rum:0 "Kayser-i Rûm"
 TRX_kayser_i_rum_desc:0 "When Mehmed the Conqueror took Constantinople in 1453 he styled himself Caesar of Rome. His heirs have never renounced the title."

 ### Politics: Turanism ###
 TRX_turanist_awakening:0 "The Turanist Awakening"
 TRX_turanist_awakening_desc:0 "From the Balkans to the Altai live a hundred million Turks. Writers like Nihal Atsız preach that they are one nation, divided only by foreign empires."
 TRX_the_grey_wolves:0 "The Grey Wolves"
 TRX_the_grey_wolves_desc:0 "Bozkurt, the grey wolf that led the ancient Turks out of Ergenekon, is the symbol of a new youth movement that worships strength and unity."
 TRX_atsiz_takes_power:0 "Atsız Takes Power"
 TRX_atsiz_takes_power_desc:0 "The Turanists have the streets, the students and much of the officer corps. The old regime has nothing left to stop them."
 TRX_marshals_junta:0 "The Marshal's Junta"
 TRX_marshals_junta_desc:0 "The army will not hand the Republic to street gangs. Marshal Fevzi Çakmak takes power at the head of a military council, with the Turanists as junior partners."
 TRX_turkic_youth_movement:0 "The Turkic Youth Movement"
 TRX_turkic_youth_movement_desc:0 "Youth leagues, sports clubs and summer camps will raise a generation ready for Turan."
 TRX_officers_council:0 "The Officers' Council"
 TRX_officers_council_desc:0 "A council of generals will run the state the way it would run a campaign."
 TRX_pan_turkic_congress:0 "The Pan-Turkic Congress"
 TRX_pan_turkic_congress_desc:0 "Delegates from every Turkic people meet in Ankara to proclaim their common destiny."
 TRX_claims_on_the_caucasus:0 "Claims on the Caucasus"
 TRX_claims_on_the_caucasus_desc:0 "Azerbaijan is Turkish in blood and tongue. The road to Baku is the road to Turan."
 TRX_turkic_brothers_of_the_east:0 "Turkic Brothers of the East"
 TRX_turkic_brothers_of_the_east_desc:0 "Tatars, Bashkirs, Kazakhs, Uzbeks, Turkmens, Kyrgyz and Uyghurs all live under foreign rule. We will not forget them."
 TRX_road_to_turan:0 "The Road to Turan"
 TRX_road_to_turan_desc:0 "Turan is no longer a poet's dream but a plan of campaign."
 TRX_turkic_integration:0 "A Common Turkic Homeland"
 TRX_turkic_integration_desc:0 "A common alphabet, a common school system and a common citizenship for every Turkic land under Ankara."
 TRX_kizil_elma:0 "Kızıl Elma"
 TRX_kizil_elma_desc:0 "The Red Apple: the distant, ever-receding goal of Turkish conquest. Our armies march towards it once more."

 ### Economy ###
 TRX_izmir_economic_congress:0 "The İzmir Economic Congress"
 TRX_izmir_economic_congress_desc:0 "In 1923 merchants, farmers, workers and industrialists met in İzmir to draw up the economic charter of the new Turkey. Their call for a national economy is the starting point of the Development Drive.\n\n§GStarts the Development Drive (Kalkınma Hamlesi), a national spirit that grows with every economy focus.§!"
 TRX_central_bank:0 "The Central Bank of the Republic"
 TRX_central_bank_desc:0 "Founded in 1930, the Central Bank gives the Republic control of its own money for the first time."
 TRX_is_bankasi:0 "Türkiye İş Bankası"
 TRX_is_bankasi_desc:0 "The Business Bank, founded by Celal Bayar with Atatürk's backing, finances the first private Turkish industries."
 TRX_settle_the_ottoman_debt:0 "Settle the Ottoman Debt"
 TRX_settle_the_ottoman_debt_desc:0 "The Ottoman Public Debt Administration once controlled a third of the Empire's revenue. The last instalments will be paid and the debt council dissolved."
 TRX_istanbul_bourse:0 "Reopen the Istanbul Bourse"
 TRX_istanbul_bourse_desc:0 "The Istanbul exchange, first opened in 1866, will become the beating heart of Turkish finance, and of Turkish speculation.\n\n§GUnlocks the Istanbul Bourse: bet political power for a large expected return.§!"
 TRX_clearing_agreements:0 "Clearing Agreements"
 TRX_clearing_agreements_desc:0 "Trade by barter: chromium, tobacco and cotton exchanged directly for machinery, without spending scarce foreign currency."
 TRX_insider_network:0 "An Insider Network"
 TRX_insider_network_desc:0 "A word from the right minister at the right dinner can move a market. The state's brokers will always know a little more than everybody else."
 TRX_insider_network_tt:0 "Improves every §YIstanbul Bourse§! bet: winning outcomes become §G50% more likely§! and losses §G50% less likely§!. Unlocks the §YAll In§! bet."
 TRX_chromium_diplomacy:0 "Chromium Diplomacy"
 TRX_chromium_diplomacy_desc:0 "Every army in the world needs chromium for armour plate and gun barrels, and Turkey has more of it than almost anyone. Both sides will pay for it.\n\n§GUnlocks chromium deals with Germany, Britain and the Soviet Union.§!"
 TRX_milli_piyango:0 "The National Lottery"
 TRX_milli_piyango_desc:0 "Milli Piyango, founded in 1939, funds the treasury from the dreams of millions of ticket buyers.\n\n§GUnlocks a yearly lottery draw with a very good expected return.§!"
 TRX_lira_reform:0 "A Strong Lira"
 TRX_lira_reform_desc:0 "A stable, trusted lira will attract capital and cut the cost of every import."
 TRX_eximbank:0 "The Export Credit Bank"
 TRX_eximbank_desc:0 "Cheap credit for exporters will open foreign markets for Turkish mines and mills."
 TRX_free_trade_zones:0 "Free Trade Zones"
 TRX_free_trade_zones_desc:0 "Duty-free zones in Mersin and İzmir will turn our ports into the warehouses of the Eastern Mediterranean."
 TRX_middle_corridor:0 "The Middle Corridor"
 TRX_middle_corridor_desc:0 "Between Europe and Asia, the shortest trade route runs through Anatolia, the Caucasus and the Caspian. Turkey will make itself the bridge."
 TRX_energy_hub:0 "Energy Hub of Eurasia"
 TRX_energy_hub_desc:0 "Pipelines from the Caucasus and Mesopotamia to Ceyhan on the Mediterranean will make Turkey the gateway of Eurasian oil."
 TRX_istanbul_finance_centre:0 "Istanbul Finance Centre"
 TRX_istanbul_finance_centre_desc:0 "Banks, insurers and trading houses from three continents gather on the Bosphorus. Istanbul is once again the capital of a world economy."
 TRX_first_five_year_plan:0 "The First Five-Year Industrial Plan"
 TRX_first_five_year_plan_desc:0 "Modelled on Soviet planning but run by the Republic, the plan will build the textile mills, paper works and cement plants Turkey lacks.\n\n§GStarts a mission: meet the plan's factory targets within a year.§!"
 TRX_sumerbank:0 "Sümerbank Textile Combines"
 TRX_sumerbank_desc:0 "The state bank Sümerbank will finance great textile combines in Bursa and Kayseri, clothing the nation with Turkish cotton."
 TRX_etibank:0 "The Etibank Mining Concern"
 TRX_etibank_desc:0 "Founded in 1935, Etibank will develop the mines and power stations private capital will not touch."
 TRX_sugar_and_cement:0 "Sugar and Cement"
 TRX_sugar_and_cement_desc:0 "Sugar refineries and cement works were the first fruits of state industry. They feed the people and build everything else."
 TRX_karabuk_steel_works:0 "The Karabük Iron and Steel Works"
 TRX_karabuk_steel_works_desc:0 "Near the Zonguldak coalfield, British engineers and Turkish workers are building the country's first integrated steel mill."
 TRX_great_economic_debate:0 "The Great Economic Debate"
 TRX_great_economic_debate_desc:0 "Celal Bayar wants private enterprise; İsmet İnönü's statists want the state to lead. The Republic must choose."
 TRX_great_economic_debate_tt:0 "Unlocks a choice between §YStatism§! and §YPrivate Enterprise§!. Both lead on to the §YMixed Economy§!."
 TRX_statism:0 "Commit to Statism"
 TRX_statism_desc:0 "The state will plan, finance and own the commanding heights of the economy."
 TRX_liberal_market:0 "Private Enterprise"
 TRX_liberal_market_desc:0 "Private enterprise, foreign trade and a stable lira will build prosperity faster than any bureaucrat."
 TRX_tekel_monopoly:0 "The Tekel Monopoly"
 TRX_tekel_monopoly_desc:0 "The state monopoly on tobacco, salt and spirits fills the treasury, though smokers and drinkers grumble about the prices."
 TRX_state_heavy_industry:0 "State Heavy Industry"
 TRX_state_heavy_industry_desc:0 "Machine works, chemical plants and arsenals, built and owned by the state."
 TRX_holding_companies:0 "The Great Holdings"
 TRX_holding_companies_desc:0 "Vehbi Koç in Ankara and Hacı Ömer Sabancı in Adana are building business empires. The state will help them grow."
 TRX_foreign_investment_law:0 "The Foreign Investment Law"
 TRX_foreign_investment_law_desc:0 "Foreign companies that build in Turkey will be protected and allowed to take their profits home."
 TRX_mixed_economy:0 "The Mixed Economy"
 TRX_mixed_economy_desc:0 "State and private enterprise each have their place. Turkey will use both."
 TRX_second_five_year_plan:0 "The Second Five-Year Plan"
 TRX_second_five_year_plan_desc:0 "The first plan built light industry. The second will build heavy industry and power.\n\n§GStarts a mission with larger factory targets.§!"
 TRX_anatolian_tigers:0 "The Anatolian Tigers"
 TRX_anatolian_tigers_desc:0 "Kayseri, Konya, Antalya and Afyon: a new generation of provincial entrepreneurs is turning market towns into industrial cities."
 TRX_export_led_growth:0 "Export-Led Growth"
 TRX_export_led_growth_desc:0 "Turkish goods will compete on world markets, and the foreign currency they earn will pay for the next round of factories."
 TRX_industrial_heartland:0 "An Anatolian Industrial Heartland"
 TRX_industrial_heartland_desc:0 "The once agrarian heart of Anatolia is now ringed with factories, mines and power stations."
 TRX_nationalize_the_railways:0 "Nationalise the Railways"
 TRX_nationalize_the_railways_desc:0 "Foreign-owned railway concessions are being bought back one by one. A national network will bind Anatolia together."
 TRX_iron_nets:0 "Iron Nets"
 TRX_iron_nets_desc:0 "§Y“Demir ağlarla ördük anayurdu dört baştan.”§! We wove the homeland with iron nets from end to end. The railway campaign of the 1930s goes on."
 TRX_eastern_railways:0 "The Eastern Railways"
 TRX_eastern_railways_desc:0 "Lines to Erzurum, Diyarbakır and Van will bring the east into the life of the nation and let the army reach the frontier in days rather than weeks."
 TRX_highway_program:0 "The Highway Programme"
 TRX_highway_program_desc:0 "Asphalt roads and a national highways directorate will put Anatolia on wheels."
 TRX_baghdad_railway:0 "Complete the Baghdad Railway"
 TRX_baghdad_railway_desc:0 "The line begun before the Great War still has gaps. Completed, it will link Istanbul to the Persian Gulf."
 TRX_black_sea_ports:0 "Black Sea Ports"
 TRX_black_sea_ports_desc:0 "New harbours in Trabzon and Samsun will open the Black Sea coast to trade and industry."
 TRX_bosphorus_bridge:0 "Bridge the Bosphorus"
 TRX_bosphorus_bridge_desc:0 "A bridge between Europe and Asia: the engineers say it can be done.\n\n§GUnlocks the Bosphorus Bridge megaproject.§!"
 TRX_kanal_istanbul:0 "Kanal İstanbul"
 TRX_kanal_istanbul_desc:0 "A second strait, dug west of the city, will double the capacity of the Bosphorus and bring a fortune in transit trade.\n\n§GUnlocks the Kanal İstanbul megaproject.§!"
 TRX_mta_institute:0 "The Mineral Research Institute"
 TRX_mta_institute_desc:0 "The MTA, founded in 1935, will map every mineral deposit in Anatolia.\n\n§GUnlocks mineral prospecting decisions.§!"
 TRX_zonguldak_coalfields:0 "The Zonguldak Coalfields"
 TRX_zonguldak_coalfields_desc:0 "Black Sea coal fuels our railways, our steel mills and our power stations."
 TRX_guleman_chromium:0 "The Guleman Chromite Mines"
 TRX_guleman_chromium_desc:0 "The mines near Elazığ hold some of the richest chromite ore in the world."
 TRX_raman_oil_fields:0 "Explore the Raman Oil Fields"
 TRX_raman_oil_fields_desc:0 "Geologists believe there is oil beneath Raman Mountain near Batman. Turkey must drill for it."
 TRX_divrigi_iron:0 "The Divriği Iron Mines"
 TRX_divrigi_iron_desc:0 "Rich iron ore near Sivas will feed the furnaces of Karabük."
 TRX_seyhan_dam:0 "The Seyhan Dam"
 TRX_seyhan_dam_desc:0 "A dam above Adana will tame the Seyhan, irrigate the Çukurova plain and power the city's mills."
 TRX_tpao:0 "The Turkish Petroleum Corporation"
 TRX_tpao_desc:0 "TPAO will drill wherever oil might be found.\n\n§GUnlocks wildcat drilling: a gamble for oil in the south-east.§!"
 TRX_national_power_grid:0 "A National Power Grid"
 TRX_national_power_grid_desc:0 "High-voltage lines will carry power from the coal and hydroelectric plants to every industrial town."
 TRX_keban_dam:0 "The Keban Dam"
 TRX_keban_dam_desc:0 "The first great dam on the Euphrates will power half of eastern Anatolia."
 TRX_synthetic_fuel_program:0 "Synthetic Fuel Programme"
 TRX_synthetic_fuel_program_desc:0 "Oil can be blockaded. Coal and chemistry cannot.\n\n§GUnlocks a synthetic rubber plant in İzmit.§!"
 TRX_southeastern_anatolia_project:0 "The Southeastern Anatolia Project"
 TRX_southeastern_anatolia_project_desc:0 "GAP: dozens of dams and power plants on the Euphrates and the Tigris will turn Upper Mesopotamia green again.\n\n§GUnlocks the Atatürk Dam megaproject.§!"
 TRX_atomic_energy_commission:0 "The Atomic Energy Commission"
 TRX_atomic_energy_commission_desc:0 "Turkish physicists will study the atom. Whatever the great powers can do, Turkey must at least understand.\n\n§GUnlocks the research reactor megaproject.§!"
 TRX_national_defense_industry:0 "A National Defence Industry"
 TRX_national_defense_industry_desc:0 "No nation that must buy its weapons abroad is truly independent."
 TRX_mke_corporation:0 "The Machinery and Chemical Industry Corporation"
 TRX_mke_corporation_desc:0 "MKE will unite the state arsenals of Kırıkkale, Ankara and Istanbul into a single armaments concern."
 TRX_aviation_industry:0 "The Aviation Industry"
 TRX_aviation_industry_desc:0 "An aircraft industry in Eskişehir will build what the Kayseri works can only assemble."
 TRX_devrim_automobile:0 "Devrim: the National Car"
 TRX_devrim_automobile_desc:0 "The engineers of the state railways say they can build a car in a few months. They will prove it, and then they will build lorries."
 TRX_military_electronics:0 "Military Electronics"
 TRX_military_electronics_desc:0 "Radios, radar and fire control: modern war is fought with electrons as much as with steel."
 TRX_rocket_program:0 "The Rocket Programme"
 TRX_rocket_program_desc:0 "Rockets are cheaper than aircraft and harder to stop."
 TRX_arms_exports:0 "Arms Exports"
 TRX_arms_exports_desc:0 "Turkish rifles and ammunition will find buyers across the Middle East.\n\n§GUnlocks a decision to sell surplus rifles for political power.§!"
 TRX_defense_self_sufficiency:0 "Defence Self-Sufficiency"
 TRX_defense_self_sufficiency_desc:0 "Every rifle, shell, engine and radio our army needs is now made in Turkey."
 TRX_tractors_for_the_villages:0 "Tractors for the Villages"
 TRX_tractors_for_the_villages_desc:0 "Ploughs drawn by oxen cannot feed an industrial nation. Tractors can."
 TRX_cukurova_cotton:0 "Çukurova Cotton"
 TRX_cukurova_cotton_desc:0 "The plain around Adana can grow cotton for every mill in the country, and for export."
 TRX_land_reform:0 "Land to the Tiller"
 TRX_land_reform_desc:0 "The great estates will be divided among the families who farm them."
 TRX_breadbasket:0 "Breadbasket of the Middle East"
 TRX_breadbasket_desc:0 "Turkey feeds itself, and its neighbours too."
 TRX_among_the_great_powers:0 "Among the Great Powers"
 TRX_among_the_great_powers_desc:0 "Steel, oil, banks, factories and science: Turkey now has everything a great power needs, and the world has noticed."

 ### Society and science ###
 TRX_village_institutes:0 "The Village Institutes"
 TRX_village_institutes_desc:0 "Village children will be trained as teachers, farmers and craftsmen, then sent home to teach others. The Köy Enstitüleri will light up the countryside."
 TRX_language_revolution:0 "The Language Revolution"
 TRX_language_revolution_desc:0 "A new alphabet and a purified Turkish language bring literacy within reach of every citizen."
 TRX_university_reform:0 "University Reform"
 TRX_university_reform_desc:0 "Istanbul University has welcomed scholars fleeing Germany. With their help, Turkey will train its own scientists and engineers."
 TRX_religious_affairs:0 "The Directorate of Religious Affairs"
 TRX_religious_affairs_desc:0 "The Diyanet appoints every imam and writes every Friday sermon. Religion will be respected, and kept out of politics."
 TRX_scientific_republic:0 "A Scientific Republic"
 TRX_scientific_republic_desc:0 "“The truest guide in life is science.” Atatürk's words will be carved over the gates of every laboratory."
 TRX_womens_rights:0 "Women's Rights"
 TRX_womens_rights_desc:0 "Turkish women won the vote in 1934, before the women of France and Italy. Now they will fill the universities, the offices and the factories."
 TRX_national_unity:0 "National Unity"
 TRX_national_unity_desc:0 "From Edirne to Van, the Republic is one nation."
 TRX_peoples_houses:0 "The People's Houses"
 TRX_peoples_houses_desc:0 "The Halkevleri bring theatre, libraries, sport and politics to every town in the country."

 ### The East ###
 TRX_eastern_concessions:0 "Concessions to the East"
 TRX_eastern_concessions_desc:0 "Force has not settled the east and never will. An amnesty, schools in Kurdish, local officials and investment will.\n\n§GGain cores on the four south-eastern states and end their resistance and unrest.§!"
 TRX_cultural_rights:0 "Cultural Rights"
 TRX_cultural_rights_desc:0 "Newspapers, music and schools in Kurdish will no longer be crimes."
 TRX_eastern_development_plan:0 "The Eastern Development Plan"
 TRX_eastern_development_plan_desc:0 "The east has been neglected for generations. Roads, schools and factories will do more for unity than garrisons ever could."
 TRX_eastern_university:0 "A University in Erzurum"
 TRX_eastern_university_desc:0 "A university in the east will train doctors, engineers and teachers for the east."
 TRX_common_homeland:0 "A Common Homeland"
 TRX_common_homeland_desc:0 "Turks and Kurds fought side by side at Gallipoli and Sakarya. The Republic is their common home."

 ### Effect tooltips ###
 TRX_saadabad_pact_tt:0 "§YIran§!, §YIraq§! and §YAfghanistan§! will be offered a §Ynon-aggression pact§!."
 TRX_balkan_entente_tt:0 "§YGreece§!, §YYugoslavia§! and §YRomania§! will be offered a §Ynon-aggression pact§!."
 TRX_invite_saadabad_tt:0 "§YIran§!, §YIraq§! and §YAfghanistan§! will be invited to join our alliance."
 TRX_invite_balkan_tt:0 "§YGreece§!, §YYugoslavia§!, §YRomania§! and §YBulgaria§! will be invited to join our alliance."
 TRX_hatay_demand_tt:0 "The owner of §YHatay§! will be asked to hand it over. If they refuse, we may take it by force."
 TRX_unlock_janissary_tt:0 "§GUnlocks the §YJanissary Guard§! battalion§! and a matching division template."
 TRX_unlock_straits_artillery_tt:0 "§GUnlocks the §YStraits Fortress Artillery§! support company§! and a matching division template."
 TRX_unlock_mountain_commando_tt:0 "§GUnlocks the §YMountain Commando§! battalion§! and a matching division template."
 TRX_unlock_akinci_tt:0 "§GUnlocks the §YAkıncı Cavalry§! battalion§! and a matching division template."
 TRX_rumelia_claims_tt:0 "Gain §Yclaims§! on the core territories of §YGreece§!, §YBulgaria§! and §YAlbania§!, and on §YMacedonia§! and §YKosovo§!."
 TRX_kayser_claims_tt:0 "Gain §Yclaims§! on the core territories of §YItaly§! and §YGreece§!."
 TRX_turkic_claims_tt:0 "Gain §Yclaims§! on the Turkic lands of the §YCrimea§!, the §YVolga§!, §YCentral Asia§! and §YEast Turkestan§!."
